name: Apply Internal Course Room Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-internal-course-room-rules.cjs'
      - '.github/workflows/apply-internal-course-room-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/patch-internal-course-room-rules.cjs
      - run: |
          node --check course-scheduler.js
          grep -q "roomKindOf" course-scheduler.js
          grep -q "businessHoursVersion" course-scheduler.js
          grep -q "不定時教室只供暫時放置" course-scheduler.js
          grep -q "視訊教室不是實體教室" course-scheduler.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-scheduler.js
          git commit -m "Publish internal course business hours and room defaults"
          git push origin HEAD:main