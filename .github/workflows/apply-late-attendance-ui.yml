name: Apply Late Attendance UI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-late-attendance-ui.cjs'
      - '.github/workflows/apply-late-attendance-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/add-late-attendance-ui.cjs
      - run: node --check teacher-course-portal-v8.js
      - run: |
          grep -q 'data-late-attendance' teacher-course-portal.html
          grep -q 'coursePortalTeacherLateAttendance' teacher-course-portal-v8.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-course-portal.html teacher-course-portal-v8.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish teacher late attendance action"
          git push origin HEAD:main
