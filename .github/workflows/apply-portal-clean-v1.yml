name: Apply Clean Portal UI

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-portal-clean-v1.cjs'
      - '.github/workflows/apply-portal-clean-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/patch-portal-clean-v1.cjs
      - run: |
          node --check teacher-course-portal-v8.js
          node --check teacher-room-rules-v1.js
          grep -q "portal-clean-ui-v1.css" teacher-course-portal.html
          grep -q "teacher-room-rules-v1.js" teacher-course-portal.html
          grep -q "portal-clean-ui-v1.css" student-course-portal.html
          grep -q "getDay() !== 1" teacher-course-portal-v8.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-course-portal.html teacher-course-portal-v8.js student-course-portal.html
          git commit -m "Publish clean teacher and student portal selections"
          git push origin HEAD:main