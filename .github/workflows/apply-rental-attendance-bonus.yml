name: Apply Rental Attendance Bonus

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/extend-rental-attendance-bonus.cjs'
      - '.github/workflows/apply-rental-attendance-bonus.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rental-attendance-bonus-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and verify
        shell: bash
        run: |
          set +e
          {
            echo "BEGIN"
            echo "CORRECTED_RUN=20260730"
            node .github/scripts/extend-rental-attendance-bonus.cjs
            PATCH_STATUS=$?
            echo "PATCH_STATUS=$PATCH_STATUS"
            node --check functions/coursePortal.js
            BACKEND_STATUS=$?
            echo "BACKEND_STATUS=$BACKEND_STATUS"
            node --check teacher-course-portal-v8.js
            TEACHER_STATUS=$?
            echo "TEACHER_STATUS=$TEACHER_STATUS"
            grep -q "coursePortalAdminSaveRentalSettings" functions/coursePortal.js
            echo "RENTAL_SETTINGS=$?"
            grep -q "coursePortalTeacherLateAttendance" functions/coursePortal.js
            echo "LATE_ATTENDANCE=$?"
            grep -q "coursePortalTeacherBonusRequest" functions/coursePortal.js
            echo "BONUS_REQUEST=$?"
            grep -q "course-portal-settings.html" operations-course-inline-template.html
            echo "ADMIN_LINK=$?"
            grep -q "bonusRequestModal" teacher-course-portal.html
            echo "BONUS_MODAL=$?"
            echo "END"
          } > .github/rental-feature-build-report.txt 2>&1
      - name: Commit generated files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish rental attendance bonus build report"
          git push origin HEAD:main
