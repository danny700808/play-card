name: Apply Rental Policy V3

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch-rental-policy-v3.cjs'
      - '.github/workflows/apply-rental-policy-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rental-policy-v3-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: node .github/scripts/patch-rental-policy-v3.cjs
      - name: Verify syntax and features
        run: |
          node --check functions/coursePortal.js
          grep -q "DEFAULT_BUSINESS_HOURS" functions/coursePortal.js
          grep -q "coursePortalAdminRentalSettingsData" functions/coursePortal.js
          grep -q "coursePortalRoomLocks" functions/coursePortal.js
          grep -q "星期一為公休日" functions/coursePortal.js
          grep -q "studentDiscountRequested" functions/coursePortal.js
      - name: Commit generated backend
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/coursePortal.js
          git commit -m "Publish rental policy business hours and room rules"
          git push origin HEAD:main