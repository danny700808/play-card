name: Publish In-Place Course Workspace

on:
  push:
    branches:
      - main
    paths:
      - "course-scheduler.html"
      - "course-scheduler.css"
      - "course-scheduler.js"
      - "course-scheduler-data.js"
      - "operations-course-inline.js"
      - "operations-course-inline-template.html"
      - "operations-course-inline-runtime.js"
      - "operations-phase1.js"
      - "portal.html"
      - "operations-hub.html"
      - "course-center.html"
      - ".github/scripts/build-inline-course-workspace.cjs"
      - ".github/workflows/build-live-course-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-in-place-course-workspace-main
  cancel-in-progress: false

jobs:
  publish-and-verify-inline-course:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build complete in-place course workspace
        run: node .github/scripts/build-inline-course-workspace.cjs

      - name: Verify one navigation shell and complete course functions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const operations = fs.readFileSync('operations-phase1.js', 'utf8');
          const controller = fs.readFileSync('operations-course-inline.js', 'utf8');
          const runtime = fs.readFileSync('operations-course-inline-runtime.js', 'utf8');
          const template = fs.readFileSync('operations-course-inline-template.html', 'utf8');
          const scheduler = fs.readFileSync('course-scheduler.js', 'utf8');
          const portal = fs.readFileSync('portal.html', 'utf8');
          const hub = fs.readFileSync('operations-hub.html', 'utf8');
          const center = fs.readFileSync('course-center.html', 'utf8');

          new vm.Script(controller, { filename: 'operations-course-inline.js' });
          new vm.Script(runtime, { filename: 'operations-course-inline-runtime.js' });
          new vm.Script(scheduler, { filename: 'course-scheduler.js' });

          if (!operations.includes('YouziOperationsCourseInline.mount(content,courseView)')) throw new Error('Operations center does not mount the inline course workspace');
          if (operations.includes('<iframe id="opsCourseFrame"')) throw new Error('Legacy course iframe is still present');
          if (operations.includes('frame.contentWindow.postMessage')) throw new Error('Legacy iframe messaging is still present');

          for (const source of [portal, hub]) {
            const links = [
              ['#course-calendar','course-calendar'],
              ['#course-students','course-students'],
              ['#course-teachers','course-teachers'],
              ['#course-settings','course-settings']
            ];
            for (const [href, view] of links) {
              if (!source.includes(`href="${href}" data-view="${view}"`)) throw new Error(`In-place course navigation is missing: ${view}`);
            }
            if (!source.includes('operations-course-inline.js?v=20260729-operations-inline-course-v1')) throw new Error('Inline course controller is missing');
            if (source.includes('location.replace(\'course-scheduler.html')) throw new Error('Course navigation still leaves the operations center');
            if (source.includes('course-scheduler.html?view=')) throw new Error('Standalone course links are still enabled');
          }

          if (!controller.includes('attachShadow({ mode: \'open\' })')) throw new Error('Shadow-root isolation is missing');
          if (!controller.includes("WORKSPACE_KEY = 'workspace'")) throw new Error('Workspace source is missing');
          if (!controller.includes("LATEST_KEY = 'latest'")) throw new Error('Latest source is missing');
          if (!controller.includes('isDemo')) throw new Error('Demo-data rejection is missing');
          if (!controller.includes('YouziCoursePreviewData.load')) throw new Error('Read-only mirror recovery is missing');
          if (controller.includes('YouziCoursePreviewData.sync')) throw new Error('Opening the page must not automatically synchronize Injiaoyun');
          if (!runtime.includes('window.__YOUZI_COURSE_INLINE_DOCUMENT__')) throw new Error('Scoped full runtime is missing');
          if (!runtime.includes('window.__YOUZI_COURSE_INLINE_BOOTSTRAP_STATE__')) throw new Error('Workspace-first runtime startup is missing');
          if (!runtime.includes("if(!window.__YOUZI_COURSE_INLINE_MODE__)restoreFormalDatabase();")) throw new Error('Duplicate startup restore is still enabled');

          const requiredTemplateIds = [
            'calendarPage','studentsPage','teachersPage','settingsPage',
            'scheduleModal','eventModal','studentModal','tuitionModal',
            'transactionModal','teacherPayrollModal','policyModal'
          ];
          for (const id of requiredTemplateIds) {
            if (!template.includes(`id="${id}"`)) throw new Error(`Full course UI is missing: ${id}`);
          }
          if (!template.includes('course-portal-admin.html')) throw new Error('Entry and binding management is missing');
          if (!template.includes('data-settings-tab="rooms"') || !template.includes('data-settings-tab="subjects"') || !template.includes('data-settings-tab="fees"')) throw new Error('Course settings are incomplete');

          const requiredFunctions = [
            'function bindRoomReorder',
            'function bindFeeReorder',
            'function setAttendance',
            'function eventAction',
            'function openTeacherPayroll',
            'function openPolicy',
            'function syncInjiaoyun',
            'function submitSchedule',
            'function submitTuition',
            'function submitTransaction'
          ];
          for (const marker of requiredFunctions) {
            if (!scheduler.includes(marker) || !runtime.includes(marker)) throw new Error(`Full scheduler function is missing: ${marker}`);
          }

          if (!center.includes("location.replace('portal.html#'+(map[view]||'course-calendar'))")) throw new Error('Old course-center address does not return to the operations center');
          for (const obsolete of [
            'course-scheduler-full-bootstrap.js',
            'course-scheduler-standalone.css',
            '.github/scripts/restore-full-course-center.cjs'
          ]) {
            if (fs.existsSync(obsolete)) throw new Error(`Obsolete standalone course layer still exists: ${obsolete}`);
          }

          console.log('Complete in-place course workspace verified');
          NODE

      - name: Commit generated in-place course files
        run: |
          if git diff --quiet; then
            echo "In-place course workspace files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete in-place course workspace"
          git push origin HEAD:main
