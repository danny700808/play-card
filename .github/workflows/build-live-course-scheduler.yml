name: Verify Interactive Course Scheduler

on:
  push:
    branches:
      - main
    paths:
      - "operations-hub.html"
      - "portal.html"
      - "operations-course-authoritative-v1.js"
      - "course-scheduler-live.html"
      - "course-scheduler-live-entry-v1.js"
      - "course-scheduler.js"
      - "course-scheduler-data.js"
      - ".github/workflows/build-live-course-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-interactive-course-scheduler-main
  cancel-in-progress: true

jobs:
  verify-interactive-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify one interactive scheduler path
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const hub = fs.readFileSync('operations-hub.html', 'utf8');
          const portal = fs.readFileSync('portal.html', 'utf8');
          const route = fs.readFileSync('operations-course-authoritative-v1.js', 'utf8');
          const live = fs.readFileSync('course-scheduler-live.html', 'utf8');
          const entry = fs.readFileSync('course-scheduler-live-entry-v1.js', 'utf8');
          const scheduler = fs.readFileSync('course-scheduler.js', 'utf8');

          new vm.Script(route, { filename: 'operations-course-authoritative-v1.js' });
          new vm.Script(entry, { filename: 'course-scheduler-live-entry-v1.js' });
          new vm.Script(scheduler, { filename: 'course-scheduler.js' });

          const disabledScripts = [
            'operations-course-persistence-v1.js',
            'operations-course-simple-full-v1.js',
            'operations-course-snapshot-bridge-v1.js',
            'operations-course-live-route-v1.js'
          ];

          for (const source of [hub, portal]) {
            if (!source.includes('operations-course-authoritative-v1.js?v=20260729-interactive-course-v1')) {
              throw new Error('Authoritative interactive scheduler route is missing');
            }
            for (const script of disabledScripts) {
              if (source.includes(script)) throw new Error(`Conflicting course patch is still enabled: ${script}`);
            }
          }

          if (!route.includes('course-scheduler-live.html')) throw new Error('Interactive scheduler route target is missing');
          if (!live.includes('course-scheduler-live-entry-v1.js?v=20260729-live-full-scheduler-v2')) {
            throw new Error('Interactive live scheduler entry is missing');
          }
          if (!entry.includes("WORKSPACE_KEY = 'workspace'")) throw new Error('Workspace-first loading is missing');
          if (!entry.includes("FORMAL_KEY = 'latest'")) throw new Error('Formal snapshot fallback is missing');
          if (!entry.includes("CLOUD_FUNCTION = 'loadInjiaoyunEducationMirrorAuto'")) throw new Error('Cloud fallback is missing');
          if (!scheduler.includes("function syncInjiaoyun()")) throw new Error('Manual sync function is missing');
          if (!scheduler.includes("preserveConfiguration:true")) throw new Error('Manual sync configuration preservation is missing');

          console.log('Single interactive course scheduler path verified');
          NODE
