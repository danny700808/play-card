name: Build Live Course Scheduler

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-live-course-scheduler-main
  cancel-in-progress: false

jobs:
  build-live-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build live scheduler page
        run: node .github/scripts/build-live-course-scheduler.cjs

      - name: Verify deterministic startup
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('course-scheduler-live.html', 'utf8');
          const entry = fs.readFileSync('course-scheduler-live-entry-v1.js', 'utf8');
          const hub = fs.readFileSync('operations-hub.html', 'utf8');
          const portal = fs.readFileSync('portal.html', 'utf8');
          const simpleFull = fs.readFileSync('operations-course-simple-full-v1.js', 'utf8');
          const persistence = fs.readFileSync('operations-course-persistence-v1.js', 'utf8');
          const route = fs.readFileSync('operations-course-live-route-v1.js', 'utf8');
          new vm.Script(simpleFull, { filename: 'operations-course-simple-full-v1.js' });
          new vm.Script(persistence, { filename: 'operations-course-persistence-v1.js' });
          new vm.Script(route, { filename: 'operations-course-live-route-v1.js' });
          if (!html.includes('course-scheduler-live-entry-v1.js?v=20260729-live-full-scheduler-v2')) throw new Error('Live scheduler entry missing');
          if (html.includes('course-scheduler-startup-gate-v1.js')) throw new Error('Legacy startup gate must not be loaded');
          if (html.includes('course-data-auto-bootstrap-v1.js')) throw new Error('Legacy auto reload bootstrap must not be loaded');
          if (html.includes('history.replaceState')) throw new Error('Live scheduler must not change back to the old URL');
          if (html.includes('<script src="course-scheduler.js')) throw new Error('Scheduler must be loaded only after data is ready');
          if (!entry.includes("CLOUD_FUNCTION = 'loadInjiaoyunEducationMirrorAuto'")) throw new Error('Direct cloud fallback missing');
          if (!entry.includes("type: 'youzi-course-snapshot-request'")) throw new Error('Parent snapshot request missing');
          if (!simpleFull.includes("DB_NAME = 'youzi-course-scheduler'")) throw new Error('Full schedule does not read the saved course database');
          if (!simpleFull.includes('目前顯示上次成功保存的課表')) throw new Error('Saved-data display rule missing');
          if (!persistence.includes('isDirectCalendar(value)')) throw new Error('Course persistence does not bypass the legacy calendar iframe');
          if (route.includes("'course-calendar': 'calendar'")) throw new Error('Legacy iframe router still owns the full calendar');
          for (const source of [hub, portal]) {
            if (!source.includes('operations-course-simple-full-v1.js?v=20260729-simple-full-v2')) throw new Error('Database-backed full schedule script missing');
            if (!source.includes('operations-course-live-route-v1.js?v=20260729-direct-calendar-v1')) throw new Error('Direct calendar route cache version missing');
            if (!source.includes('operations-course-persistence-v1.js?v=20260729-direct-calendar-v1')) throw new Error('Direct calendar persistence cache version missing');
          }
          console.log('Live scheduler and database-backed full schedule verified');
          NODE

      - name: Commit generated files
        run: |
          if git diff --quiet -- course-scheduler-live.html operations-hub.html portal.html; then
            echo "Live scheduler files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-scheduler-live.html operations-hub.html portal.html
          git commit -m "Publish deterministic live full scheduler"
          git push origin HEAD:main
