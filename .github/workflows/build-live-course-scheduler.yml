name: Verify Fresh Course Center

on:
  push:
    branches:
      - main
    paths:
      - "course-center.html"
      - "course-center.css"
      - "course-center.js"
      - "course-scheduler-data.js"
      - "operations-hub.html"
      - "portal.html"
      - ".github/workflows/build-live-course-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-fresh-course-center-main
  cancel-in-progress: true

jobs:
  verify-fresh-course-center:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify standalone course center
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const html = fs.readFileSync('course-center.html', 'utf8');
          const css = fs.readFileSync('course-center.css', 'utf8');
          const js = fs.readFileSync('course-center.js', 'utf8');
          const hub = fs.readFileSync('operations-hub.html', 'utf8');
          const portal = fs.readFileSync('portal.html', 'utf8');

          new vm.Script(js, { filename: 'course-center.js' });

          if (!html.includes('course-center.css?v=20260729-fresh-course-v1')) throw new Error('Fresh course CSS is missing');
          if (!html.includes('course-center.js?v=20260729-fresh-course-v1')) throw new Error('Fresh course runtime is missing');
          if (!html.includes('course-scheduler-data.js?v=20260729-fresh-course-v1')) throw new Error('Mirror data adapter is missing');
          if (!css.includes('.schedule-grid')) throw new Error('Fresh schedule grid styling is missing');

          for (const source of [hub, portal]) {
            for (const page of ['calendar','students','teachers','settings']) {
              if (!source.includes(`course-center.html#${page}`)) throw new Error(`Fresh course link is missing: ${page}`);
            }
            if (source.includes('operations-course-authoritative-v1.js')) throw new Error('Legacy iframe course route is still enabled');
            if (source.includes('opsCoursePersistentHost')) throw new Error('Legacy course iframe host is still present');
          }

          if (!js.includes("WORKSPACE_KEY = 'workspace'")) throw new Error('Workspace source is missing');
          if (!js.includes("LATEST_KEY = 'latest'")) throw new Error('Latest source is missing');
          if (!js.includes('readLegacyState')) throw new Error('Legacy real-data recovery is missing');
          if (!js.includes('demoState')) throw new Error('Demo-data rejection is missing');
          if (!js.includes('YouziCoursePreviewData.load')) throw new Error('Read-only mirror loading is missing');
          if (js.includes('YouziCoursePreviewData.sync')) throw new Error('Fresh center must not auto-sync Injiaoyun');
          if (!js.includes('writeDatabase')) throw new Error('Workspace persistence is missing');
          if (!js.includes('renderCalendar')) throw new Error('Calendar rendering is missing');
          if (!js.includes('saveCourse')) throw new Error('Workspace course creation is missing');

          console.log('Fresh standalone course center verified');
          NODE
