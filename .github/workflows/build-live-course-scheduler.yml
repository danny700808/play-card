name: Publish Unified Course Workspace

on:
  push:
    branches:
      - main
    paths:
      - "course-scheduler.html"
      - "course-scheduler.css"
      - "course-scheduler.js"
      - "course-scheduler-data.js"
      - "operations-course-inline.js"
      - "operations-course-inline-template.html"
      - "operations-course-inline-runtime.js"
      - "operations-phase1.js"
      - "portal.html"
      - "operations-hub.html"
      - "course-center.html"
      - ".github/scripts/build-inline-course-workspace.cjs"
      - ".github/workflows/build-live-course-scheduler.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-unified-course-workspace-main
  cancel-in-progress: true

jobs:
  publish-and-verify-unified-course:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build one desktop and mobile course workspace
        run: node .github/scripts/build-inline-course-workspace.cjs

      - name: Verify internal course workspace
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const operations = fs.readFileSync('operations-phase1.js', 'utf8');
          const controller = fs.readFileSync('operations-course-inline.js', 'utf8');
          const runtime = fs.readFileSync('operations-course-inline-runtime.js', 'utf8');
          const template = fs.readFileSync('operations-course-inline-template.html', 'utf8');
          const scheduler = fs.readFileSync('course-scheduler.js', 'utf8');
          const schedulerCss = fs.readFileSync('course-scheduler.css', 'utf8');
          const portal = fs.readFileSync('portal.html', 'utf8');
          const hub = fs.readFileSync('operations-hub.html', 'utf8');
          const center = fs.readFileSync('course-center.html', 'utf8');

          new vm.Script(controller, { filename: 'operations-course-inline.js' });
          new vm.Script(runtime, { filename: 'operations-course-inline-runtime.js' });
          new vm.Script(scheduler, { filename: 'course-scheduler.js' });
          new vm.Script(operations, { filename: 'operations-phase1.js' });

          if (!operations.includes('YouziOperationsCourseInline.mount(content,courseView)')) throw new Error('Operations center does not mount the inline course workspace');
          if (operations.includes('<iframe id="opsCourseFrame"')) throw new Error('Legacy course iframe is still present');
          if (operations.includes('frame.contentWindow.postMessage')) throw new Error('Legacy iframe messaging is still present');

          for (const source of [portal, hub]) {
            const links = [
              ['#course-calendar','course-calendar'],
              ['#course-students','course-students'],
              ['#course-teachers','course-teachers'],
              ['#course-settings','course-settings']
            ];
            for (const [href, view] of links) {
              if (!source.includes(`href="${href}" data-view="${view}"`)) throw new Error(`In-place course navigation is missing: ${view}`);
            }
            if (!source.includes('operations-course-inline.js?v=20260829-legacy-student-name-v1')) throw new Error('Unified course controller is missing');
            if (source.includes("location.replace('course-scheduler.html")) throw new Error('Course navigation still leaves the operations center');
            if (source.includes('course-scheduler.html?view=')) throw new Error('Standalone course links are still enabled');
            if (source.includes('operations-mobile-course-fix-v1.js')) throw new Error('Duplicate mobile course JavaScript is still enabled');
            if (source.includes('operations-mobile-course-dense-v1.css')) throw new Error('Obsolete second mobile course layout is still enabled');
          }

          if (!controller.includes("attachShadow({ mode: 'open' })")) throw new Error('Shadow-root isolation is missing');
          if (!controller.includes("WORKSPACE_KEY = 'workspace'")) throw new Error('Workspace source is missing');
          if (!controller.includes("LATEST_KEY = 'latest'")) throw new Error('Latest source is missing');
          if (!controller.includes('isDemo')) throw new Error('Demo-data rejection is missing');
          if (controller.includes('YouziCoursePreviewData.load')) throw new Error('Opening the page still reads a mirror automatically');
          if (controller.includes('YouziCoursePreviewData.sync')) throw new Error('Opening the page still synchronizes Injiaoyun automatically');
          if (!controller.includes("#opsCourseSubmenu a[data-view]")) throw new Error('Same-page course navigation listener is missing');

          if (!runtime.includes('window.__YOUZI_COURSE_INLINE_DOCUMENT__')) throw new Error('Scoped full runtime is missing');
          if (!runtime.includes('window.__YOUZI_COURSE_INLINE_BOOTSTRAP_STATE__')) throw new Error('Workspace-first runtime startup is missing');
          if (!runtime.includes('refreshPortalRentals();')) throw new Error('Portal rentals are not refreshed during startup');
          if (!runtime.includes('function refreshTeacherPayrollMonth(monthKey)')) throw new Error('Teacher payroll month does not refresh from the cloud');
          if (!runtime.includes("$('teacherPayrollRefreshBtn').addEventListener('click'")) throw new Error('Teacher payroll retry action is missing');
          if (runtime.includes('restoreFormalDatabase().then(refreshPortalRentals)')) throw new Error('Duplicate startup restore is still enabled');
          if (!runtime.includes("if($('sideModeBadge'))$('sideModeBadge').textContent")) throw new Error('Removed sidebar status is still a required element');
          if (!runtime.includes("var node=$(id);if(node)node.addEventListener")) throw new Error('Removed sidebar action is still a required element');
          if (!runtime.includes('function studentPageIndex()')) throw new Error('Indexed student renderer is missing');
          if (!runtime.includes('periodsByStudent=new Map()')) throw new Error('Student tuition-period index is missing');
          if (!runtime.includes('nextByStudent=new Map()')) throw new Error('Shared next-event index is missing');
          if (!runtime.includes('data-tuition-receipt-url') || !runtime.includes('function openTuitionReceipt')) throw new Error('Student tuition receipt viewing is missing');
          if (runtime.includes('for(var offset=0;offset<=180;offset++){var found=')) throw new Error('Per-student 180-day scan is still enabled');
          if (!runtime.includes("if(data.view==='calendar'){state.currentDate=todayKey()")) throw new Error('Course calendar does not reset to today');

          if (!operations.includes('data-action="overview-current-month"')) throw new Error('Direct current-month button is missing');
          if (!operations.includes("if(action==='overview-current-month')")) throw new Error('Direct current-month action is missing');
          const previousIndex = operations.indexOf('← 前一天');
          const todayIndex = operations.indexOf('<b>今天</b>');
          const nextIndex = operations.indexOf('後一天 →');
          const queryIndex = operations.indexOf('<span>查詢日期</span>');
          if (!(previousIndex >= 0 && previousIndex < todayIndex && todayIndex < nextIndex && nextIndex < queryIndex)) throw new Error('Overview day controls are not ordered as previous, today, next, query');

          const requiredTemplateIds = [
            'calendarPage','studentsPage','teachersPage','teacherListMonth','teacherListMonthPrev','teacherListMonthNext','teacherListMonthCurrent','teacherPayrollSyncPanel','teacherPayrollSyncState','teacherPayrollRefreshBtn','settingsPage',
            'scheduleModal','eventModal','studentModal','tuitionModal',
            'transactionModal','teacherPayrollModal','teacherAdjustmentModal','policyModal'
          ];
          for (const id of requiredTemplateIds) {
            if (!template.includes(`id="${id}"`)) throw new Error(`Full course UI is missing: ${id}`);
          }
          if (!operations.includes('href="course-portal-admin.html?section=bindings"')) throw new Error('Entry and binding management is missing from the operations center');
          if (!template.includes('data-settings-tab="rooms"') || !template.includes('data-settings-tab="subjects"') || !template.includes('data-settings-tab="fees"')) throw new Error('Course settings are incomplete');

          const requiredFunctions = [
            'function bindRoomReorder','function bindFeeReorder','function setAttendance',
            'function eventAction','function openTeacherPayroll','function openPolicy',
            'function syncInjiaoyun','function submitSchedule','function submitTuition','function submitTransaction',
            'function eventStudentNames(event)'
          ];
          for (const marker of requiredFunctions) {
            if (!scheduler.includes(marker) || !runtime.includes(marker)) throw new Error(`Full scheduler function is missing: ${marker}`);
          }
          if (!schedulerCss.includes('@media(max-width:860px)')) throw new Error('Responsive compact course layout is missing');

          if (!center.includes("location.replace('portal.html#'+(map[view]||'course-calendar'))")) throw new Error('Old course-center address does not return to the operations center');
          for (const obsolete of ['course-scheduler-full-bootstrap.js','course-scheduler-standalone.css','operations-mobile-course-fix-v1.js','operations-mobile-course-dense-v1.css','.github/scripts/restore-full-course-center.cjs']) {
            if (fs.existsSync(obsolete)) throw new Error(`Obsolete duplicate course layer still exists: ${obsolete}`);
          }

          console.log('Unified internal course workspace verified');
          NODE

      - name: Commit generated internal course files
        run: |
          if git diff --quiet; then
            echo "Unified internal course workspace is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-scheduler.html course-scheduler.css course-scheduler.js course-scheduler-data.js operations-course-inline.js operations-course-inline-template.html operations-course-inline-runtime.js operations-phase1.js portal.html operations-hub.html course-center.html
          git commit -m "Publish unified internal course workspace"
          git push origin HEAD:main
