          portal = replace_once(portal, 'operations-phase1.js?v=20260803-mobile-pos-v4b', 'operations-phase1.js?v=20260804-customer-binding-v1', 'portal operations cache')
          portal_path.write_text(portal, encoding='utf-8')

          # -----------------------------------------------------------------
          # Binding manager: use the already-authenticated manager account.
          # -----------------------------------------------------------------
          admin_path = Path('course-portal-admin.html')
          admin = admin_path.read_text(encoding='utf-8')
          admin = replace_once(admin, '<a class="btn" href="portal.html#course-calendar">返回排課系統</a>', '<a class="btn" href="portal.html#customers">返回客戶會員</a>', 'binding return link')
          admin = replace_once(
