              '<link rel="stylesheet" href="course-portal.css?v=20260731-final-rules-v1">',
              '<link rel="stylesheet" href="course-portal.css?v=20260731-final-rules-v1"><style>body.binding-focus .portal-shell>section.card:not(.binding-admin-card):not(#managerAuthCard){display:none}body.binding-focus .binding-admin-card{margin-top:0}</style>',
              'binding focused layout'
          )
          old_pin = '''    <section class="card">
      <div class="toolbar">
        <div class="field"><label>管理密碼</label><input id="adminPin" type="password" autocomplete="current-password"></div>
        <button class="btn primary" id="loadBtn" type="button">讀取帳號資料</button>
      </div>
      <div class="notice">「停用」可日後恢復；「刪除登入資料」會清除 LINE／一般登入、驗證碼與裝置登入，讓本人重新註冊。老師、學生、課程、租用與帳務歷史不會刪除。</div>
    </section>'''
          new_pin = '''    <section class="card hidden" id="managerAuthCard">
      <input id="adminPin" type="hidden" value="">
      <button class="btn primary" id="loadBtn" type="button">重新讀取帳號資料</button>
    </section>'''
          admin = replace_once(admin, old_pin, new_pin, 'remove second admin password')
          admin = admin.replace('請先輸入管理密碼。', '正在讀取管理資料…')
          admin = replace_once(
              admin,
              '<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>\n  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>\n  <script src="course-portal-common.js?v=20260802-timeout-phase1"></script>',
              '<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>\n  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>\n  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>\n  <script src="app.js?v=20260803-login-gateway-v1"></script>\n  <script src="course-portal-common.js?v=20260804-manager-auth-v1"></script>',
              'binding manager auth scripts'
          )
          admin = replace_once(
              admin,
              "    const P = window.CoursePortal;\n",
              "    const P = window.CoursePortal;\n    const managerUser = typeof requireLogin === 'function' ? requireLogin() : null;\n    const pageParams = new URLSearchParams(location.search);\n    if (pageParams.get('section') === 'bindings') document.body.classList.add('binding-focus');\n",
              'binding manager bootstrap'
          )
          auto_start = '''
    async function startManagerView() {
      if (!managerUser || (typeof hasSettingsZoneAccess === 'function' && !hasSettingsZoneAccess(managerUser))) {
        location.href = 'index.html';
        return;
      }
      if (!window.firebase || typeof window.firebase.auth !== 'function') {
        P.toast('管理者登入元件尚未載入，請重新整理。', 'error');
        return;
      }
      await new Promise((resolve) => {
        let finished = false;
        const done = () => { if (finished) return; finished = true; clearTimeout(timer); if (unsubscribe) unsubscribe(); resolve(); };
        const unsubscribe = firebase.auth().onAuthStateChanged(done);
        const timer = setTimeout(done, 5000);
      });
      if (!firebase.auth().currentUser) {
        P.toast('管理者登入狀態已失效，請重新登入。', 'error');
        location.href = 'index.html';
        return;
      }
      await load();
      if (pageParams.get('section') === 'bindings') {
        const card = document.querySelector('.binding-admin-card');
        if (card) card.scrollIntoView({ block: 'start' });
      }
    }
    startManagerView();
'''
          admin = replace_once(admin, '  })();\n  </script>', auto_start + '  })();\n  </script>', 'binding auto load')
          admin_path.write_text(admin, encoding='utf-8')

          # Backend accepts a verified manager Firebase session instead of a
