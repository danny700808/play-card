name: Course Calendar Cleanup V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/course-calendar-cleanup-v2.yml"

permissions:
  contents: write

concurrency:
  group: course-calendar-cleanup-v2
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply course calendar and binding cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 marker, found {count}')
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # Course template: remove duplicate shortcuts, add issue details,
          # and replace the unused global-time setting with per-weekday hours.
          # -----------------------------------------------------------------
          template_path = Path('operations-course-inline-template.html')
          template = template_path.read_text(encoding='utf-8')
          template = replace_once(
              template,
              '<div class="toolbar-actions"><a class="btn outline" href="course-portal-admin.html">入口與綁定</a><button class="btn outline" type="button" id="conflictBtn">檢查衝突</button><button class="btn dark" type="button" data-view-jump="settings">教室與規則</button><button class="btn primary" type="button" id="calendarNewEvent">＋ 新增排課</button></div>',
              '',
              'calendar duplicate shortcuts'
          )
          template = replace_once(
              template,
              '<article class="card kpi"><span>待處理</span><strong id="kpiWarnings">0</strong><small>衝突、請假或曠課</small></article>',
              '<button class="card kpi kpi-action" type="button" id="calendarIssuesBtn"><span>待處理</span><strong id="kpiWarnings">0</strong><small>點擊查看人員、課程與原因</small></button>',
              'calendar issue KPI'
          )
          template = replace_once(
              template,
              '<section class="card settings-card"><h3>每日排課格線</h3><p>課程日表固定以 30 分鐘為單位；起訖時間可依營業時間調整。</p><div class="form-grid three"><div class="field"><label>開始時間</label><select id="startHour"></select></div><div class="field"><label>結束時間</label><select id="endHour"></select></div><div class="field"><label>預設一期堂數</label><input id="defaultLessons" type="number" min="1" max="99"></div></div></section>',
              '<section class="card settings-card"><h3>每週排課顯示時間</h3><p>星期一到星期日可分別設定。課程日表只顯示當天時段；整點使用實線，半點使用虛線。</p><div class="daily-hours-grid" id="dailyHoursRows"></div><div class="settings-inline-note"><b>一期堂數由「收費方案」決定。</b><span>原本的「預設一期堂數」沒有套用到新增期別，已從這裡移除，避免誤解。</span></div></section>',
              'weekday schedule settings'
          )
          issue_modal = '''<div class="modal-backdrop" id="calendarIssuesModal" role="dialog" aria-modal="true" aria-labelledby="calendarIssuesTitle">
    <div class="modal">
      <div class="modal-head"><div><h2 id="calendarIssuesTitle">待處理明細</h2><p id="calendarIssuesSubtitle">列出當天需要確認的人員、課程與原因。</p></div><button class="modal-close" type="button" data-close-modal="calendarIssuesModal">×</button></div>
      <div class="modal-body" id="calendarIssuesBody"></div>
      <div class="modal-foot"><button class="btn primary" type="button" data-close-modal="calendarIssuesModal">關閉</button></div>
    </div>
  </div>
'''
          template = replace_once(
              template,
              '</main></div>\n<div class="modal-backdrop" id="scheduleModal"',
              '</main></div>\n' + issue_modal + '<div class="modal-backdrop" id="scheduleModal"',
              'calendar issue modal'
          )
          template_path.write_text(template, encoding='utf-8')

          # -----------------------------------------------------------------
          # Runtime: weekday hours, detailed issues, no grey blocked cells,
          # and remove the non-functional default lesson setting.
          # -----------------------------------------------------------------
          runtime_path = Path('operations-course-inline-runtime.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime = replace_once(
              runtime,
              "  function weekdayKey(key){return ['sun','mon','tue','wed','thu','fri','sat'][new Date(key+'T12:00:00').getDay()];}\n",
              "  function weekdayKey(key){return ['sun','mon','tue','wed','thu','fri','sat'][new Date(key+'T12:00:00').getDay()];}\n"
              "  function defaultDailyHours(){return {sun:{closed:false,start:'10:00',end:'21:00'},mon:{closed:false,start:'12:30',end:'21:00'},tue:{closed:false,start:'12:30',end:'21:00'},wed:{closed:false,start:'12:30',end:'21:00'},thu:{closed:false,start:'12:30',end:'21:00'},fri:{closed:false,start:'12:30',end:'21:00'},sat:{closed:false,start:'10:00',end:'21:00'}};}\n"
              "  function normalizeDailyHours(input){var defaults=defaultDailyHours(),source=input&&typeof input==='object'?input:{},result={};['sun','mon','tue','wed','thu','fri','sat'].forEach(function(day){var fallback=defaults[day],row=source[day]&&typeof source[day]==='object'?source[day]:{},start=clean(row.start)||fallback.start,end=clean(row.end)||fallback.end,startMin=timeToMin(start),endMin=timeToMin(end);startMin=Math.max(360,Math.min(1410,Math.round(startMin/30)*30));endMin=Math.max(startMin+30,Math.min(1440,Math.round(endMin/30)*30));result[day]={closed:row.closed===true,start:minToTime(startMin),end:endMin===1440?'24:00':minToTime(endMin)};});return result;}\n"
              "  function overallScheduleRange(hours){var source=normalizeDailyHours(hours),open=Object.keys(source).map(function(day){return source[day];}).filter(function(row){return !row.closed;});if(!open.length)return {start:600,end:1260};return {start:Math.min.apply(null,open.map(function(row){return timeToMin(row.start);})),end:Math.max.apply(null,open.map(function(row){return timeToMin(row.end);}))};}\n"
              "  function scheduleHoursForDate(date){var hours=normalizeDailyHours(state&&state.settings&&state.settings.dailyHours),row=hours[weekdayKey(date)]||defaultDailyHours()[weekdayKey(date)];return {closed:row.closed===true,start:timeToMin(row.start),end:timeToMin(row.end),startText:row.start,endText:row.end};}\n",
              'weekday hour helpers'
          )
          runtime = replace_once(
              runtime,
              "    return {version:3,currentDate:today,settings:{startHour:10,endHour:21,interval:30,defaultLessons:4},rooms:rooms,subjects:subjects,teachers:teachers,feePlans:feePlans,students:students,tuitionPeriods:tuitionPeriods,events:events,attendance:attendance,leaveReasons:[{id:'lr1',name:'生病',sort:1,active:true},{id:'lr2',name:'出遊',sort:2,active:true},{id:'lr3',name:'其他',sort:3,active:true}],teacherPayroll:[],teacherAdjustments:[],clipboard:null,readOnly:false,dataMode:'demo',dataMeta:{}};",
              "    return {version:3,currentDate:today,settings:{startHour:10,endHour:21,interval:30,defaultLessons:4,dailyHours:defaultDailyHours(),dailyHoursVersion:1},rooms:rooms,subjects:subjects,teachers:teachers,feePlans:feePlans,students:students,tuitionPeriods:tuitionPeriods,events:events,attendance:attendance,leaveReasons:[{id:'lr1',name:'生病',sort:1,active:true},{id:'lr2',name:'出遊',sort:2,active:true},{id:'lr3',name:'其他',sort:3,active:true}],teacherPayroll:[],teacherAdjustments:[],clipboard:null,readOnly:false,dataMode:'demo',dataMeta:{}};",
              'default daily hours'
          )
          runtime = replace_once(
              runtime,
              "    next.settings=Object.assign({startHour:10,endHour:21,interval:30,defaultLessons:4},next.settings||{});next.settings.interval=30;if(next.settings.businessHoursVersion!==1){next.settings.startHour=10;next.settings.endHour=21;next.settings.businessHoursVersion=1;}",
              "    next.settings=Object.assign({startHour:10,endHour:21,interval:30,defaultLessons:4,dailyHours:defaultDailyHours()},next.settings||{});next.settings.interval=30;next.settings.dailyHours=normalizeDailyHours(next.settings.dailyHours);next.settings.dailyHoursVersion=1;var normalizedRange=overallScheduleRange(next.settings.dailyHours);next.settings.startHour=Math.floor(normalizedRange.start/60);next.settings.endHour=Math.ceil(normalizedRange.end/60);next.settings.businessHoursVersion=2;",
              'normalize daily hours'
          )
          runtime = runtime.replace("if(room.businessPolicyVersion===1)return room;", "if(room.businessPolicyVersion===2)return room;", 1)
          runtime = replace_once(
              runtime,
              "var time=minToTime(minute),closed=day==='mon'||(['tue','wed','thu','fri'].indexOf(day)>=0&&minute<750),existing=Object.prototype.hasOwnProperty.call(policies[day],time)?policies[day][time]:null;",
              "var time=minToTime(minute),closed=false,existing=explicitRules&&Object.prototype.hasOwnProperty.call(policies[day],time)?policies[day][time]:null;",
              'remove generated closed-room hours'
          )
          runtime = runtime.replace('room.businessPolicyVersion=1;', 'room.businessPolicyVersion=2;', 1)
          runtime = replace_once(
              runtime,
              "    var ignored=new Set(ignoreIds||[]),reasons=[],start=timeToMin(candidate.start),end=start+numberOf(candidate.duration),room=roomById(candidate.roomId);",
              "    var ignored=new Set(ignoreIds||[]),reasons=[],start=timeToMin(candidate.start),end=start+numberOf(candidate.duration),room=roomById(candidate.roomId),businessHours=scheduleHoursForDate(candidate.date);if(businessHours.closed)reasons.push('這一天設定為不開放排課');else if(start<businessHours.start||end>businessHours.end)reasons.push('超出當天排課時間 '+businessHours.startText+'～'+businessHours.endText);",
              'schedule hour validation'
          )
          runtime = replace_once(
              runtime,
              "  function dayConflictIds(events){var ids={};events.forEach(function(event){if(eventConflictReasons(event,[event.id]).length)ids[event.id]=true;});return ids;}\n",
              "  function dayConflictIds(events){var ids={};events.forEach(function(event){if(eventConflictReasons(event,[event.id]).length)ids[event.id]=true;});return ids;}\n"
              "  function calendarIssuesForDate(date){var issues=[],seen={};effectiveEventsForDate(date).forEach(function(event){var reasons=eventConflictReasons(event,[event.id]),status=normalizedStatus(event.status),base={event:event,title:eventDisplayName(event),time:event.start+'–'+minToTime(timeToMin(event.start)+numberOf(event.duration)),room:roomById(event.roomId).name||'未指定教室',teacher:teacherById(event.teacherId).name||'',subject:subjectById(event.subjectId).name||typeName(event.type)};if(reasons.length){var key='conflict:'+event.id;if(!seen[key]){seen[key]=true;issues.push(Object.assign({},base,{kind:'排課衝突',reasons:reasons}));}}if(status==='leave'||status==='absent'||status==='pending_conflict'){var label=status==='leave'?'請假':status==='absent'?'曠課':'待補排',statusKey=label+':'+event.id;if(!seen[statusKey]){seen[statusKey]=true;issues.push(Object.assign({},base,{kind:label,reasons:[status==='pending_conflict'?'目前沒有正式教室或時段，需要重新安排。':label+'紀錄需要確認後續處理。']}));}}});return issues;}\n"
              "  function openCalendarIssues(){var issues=calendarIssuesForDate(state.currentDate);$('calendarIssuesTitle').textContent=zhDate(state.currentDate)+' 待處理明細';$('calendarIssuesSubtitle').textContent=issues.length?'共 '+issues.length+' 筆，點擊課程可直接查看。':'今天沒有衝突、請假、曠課或待補排。';$('calendarIssuesBody').innerHTML=issues.length?'<div class=\"calendar-issue-list\">'+issues.map(function(issue){return '<button type=\"button\" class=\"calendar-issue-row\" data-issue-event=\"'+esc(issue.event.id)+'\"><span class=\"tag red\">'+esc(issue.kind)+'</span><b>'+esc(issue.title)+'</b><small>'+esc(issue.time+'｜'+issue.room+(issue.teacher?'｜'+issue.teacher:'')+(issue.subject?'｜'+issue.subject:''))+'</small><em>'+issue.reasons.map(esc).join('；')+'</em></button>';}).join('')+'</div>':'<div class=\"calendar-issue-empty\"><b>目前沒有待處理事項</b><span>這一天的課程沒有衝突，也沒有請假、曠課或待補排。</span></div>';openModal('calendarIssuesModal');}\n",
              'calendar issue details'
          )
          runtime = replace_once(
              runtime,
              "    var scheduleStart=state.settings.startHour*60,slots=[];for(var min=scheduleStart;min<state.settings.endHour*60;min+=30)slots.push(min);",
              "    var overallRange=overallScheduleRange(state.settings.dailyHours),scheduleStart=overallRange.start,slots=[];for(var min=scheduleStart;min<overallRange.end;min+=30)slots.push(min);",
              'week schedule overall range'
          )
          runtime = replace_once(
              runtime,
              "    var date=state.currentDate,rooms=activeRooms(),events=effectiveEventsForDate(date),conflicts=dayConflictIds(events),used=new Set(events.map(function(row){return row.roomId;}));",
              "    var date=state.currentDate,rooms=activeRooms(),events=effectiveEventsForDate(date),conflicts=dayConflictIds(events),issues=calendarIssuesForDate(date),hours=scheduleHoursForDate(date),used=new Set(events.map(function(row){return row.roomId;}));",
              'calendar range and issues'
          )
          old_warning = "$('kpiWarnings').textContent=Object.keys(conflicts).length+events.filter(function(row){var status=normalizedStatus(row.status);return status==='leave'||status==='absent'||status==='pending_conflict';}).length;"
          runtime = replace_once(runtime, old_warning, "$('kpiWarnings').textContent=issues.length;", 'calendar issue count')
          runtime = replace_once(
              runtime,
              "    var slots=[];for(var min=state.settings.startHour*60;min<state.settings.endHour*60;min+=30)slots.push(min);var start=state.settings.startHour*60,grid=$('scheduleGrid');grid.style.gridTemplateColumns='var(--time-col, 90px) repeat('+rooms.length+',var(--room-col, minmax(200px,1fr)))';grid.style.gridTemplateRows='var(--room-head-height, 64px) repeat('+slots.length+',var(--slot))';",
              "    var slots=[];if(!hours.closed){for(var min=hours.start;min<hours.end;min+=30)slots.push(min);}var start=hours.start,grid=$('scheduleGrid');grid.style.gridTemplateColumns='var(--time-col, 90px) repeat('+rooms.length+',var(--room-col, minmax(200px,1fr)))';grid.style.gridTemplateRows='var(--room-head-height, 64px) repeat('+slots.length+',var(--slot))';",
              'calendar per-day range'
          )
          runtime = replace_once(
              runtime,
              "rooms.forEach(function(room,ri){var policy=slotPolicy(room,date,time),blocked=policy.blockSchedule&&policy.blockRental?' blocked':'',coverage=slotCoverageClass(events,room.id,min);html+='<button type=\"button\" class=\"slot'+hour+blocked+coverage+'\"",
              "rooms.forEach(function(room,ri){var coverage=slotCoverageClass(events,room.id,min);html+='<button type=\"button\" class=\"slot'+hour+coverage+'\"",
              'remove grey blocked class'
          )
          runtime = replace_once(
              runtime,
              "    if(!events.length)html+='<div class=\"empty-day\"><b>這一天尚未排課</b><span>'+(isReadOnly()?'已移轉資料沒有這一天的課程':'點任一空白格即可新增')+'</span></div>';grid.innerHTML=html;",
              "    if(hours.closed)html+='<div class=\"empty-day\"><b>這一天設定為不開放排課</b><span>可到系統設定調整星期別的顯示時間。</span></div>';else if(!events.length)html+='<div class=\"empty-day\"><b>這一天尚未排課</b><span>'+(isReadOnly()?'已移轉資料沒有這一天的課程':'點任一空白格即可新增')+'</span></div>';grid.innerHTML=html;",
              'calendar closed-day message'
          )
          runtime = replace_once(
              runtime,
              "  function refreshFormOptions(){\n    var times=[];for(var min=state.settings.startHour*60;min<state.settings.endHour*60;min+=30)times.push({value:minToTime(min)});fillSelect($('eventStart'),times,function(row){return row.value;},function(row){return row.value;});",
              "  function updateEventStartOptionsForDate(date,selected){var range=scheduleHoursForDate(date||state.currentDate),times=[];if(!range.closed){for(var min=range.start;min<range.end;min+=30)times.push({value:minToTime(min)});}fillSelect($('eventStart'),times,function(row){return row.value;},function(row){return row.value;},range.closed?'當日不開放排課':'請選擇時間');if(selected&&times.some(function(row){return row.value===selected;}))$('eventStart').value=selected;else if(times.length)$('eventStart').value=times[0].value;}\n  function refreshFormOptions(){\n    var overallRange=overallScheduleRange(state.settings.dailyHours),times=[];for(var min=overallRange.start;min<overallRange.end;min+=30)times.push({value:minToTime(min)});fillSelect($('eventStart'),times,function(row){return row.value;},function(row){return row.value;});",
              'event time options'
          )
          runtime = replace_once(
              runtime,
              "    var selectedTeacher=source&&source.teacherId,selectedPeriod=source&&source.tuitionPeriodId;",
              "    updateEventStartOptionsForDate($('eventDate').value,$('eventStart').value);var selectedTeacher=source&&source.teacherId,selectedPeriod=source&&source.tuitionPeriodId;",
              'schedule modal weekday time'
          )
          runtime = replace_once(
              runtime,
              "['eventDate','eventStart','eventDuration','eventRoom','eventType','eventTeacher','eventTuitionPeriod'].forEach(function(id){$(id).addEventListener('change',function(){if(id==='eventRoom')updateRentalFields(true);",
              "['eventDate','eventStart','eventDuration','eventRoom','eventType','eventTeacher','eventTuitionPeriod'].forEach(function(id){$(id).addEventListener('change',function(){if(id==='eventDate')updateEventStartOptionsForDate(this.value,$('eventStart').value);if(id==='eventRoom')updateRentalFields(true);",
              'event date time refresh'
          )
          runtime = replace_once(
              runtime,
              "  function populateTimeSettings(){var options='';for(var hour=6;hour<=24;hour++)options+='<option value=\"'+hour+'\">'+pad(hour%24)+':00</option>';$('startHour').innerHTML=options;$('endHour').innerHTML=options;$('startHour').value=state.settings.startHour;$('endHour').value=state.settings.endHour;$('defaultLessons').value=state.settings.defaultLessons;fillSelect($('feeSubjectFilter'),activeSubjects(),function(row){return row.name;},function(row){return row.id;});$('feeSubjectFilter').insertAdjacentHTML('afterbegin','<option value=\"all\">全部科目</option>');}",
              "  function populateTimeSettings(){var labels={mon:'星期一',tue:'星期二',wed:'星期三',thu:'星期四',fri:'星期五',sat:'星期六',sun:'星期日'},hours=normalizeDailyHours(state.settings.dailyHours),options='';for(var min=360;min<=1440;min+=30){var value=min===1440?'24:00':minToTime(min);options+='<option value=\"'+value+'\">'+value+'</option>';}$('dailyHoursRows').innerHTML=['mon','tue','wed','thu','fri','sat','sun'].map(function(day){var row=hours[day];return '<div class=\"daily-hours-row\" data-daily-hours=\"'+day+'\"><b>'+labels[day]+'</b><label class=\"daily-hours-closed\"><input type=\"checkbox\" data-day-closed '+(row.closed?'checked':'')+'>不開放</label><label>開始<select data-day-start>'+options+'</select></label><label>結束<select data-day-end>'+options+'</select></label></div>';}).join('');$$('[data-daily-hours]').forEach(function(container){var day=container.dataset.dailyHours,row=hours[day],closed=qs('[data-day-closed]',container),start=qs('[data-day-start]',container),end=qs('[data-day-end]',container);start.value=row.start;end.value=row.end;function sync(){start.disabled=closed.checked;end.disabled=closed.checked;container.classList.toggle('closed',closed.checked);}closed.addEventListener('change',sync);sync();});fillSelect($('feeSubjectFilter'),activeSubjects(),function(row){return row.name;},function(row){return row.id;});$('feeSubjectFilter').insertAdjacentHTML('afterbegin','<option value=\"all\">全部科目</option>');}",
              'weekday settings renderer'
          )
          runtime = replace_once(
              runtime,
              "for(var min=state.settings.startHour*60;min<state.settings.endHour*60;min+=30){var time=minToTime(min)",
              "for(var min=overallScheduleRange(state.settings.dailyHours).start;min<overallScheduleRange(state.settings.dailyHours).end;min+=30){var time=minToTime(min)",
              'room policy overall range'
          )
          old_save = "$('saveSettingsBtn').addEventListener('click',function(){if(!writable('儲存設定'))return;var start=numberOf($('startHour').value),end=numberOf($('endHour').value);if(end<=start){toast('時間設定錯誤','結束時間必須晚於開始時間。','error');return;}state.settings.startHour=start;state.settings.endHour=end;state.settings.defaultLessons=numberOf($('defaultLessons').value)||4;save('系統設定已儲存');renderCalendar();toast('設定完成','課程日表格線已重新整理。');});"
          new_save = "$('saveSettingsBtn').addEventListener('click',function(){if(!writable('儲存設定'))return;var daily={},invalid='';$$('[data-daily-hours]').forEach(function(container){var day=container.dataset.dailyHours,closed=qs('[data-day-closed]',container).checked,start=qs('[data-day-start]',container).value,end=qs('[data-day-end]',container).value;if(!closed&&timeToMin(end)<=timeToMin(start))invalid=day;daily[day]={closed:closed,start:start,end:end};});if(invalid){toast('時間設定錯誤','每一天的結束時間都必須晚於開始時間。','error');return;}state.settings.dailyHours=normalizeDailyHours(daily);state.settings.dailyHoursVersion=1;var range=overallScheduleRange(state.settings.dailyHours);state.settings.startHour=Math.floor(range.start/60);state.settings.endHour=Math.ceil(range.end/60);save('系統設定已儲存');renderCalendar();toast('設定完成','課程日表會依星期顯示設定時段。');});"
          runtime = replace_once(runtime, old_save, new_save, 'save weekday settings')
          runtime = replace_once(
              runtime,
              "$('conflictBtn').addEventListener('click',function(){var count=Object.keys(dayConflictIds(effectiveEventsForDate(state.currentDate).filter(function(row){return !isNonOccupyingEvent(row);}))).length;toast(count?'發現排課衝突':'今日沒有衝突',count?'共有 '+count+' 個課程需要調整。':'教室、老師、學生與教室規則均通過。',count?'error':'');});",
              "var conflictButton=$('conflictBtn');if(conflictButton)conflictButton.addEventListener('click',openCalendarIssues);$('calendarIssuesBtn').addEventListener('click',openCalendarIssues);$('calendarIssuesBody').addEventListener('click',function(event){var button=event.target.closest('[data-issue-event]');if(!button)return;var row=findEvent(button.dataset.issueEvent);if(row){closeModal('calendarIssuesModal');eventDetails(row);}});",
              'issue button bindings'
          )
          runtime_path.write_text(runtime, encoding='utf-8')

          # -----------------------------------------------------------------
          # Visual rules.
          # -----------------------------------------------------------------
          css_path = Path('course-scheduler.css')
          css = css_path.read_text(encoding='utf-8')
          css += '''

/* 2026-08-04 course calendar cleanup v2 */
.slot.blocked{background:#fff!important}
.kpi-action{width:100%;border:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink)}
.kpi-action:hover{border-color:#8cb6a6;box-shadow:0 8px 24px rgba(18,53,45,.09);transform:translateY(-1px)}
.daily-hours-grid{display:grid;gap:8px;margin-top:12px}
.daily-hours-row{display:grid;grid-template-columns:92px 100px minmax(160px,1fr) minmax(160px,1fr);gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.daily-hours-row>b{font-size:15px}.daily-hours-row label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}.daily-hours-row select{min-width:0;width:100%;min-height:40px;border:1px solid var(--line-strong);border-radius:9px;background:#fff;padding:6px 9px}.daily-hours-closed{white-space:nowrap}.daily-hours-row.closed{background:#f1f3f2;color:#7b8581}.settings-inline-note{display:grid;gap:3px;margin-top:12px;padding:11px 13px;border-radius:11px;background:#f0f7f4;color:#36574d;font-size:13px}.settings-inline-note b{color:var(--green-dark)}
.calendar-issue-list{display:grid;gap:9px}.calendar-issue-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}.calendar-issue-row:hover{border-color:#d5867f;background:#fffafa}.calendar-issue-row .tag{grid-row:1/span 3;align-self:start}.calendar-issue-row b{font-size:16px}.calendar-issue-row small{color:var(--muted)}.calendar-issue-row em{font-style:normal;color:#a33c37;font-size:13px;font-weight:800}.calendar-issue-empty{display:grid;gap:5px;padding:24px;text-align:center;border:1px dashed var(--line-strong);border-radius:13px;background:#fafcfb}.calendar-issue-empty span{color:var(--muted);font-size:13px}
@media(max-width:760px){.daily-hours-row{grid-template-columns:1fr 1fr}.daily-hours-row>b{grid-column:1/-1}.daily-hours-row label:not(.daily-hours-closed){display:grid;grid-template-columns:44px minmax(0,1fr)}.calendar-issue-row{grid-template-columns:1fr}.calendar-issue-row .tag{grid-row:auto;justify-self:start}}
'''
          css_path.write_text(css, encoding='utf-8')

