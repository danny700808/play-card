      - "tests/person-data-admin.test.js"
      - ".github/workflows/deploy-course-portal-auth.yml"
      - ".github/scripts/verify-taiwan-region.cjs"
      - "tests/taiwan-region.test.cjs"
      - "tests/course-login-region-migration.test.cjs"
      - ".github/scripts/verify-line-login-taiwan.cjs"
      - ".github/scripts/deploy-missing-taiwan-http.cjs"
      - "tests/taiwan-deployment-completion.test.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-course-portal-auth-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Test portal code
        run: |
          set -euo pipefail
          node --test tests/taiwan-deployment-completion.test.cjs tests/taiwan-region.test.cjs tests/course-calendar-startup.test.js
          node --check functions/coursePortal.js
          node --check functions/courseSubjectCatalog.js
          node --check functions/courseLoginAuthV3.js
          node --check functions/courseLoginIndexV3.js
          node --check functions/personDataAdmin.js
          node --check functions/courseLoginPolicy.js
          node --check functions/index.js
          node --check functions/employeeAuth.js
          node --check functions/employeeDataGateway.js
          node --check functions/employeeRegistration.js
          node --check functions/inventoryCountAccess.js
          node --test tests/inventory-average-cost.test.cjs tests/platform-order-anomaly-recheck.test.js
          node --check functions/legacyTeacherForms.js
          node --check functions/privateContractAssets.js
          node --check functions/rentalCustomerPolicy.js
          node --test tests/private-data-backend.test.cjs tests/rental-private-submit.test.cjs
          node --test tests/private-inventory-pin.test.cjs tests/line-webhook-region.test.cjs
          node --check functions/easystoreCatalogSync.js
          node --check functions/externalTeacherOnboarding.js
          node --check functions/externalTeacherWork.js
          node --check manager-auth.js
          node --check operations-manager-auth.js
          node --check operations-phase1.js
          node --test tests/teacher-view-cache.test.cjs tests/course-speed-bootstrap.test.cjs tests/course-speed-queries.test.cjs tests/course-query-index-readiness.test.cjs
          node --check course-portal-common.js
          node --check room-booking-v2.js
          node --check teacher-course-portal-v8.js
          node --check teacher-profile.js
          node --check teacher-contract.js
          node --check person-data-admin.js
          node --check teacher-daily-reminder.js
          node scripts/test-course-reliability.cjs
          node tests/course-portal.test.js
          node --test tests/course-half-hour.test.js
          node --test tests/course-subject-catalog.test.js
          node --test tests/course-login-policy.test.js
          node tests/course-login-routing.test.js
          node --test tests/unified-email-login.test.cjs tests/unified-login.test.cjs tests/operations-return-concurrency.test.cjs tests/operations-startup-load.test.cjs
          node tests/room-booking-v2.test.js
          node tests/teacher-course-portal-mobile.test.js
          node --test tests/teacher-daily-reminder.test.js
          node --test tests/teacher-utility-pending.test.js
          node --test tests/teacher-profile-flow.test.js
          node --test tests/teacher-profile-change-review.test.js
          node --test tests/person-data-admin.test.js
          node --test tests/operations-manager-auth.test.js
          node --test tests/external-teacher-work-v2.test.js
          node tests/external-teacher-center.test.js
          (cd functions && node - <<'NODE'
          const deployed = require('.');
          for (const name of ['coursePortalRoomBookingOperation','coursePortalRoomBookingNotice','coursePortalRoomBookingNoticeRecovery','coursePortalTeacherSaveProfileDraft','coursePortalTeacherContractSession','coursePortalTeacherSubmitContract','coursePortalAdminSaveTeacherSubjects','coursePortalAdminSaveSubjectCatalog','coursePortalAdminSaveFeePlan','coursePortalAdminMapSubjectSuggestion','personDataAdminInventory','personDataAdminDetail','personDataAdminAction','personDataAdminContractInventory','personDataAdminContractDetail','personDataAdminContractAction','personDataAdminProfileChangeInventory','personDataAdminProfileChangeAction','employeeSecureLogin','employeeChangePassword','employeeForgotPassword','sendGmailTestEmail','syncEasyStoreCatalog','researchProductListingCase','importProductListingImages','generateProductListingImage','publishProductListingCase','externalTeacherCreateBindCode','externalTeacherListContractTemplate','externalTeacherSaveContractTemplate','externalTeacherListContracts','externalTeacherWork','sendNotificationQueueOnCreate','flushNotificationQueue']) {
            if (!deployed[name]) throw new Error(`Missing Firebase Function export: ${name}`);
          }
          NODE
          )

      - name: Detect access-rule changes before deployment
        id: access_rules
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}"; then
            before="HEAD^"
          fi
          if git diff --name-only "$before" HEAD | grep -Eq '^(firestore.rules|storage.rules|firebase.security-test.json|tests/private-data-rules.emulator.cjs)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java for isolated access-rule tests
        if: steps.access_rules.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify access rules before production credentials are loaded
        if: steps.access_rules.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rules-tests" --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.19.0 firebase-tools@15.30.0
          export NODE_PATH="$RUNNER_TEMP/rules-tests/node_modules:$GITHUB_WORKSPACE/functions/node_modules"
          node "$RUNNER_TEMP/rules-tests/node_modules/firebase-tools/lib/bin/firebase.js" emulators:exec \
            --project demo-youzi-security --only firestore,storage --config firebase.security-test.json \
            "node --test tests/private-data-rules.emulator.cjs"

      - name: Prepare Firebase credentials and runtime settings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/youzi-firebase-service-account.json
          LINE_CHANNEL_SECRET_PATH: ${{ runner.temp }}/line-channel-secret.txt
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          test -n "${GMAIL_USER:-}" || { echo "GMAIL_USER is empty" >&2; exit 1; }
          test -n "${GMAIL_APP_PASSWORD:-}" || { echo "GMAIL_APP_PASSWORD is empty" >&2; exit 1; }
          RUNTIME_LINE_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN:-}"
          test -n "$RUNTIME_LINE_TOKEN" || { echo "LINE access token is empty" >&2; exit 1; }
          test -n "${LINE_CHANNEL_SECRET:-}" || { echo "LINE_CHANNEL_SECRET is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          printf '%s' "$LINE_CHANNEL_SECRET" > "$LINE_CHANNEL_SECRET_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$LINE_CHANNEL_SECRET_PATH"
          export RUNTIME_LINE_TOKEN
          node <<'NODE'
          const fs = require('fs');
          const rows = {
            LINE_CHANNEL_ACCESS_TOKEN: process.env.RUNTIME_LINE_TOKEN || '',
            GMAIL_USER: process.env.GMAIL_USER || '',
            GMAIL_APP_PASSWORD: process.env.GMAIL_APP_PASSWORD || '',
            EMAIL_FROM: process.env.EMAIL_FROM || '',
            PUBLIC_WEB_BASE_URL: 'https://danny700808.github.io/play-card/',
            LINE_LOGIN_CALLBACK_URL: 'https://asia-east1-youzi-c1b74.cloudfunctions.net/coursePortalLineLoginCallback'
          };
          const content = Object.entries(rows)
            .map(([key, value]) => `${key}=${JSON.stringify(String(value))}`)
            .join('\n') + '\n';
          fs.writeFileSync('functions/.env', content, { mode: 0o600 });
          NODE

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Synchronize LINE webhook secret with Firebase Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          LINE_CHANNEL_SECRET_PATH: ${{ runner.temp }}/line-channel-secret.txt
          EXISTING_LINE_SECRET_PATH: ${{ runner.temp }}/existing-line-channel-secret.txt
        run: |
          set -euo pipefail
          if firebase functions:secrets:access LINE_CHANNEL_SECRET \
            --project youzi-c1b74 \
            > "$EXISTING_LINE_SECRET_PATH" 2>/dev/null && \
            cmp -s "$LINE_CHANNEL_SECRET_PATH" "$EXISTING_LINE_SECRET_PATH"; then
            echo "LINE webhook secret is already current."
          else
            firebase functions:secrets:set LINE_CHANNEL_SECRET \
              --project youzi-c1b74 \
              --data-file "$LINE_CHANNEL_SECRET_PATH" \
              --non-interactive
          fi
          rm -f "$EXISTING_LINE_SECRET_PATH"

      - name: Ensure booking query indexes are ready
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          node .github/scripts/ensure-room-booking-indexes.cjs
          node .github/scripts/ensure-course-query-indexes.cjs

      - name: Preserve or provision a private inventory PIN
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          INVENTORY_COUNT_PIN_HASH: ${{ secrets.INVENTORY_COUNT_PIN_HASH }}
        run: node .github/scripts/ensure-private-inventory-pin.cjs

      # Both old/new redirect handlers must understand per-state callback URLs
      # before any newly deployed login starter can issue a Taiwan authorization.
      - name: Deploy compatible LINE callbacks before switching login starters
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only functions:coursePortalLineLoginCallback 2>&1 | tee "$RUNNER_TEMP/line-callback-deploy.log"
          for region in us-central1 asia-east1; do
            grep -E "functions\[coursePortalLineLoginCallback\($region\).*Successful (update|create) operation|functions\[coursePortalLineLoginCallback\($region\).*Skipped" "$RUNNER_TEMP/line-callback-deploy.log" >/dev/null || { echo "Callback deployment not confirmed for $region" >&2; exit 1; }
          done

      - name: Deploy portal and protected internal Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only "functions:unifiedEmailSend,functions:unifiedEmailVerify,functions:legacyTeacherTemplateHttp,functions:legacyTeacherReadHttp,functions:legacyTeacherCreateHttp,functions:legacyTeacherUpdateHttp,functions:rentalUploadPrivateAssetHttp,functions:externalTeacherUploadPrivateAssetHttp,functions:privateContractAssetHttp,functions:employeePrivateDataRead,functions:employeeFeatureNotification,functions:employeeSelfService,functions:employeeRegister,functions:inventoryCountLoginHttp,functions:inventoryCountProductsHttp,functions:inventoryCountSaveHttp,functions:rentalSubmitApplicationHttp,functions:rentalSignContractHttp,functions:rentalGetContractHttp,functions:rentalSubmitRenewalRequestHttp,functions:rentalSubmitReturnRequestHttp,functions:unifiedLoginStatus,functions:unifiedLoginRedeem,functions:employeeLinkLineLogin,functions:employeeUnlinkLineLogin,functions:processNotificationQueueNowHttp,functions:emailSendCheckHttp,functions:rentalSaveContractHttp,functions:rentalSendSignLinkHttp,functions:rentalCompleteReturnHttp,functions:lineWebhook,functions:sendNotificationQueueOnCreate,functions:flushNotificationQueue,functions:externalTeacherWork,functions:coursePortalStartBinding,functions:coursePortalStudentPhoneAccess,functions:coursePortalDirectRegularAccess,functions:coursePortalSendEmailOtp,functions:coursePortalVerifyEmailOtp,functions:coursePortalResumeEmailOtp,functions:coursePortalStartLineLogin,functions:coursePortalCompleteLineRegistration,functions:coursePortalLineLoginCallback,functions:coursePortalRenterContactLogin,functions:coursePortalExchangeAccess,functions:coursePortalTeacherData,functions:coursePortalTeacherDataTaiwan,functions:coursePortalTeacherAvailabilityTaiwan,functions:coursePortalTeacherSlotOptionsTaiwan,functions:coursePortalStudentDataTaiwan,functions:coursePortalLessonHistoryTaiwan,functions:coursePortalRentalWeekBoardTaiwan,functions:coursePortalRentalAvailabilityTaiwan,functions:coursePortalTeacherUtilitySession,functions:coursePortalTeacherSaveProfileDraft,functions:coursePortalTeacherContractSession,functions:coursePortalTeacherSubmitContract,functions:personDataAdminInventory,functions:personDataAdminDetail,functions:personDataAdminAction,functions:personDataAdminContractInventory,functions:personDataAdminContractDetail,functions:personDataAdminContractAction,functions:personDataAdminProfileChangeInventory,functions:personDataAdminProfileChangeAction,functions:coursePortalTeacherAvailability,functions:coursePortalTeacherSlotOptions,functions:coursePortalStudentData,functions:coursePortalStudentContactBookImage,functions:coursePortalStudentSubmitTuitionPayment,functions:coursePortalRentalUseSettings,functions:coursePortalRentalDayBoard,functions:coursePortalRentalWeekBoard,functions:coursePortalRentalAvailability,functions:coursePortalRoomBookingOperation,functions:coursePortalRoomBookingNotice,functions:coursePortalRoomBookingNoticeRecovery,functions:coursePortalCreateRoomBooking,functions:coursePortalRentalMyBookings,functions:coursePortalCancelRoomBooking,functions:coursePortalTeacherAction,functions:coursePortalTeacherActionTaiwan,functions:coursePortalTeacherLessonState,functions:coursePortalTeacherAttendance,functions:coursePortalTeacherLateAttendance,functions:coursePortalTeacherAttendanceCancellationRequest,functions:coursePortalTeacherSubmitContactBookPost,functions:coursePortalTeacherUpdateStudent,functions:coursePortalTeacherStopStudent,functions:coursePortalTeacherBonusRequest,functions:coursePortalAdminRentalSettingsData,functions:coursePortalAdminSaveRentalSettings,functions:coursePortalAdminSaveRoomEquipment,functions:coursePortalAdminSaveTeacherSubjects,functions:coursePortalAdminSaveStudent,functions:coursePortalAdminSetAttendance,functions:coursePortalAdminSaveSchedule,functions:coursePortalAdminSaveLessonSettings,functions:coursePortalAdminSaveLeaveReason,functions:coursePortalAdminVoidLessonSlot,functions:coursePortalAdminSaveTuitionPeriods,functions:coursePortalAdminRecordTuitionTransaction,functions:coursePortalAdminSaveSubjectCatalog,functions:coursePortalAdminSaveFeePlan,functions:coursePortalAdminMapSubjectSuggestion,functions:coursePortalAdminSaveTeacherAdjustment,functions:coursePortalAdminRoomBookings,functions:coursePortalAdminCancelRoomBooking,functions:coursePortalUpdateStudentReminder,functions:coursePortalAdminData,functions:coursePortalAdminBindingAction,functions:coursePortalAdminAttendanceCancellationAction,functions:coursePortalAdminSuspensionAction,functions:coursePortalAdminTuitionPaymentAction,functions:coursePortalAdminEnsureTuitionReceipt,functions:coursePortalAdminTuitionPaymentScreenshot,functions:coursePortalStudentReminderDaily,functions:coursePortalTeacherDailyReminder,functions:employeeSecureLogin,functions:employeeChangePassword,functions:employeeForgotPassword,functions:sendGmailTestEmail,functions:syncEasyStoreCatalog,functions:publishProductListingCase,functions:externalTeacherCreateBindCode,functions:externalTeacherListContractTemplate,functions:externalTeacherSaveContractTemplate,functions:externalTeacherListContracts"

      # The broad deployment can exit without finishing every queued function
      # when another workflow concurrently updates an unrelated endpoint.
      # Publish the tuition mutation and its readers in an isolated, verified batch.
      - name: Verify desktop performance and tuition functions finish deployment
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          targets=(externalTeacherGetOnboarding externalTeacherSaveProfile externalTeacherCompleteContract externalTeacherSavePayroll syncPlatformOrdersNow researchProductListingCase importProductListingImages generateProductListingImage verifyProductListingStage runNineSeriesBookCoverBatch runInjiaoyunSyncNow loadInjiaoyunEducationPreview syncInjiaoyunEducationMirrorNow loadInjiaoyunEducationMirror coursePortalLessonHistory coursePortalTeacherSetIrregular coursePortalTeacherAttendanceCorrectionOptions coursePortalAdminScheduleConflictAudit coursePortalAdminBonusRequests coursePortalAdminApproveBonus coursePortalStudentBindingAccounts rentalLineRuntimeStatusHttp rentalVerifyEmailHttp coursePortalAdminUnifiedLineData coursePortalAdminUnifiedLineAction platformOrderAgentBridge inventoryCountSaveHttp coursePortalAdminRecordTuitionTransactionTaiwan coursePortalAdminSaveTuitionPeriodsTaiwan coursePortalAdminSaveScheduleTaiwan coursePortalAdminSaveLessonSettingsTaiwan coursePortalAdminVoidLessonSlotTaiwan coursePortalAdminSaveStudentTaiwan coursePortalAdminSaveTeacherSubjectsTaiwan coursePortalAdminSaveSubjectCatalogTaiwan coursePortalAdminSaveFeePlanTaiwan coursePortalAdminMapSubjectSuggestionTaiwan coursePortalAdminSaveTeacherAdjustmentTaiwan coursePortalAdminSaveLeaveReasonTaiwan coursePortalAdminSaveRentalSettingsTaiwan coursePortalAdminSaveRoomEquipmentTaiwan coursePortalAdminRoomBookingsTaiwan coursePortalAdminCancelRoomBookingTaiwan coursePortalAdminEnsureTuitionReceiptTaiwan coursePortalAdminWorkspaceSliceTaiwan loadInjiaoyunEducationMirrorAutoTaiwan coursePortalAdminSaveTuitionPeriods coursePortalAdminEnsureTuitionReceipt loadInjiaoyunEducationMirrorAuto coursePortalTeacherData coursePortalTeacherDataTaiwan coursePortalStudentData coursePortalStudentDataTaiwan coursePortalTeacherAvailabilityTaiwan coursePortalTeacherSlotOptionsTaiwan coursePortalTeacherLessonStateTaiwan coursePortalTeacherAttendanceTaiwan coursePortalTeacherLateAttendanceTaiwan coursePortalTeacherAttendanceCancellationRequestTaiwan coursePortalTeacherActionTaiwan coursePortalTeacherSetIrregularTaiwan coursePortalTeacherUtilitySessionTaiwan coursePortalTeacherUpdateStudentTaiwan coursePortalTeacherSubmitContactBookPostTaiwan coursePortalTeacherBonusRequestTaiwan coursePortalTeacherStopStudentTaiwan coursePortalTeacherAttendanceCorrectionOptionsTaiwan)
          only=$(printf 'functions:%s,' "${targets[@]}")
          firebase deploy --project youzi-c1b74 --non-interactive --force --only "${only%,}" 2>&1 | tee /tmp/tuition-functions-deploy.log
          for target in "${targets[@]}"; do
            grep -E "functions\[$target\(.*(Successful (update|create) operation|Skipped)" /tmp/tuition-functions-deploy.log >/dev/null || { echo "Deployment completion not confirmed for $target" >&2; exit 1; }
          done

      - name: Complete any Taiwan entries skipped by concurrent deployments
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          GCLOUD_PROJECT: youzi-c1b74
        run: node .github/scripts/deploy-missing-taiwan-http.cjs

      - name: Confirm both regional webhook implementations are deployed
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only functions:lineWebhook 2>&1 | tee "$RUNNER_TEMP/line-webhook-deploy.log"
          for region in us-central1 asia-east1; do
            grep -E "functions\[lineWebhook\($region\).*Successful (update|create) operation|functions\[lineWebhook\($region\).*Skipped" "$RUNNER_TEMP/line-webhook-deploy.log" >/dev/null || { echo "Webhook deployment not confirmed for $region" >&2; exit 1; }
          done

      - name: Verify both webhook regions without changing LINE settings
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          LINE_CHANNEL_SECRET_PATH: ${{ runner.temp }}/line-channel-secret.txt
        run: node .github/scripts/verify-line-webhook-region.cjs

      - name: Verify runtime LINE callback routing and cancellation
        run: node .github/scripts/verify-line-login-taiwan.cjs

      - name: Verify Taiwan HTTP deployment and inspect regional latency
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          GCLOUD_PROJECT: youzi-c1b74
        run: node .github/scripts/verify-taiwan-region.cjs

      - name: Detect an explicit Firestore rules change
        id: firestore_rules
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}"; then
            range="$before..${GITHUB_SHA}"
          else
            range="HEAD^..HEAD"
          fi
          if git diff --name-only "$range" | grep -Fxq 'firestore.rules'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules only when that file changed
        if: steps.firestore_rules.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: firebase deploy --project youzi-c1b74 --non-interactive --force --only firestore:rules

      - name: Detect an explicit Storage rules change
        id: storage_rules
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}"; then
            range="$before..${GITHUB_SHA}"
          else
            range="HEAD^..HEAD"
          fi
          if git diff --name-only "$range" | grep -Fxq 'storage.rules'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Storage rules only when that file changed
        if: steps.storage_rules.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: firebase deploy --project youzi-c1b74 --non-interactive --force --only storage

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/youzi-firebase-service-account.json"
          rm -f "${{ runner.temp }}/line-channel-secret.txt"
          rm -f "${{ runner.temp }}/existing-line-channel-secret.txt"
          rm -f "${{ runner.temp }}/openai-api-key.txt"
          rm -f "${{ runner.temp }}/existing-openai-api-key.txt"
          rm -f functions/.env
