      - "functions/inventoryCountAccess.js"
      - "functions/inventoryAverageCost.js"
      - "functions/platformOrderSync.js"
      - "functions/legacyTeacherForms.js"
      - "functions/privateContractAssets.js"
      - "functions/lineWebhookEvents.js"
      - "tests/line-webhook-region.test.cjs"
      - ".github/scripts/verify-line-webhook-region.cjs"
      - "functions/rentalCustomerPolicy.js"
      - "functions/legacyTeacherContractTemplate.json"
      - "tests/private-data-backend.test.cjs"
      - "tests/rental-private-submit.test.cjs"
      - "tests/helpers/security-fixtures.cjs"
      - "unified-login.js"
      - "rental-common.js"
      - "functions/easystoreCatalogSync.js"
      - "functions/externalTeacherOnboarding.js"
      - "functions/externalTeacherWork.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.security-test.json"
      - "tests/private-data-rules.emulator.cjs"
      - "tests/private-inventory-pin.test.cjs"
      - ".github/scripts/ensure-private-inventory-pin.cjs"
      - "tests/course-portal.test.js"
      - "tests/course-subject-catalog.test.js"
      - "tests/course-login-policy.test.js"
      - "tests/course-login-routing.test.js"
      - "tests/room-booking-v2.test.js"
      - "tests/teacher-course-portal-mobile.test.js"
      - "tests/teacher-daily-reminder.test.js"
