name: Deploy Course Portal Authentication

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "config.js"
      - "course-portal-common.js"
      - "course-portal.html"
      - "course-portal-admin.html"
      - "course-portal-settings-v2.js"
      - "course-portal-settings.html"
      - "course-portal.css"
      - "room-booking.html"
      - "room-booking-v2.css"
      - "room-booking-v2.js"
      - "course-scheduler-data.js"
      - "course-scheduler.js"
      - "student-course-portal.html"
      - "teacher-course-portal.html"
      - "teacher-course-portal-v8.css"
      - "teacher-daily-reminder.js"
      - "teacher-course-session-v8.js"
      - "teacher-course-portal-v8.js"
      - "teacher-profile.html"
      - "teacher-profile.js"
      - "contract.html"
      - "teacher-contract.js"
      - "external-teacher-admin.html"
      - "contract-admin.html"
      - "external-teacher-contract-admin.html"
      - "teacher-hub.html"
      - "announcement-admin.html"
      - "announcements.html"
      - "task.html"
      - "app.js"
      - "manager-auth.js"
      - "external-teacher-admin-route-v1.js"
      - "login.html"
      - "firebase-client.js"
      - "person-data-admin.html"
      - "person-data-admin.js"
      - "employee-admin.html"
      - "settings.html"
      - "login.html"
      - "teacher-more-auth-bridge.js"
      - "external-teacher-onboarding.html"
      - "functions/coursePortal.js"
      - "functions/courseSubjectCatalog.js"
      - "functions/courseLoginAuthV3.js"
      - "functions/courseLoginIndexV3.js"
      - "functions/personDataAdmin.js"
      - "functions/courseLoginPolicy.js"
      - "functions/index.js"
      - "functions/employeeAuth.js"
      - "functions/easystoreCatalogSync.js"
      - "functions/productAiResearch.js"
      - "functions/externalTeacherOnboarding.js"
      - "functions/externalTeacherWork.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firestore.rules"
      - "storage.rules"
      - "tests/course-portal.test.js"
      - "tests/course-subject-catalog.test.js"
      - "tests/course-login-policy.test.js"
      - "tests/course-login-routing.test.js"
      - "tests/room-booking-v2.test.js"
      - "tests/teacher-course-portal-mobile.test.js"
      - "tests/teacher-daily-reminder.test.js"
      - "tests/teacher-utility-pending.test.js"
      - "tests/external-teacher-work-v2.test.js"
      - "tests/external-teacher-center.test.js"
      - "tests/teacher-profile-flow.test.js"
      - "tests/person-data-admin.test.js"
      - "tests/product-ai-research.test.js"
      - ".github/workflows/deploy-course-portal-auth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-course-portal-auth-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Test portal code
        run: |
          set -euo pipefail
          node --check functions/coursePortal.js
          node --check functions/courseSubjectCatalog.js
          node --check functions/courseLoginAuthV3.js
          node --check functions/courseLoginIndexV3.js
          node --check functions/personDataAdmin.js
          node --check functions/courseLoginPolicy.js
          node --check functions/index.js
          node --check functions/employeeAuth.js
          node --check functions/easystoreCatalogSync.js
          node --check functions/productAiResearch.js
          node --check functions/externalTeacherOnboarding.js
          node --check functions/externalTeacherWork.js
          node --check manager-auth.js
          node --check operations-manager-auth.js
          node --check operations-phase1.js
          node --check course-portal-common.js
          node --check room-booking-v2.js
          node --check teacher-course-portal-v8.js
          node --check teacher-profile.js
          node --check teacher-contract.js
          node --check person-data-admin.js
          node --check teacher-daily-reminder.js
          node tests/course-portal.test.js
          node --test tests/course-subject-catalog.test.js
          node --test tests/course-login-policy.test.js
          node tests/course-login-routing.test.js
          node tests/room-booking-v2.test.js
          node tests/teacher-course-portal-mobile.test.js
          node --test tests/teacher-daily-reminder.test.js
          node --test tests/teacher-utility-pending.test.js
          node --test tests/teacher-profile-flow.test.js
          node --test tests/teacher-profile-change-review.test.js
          node --test tests/person-data-admin.test.js
          node --test tests/operations-manager-auth.test.js
          node --test tests/product-ai-research.test.js
          node --test tests/external-teacher-work-v2.test.js
          node tests/external-teacher-center.test.js
          (cd functions && node - <<'NODE'
          const deployed = require('.');
          for (const name of ['coursePortalTeacherSaveProfileDraft','coursePortalTeacherContractSession','coursePortalTeacherSubmitContract','coursePortalAdminSaveTeacherSubjects','coursePortalAdminSaveSubjectCatalog','coursePortalAdminSaveFeePlan','coursePortalAdminMapSubjectSuggestion','personDataAdminInventory','personDataAdminDetail','personDataAdminAction','personDataAdminContractInventory','personDataAdminContractDetail','personDataAdminContractAction','personDataAdminProfileChangeInventory','personDataAdminProfileChangeAction','employeeSecureLogin','employeeChangePassword','employeeForgotPassword','sendGmailTestEmail','syncEasyStoreCatalog','researchProductListingCase','importProductListingImages','generateProductListingImage','externalTeacherCreateBindCode','externalTeacherListContractTemplate','externalTeacherSaveContractTemplate','externalTeacherListContracts','externalTeacherWork','sendNotificationQueueOnCreate','flushNotificationQueue']) {
            if (!deployed[name]) throw new Error(`Missing Firebase Function export: ${name}`);
          }
          NODE
          )

      - name: Prepare Firebase credentials and runtime settings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/youzi-firebase-service-account.json
          LINE_CHANNEL_SECRET_PATH: ${{ runner.temp }}/line-channel-secret.txt
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          test -n "${GMAIL_USER:-}" || { echo "GMAIL_USER is empty" >&2; exit 1; }
          test -n "${GMAIL_APP_PASSWORD:-}" || { echo "GMAIL_APP_PASSWORD is empty" >&2; exit 1; }
          RUNTIME_LINE_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN:-}"
          test -n "$RUNTIME_LINE_TOKEN" || { echo "LINE access token is empty" >&2; exit 1; }
          test -n "${LINE_CHANNEL_SECRET:-}" || { echo "LINE_CHANNEL_SECRET is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          printf '%s' "$LINE_CHANNEL_SECRET" > "$LINE_CHANNEL_SECRET_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$LINE_CHANNEL_SECRET_PATH"
          export RUNTIME_LINE_TOKEN
          node <<'NODE'
          const fs = require('fs');
          const rows = {
            LINE_CHANNEL_ACCESS_TOKEN: process.env.RUNTIME_LINE_TOKEN || '',
            GMAIL_USER: process.env.GMAIL_USER || '',
            GMAIL_APP_PASSWORD: process.env.GMAIL_APP_PASSWORD || '',
            EMAIL_FROM: process.env.EMAIL_FROM || '',
            PUBLIC_WEB_BASE_URL: 'https://danny700808.github.io/play-card/'
          };
          const content = Object.entries(rows)
            .map(([key, value]) => `${key}=${JSON.stringify(String(value))}`)
            .join('\n') + '\n';
          fs.writeFileSync('functions/.env', content, { mode: 0o600 });
          NODE

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Synchronize LINE webhook secret with Firebase Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          LINE_CHANNEL_SECRET_PATH: ${{ runner.temp }}/line-channel-secret.txt
          EXISTING_LINE_SECRET_PATH: ${{ runner.temp }}/existing-line-channel-secret.txt
        run: |
          set -euo pipefail
          if firebase functions:secrets:access LINE_CHANNEL_SECRET \
            --project youzi-c1b74 \
            > "$EXISTING_LINE_SECRET_PATH" 2>/dev/null && \
            cmp -s "$LINE_CHANNEL_SECRET_PATH" "$EXISTING_LINE_SECRET_PATH"; then
            echo "LINE webhook secret is already current."
          else
            firebase functions:secrets:set LINE_CHANNEL_SECRET \
              --project youzi-c1b74 \
              --data-file "$LINE_CHANNEL_SECRET_PATH" \
              --non-interactive
          fi
          rm -f "$EXISTING_LINE_SECRET_PATH"

      - name: Prepare optional OpenAI API secret
        id: openai_secret
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_KEY_PATH: ${{ runner.temp }}/openai-api-key.txt
          EXISTING_OPENAI_KEY_PATH: ${{ runner.temp }}/existing-openai-api-key.txt
          OPENAI_KEY_PLACEHOLDER: OPENAI_API_KEY_NOT_CONFIGURED
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printf '%s' "$OPENAI_API_KEY" > "$OPENAI_KEY_PATH"
            chmod 600 "$OPENAI_KEY_PATH"
            if firebase functions:secrets:access OPENAI_API_KEY \
              --project youzi-c1b74 \
              > "$EXISTING_OPENAI_KEY_PATH" 2>/dev/null && \
              cmp -s "$OPENAI_KEY_PATH" "$EXISTING_OPENAI_KEY_PATH"; then
              echo "OpenAI API secret is already current."
            else
              firebase functions:secrets:set OPENAI_API_KEY \
                --project youzi-c1b74 \
                --data-file "$OPENAI_KEY_PATH" \
                --non-interactive
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif firebase functions:secrets:access OPENAI_API_KEY \
            --project youzi-c1b74 \
            > "$EXISTING_OPENAI_KEY_PATH" 2>/dev/null; then
            if [ "$(tr -d '\r\n' < "$EXISTING_OPENAI_KEY_PATH")" = "$OPENAI_KEY_PLACEHOLDER" ]; then
              echo "::warning::OPENAI_API_KEY is still a safe placeholder; Product AI deployment is skipped."
              echo "configured=false" >> "$GITHUB_OUTPUT"
            else
              echo "Existing Firebase OPENAI_API_KEY found."
              echo "configured=true" >> "$GITHUB_OUTPUT"
            fi
          else
            printf '%s' "$OPENAI_KEY_PLACEHOLDER" > "$OPENAI_KEY_PATH"
            chmod 600 "$OPENAI_KEY_PATH"
            firebase functions:secrets:set OPENAI_API_KEY \
              --project youzi-c1b74 \
              --data-file "$OPENAI_KEY_PATH" \
              --non-interactive
            echo "::warning::A safe placeholder was created so existing Functions can deploy. Product AI remains disabled until the OPENAI_API_KEY repository secret is added and this workflow is rerun."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f "$OPENAI_KEY_PATH" "$EXISTING_OPENAI_KEY_PATH"

      - name: Deploy portal and protected internal Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only "functions:lineWebhook,functions:sendNotificationQueueOnCreate,functions:flushNotificationQueue,functions:externalTeacherWork,functions:coursePortalStartBinding,functions:coursePortalStudentPhoneAccess,functions:coursePortalDirectRegularAccess,functions:coursePortalSendEmailOtp,functions:coursePortalVerifyEmailOtp,functions:coursePortalStartLineLogin,functions:coursePortalCompleteLineRegistration,functions:coursePortalLineLoginCallback,functions:coursePortalRenterContactLogin,functions:coursePortalExchangeAccess,functions:coursePortalTeacherData,functions:coursePortalTeacherUtilitySession,functions:coursePortalTeacherSaveProfileDraft,functions:coursePortalTeacherContractSession,functions:coursePortalTeacherSubmitContract,functions:personDataAdminInventory,functions:personDataAdminDetail,functions:personDataAdminAction,functions:personDataAdminContractInventory,functions:personDataAdminContractDetail,functions:personDataAdminContractAction,functions:personDataAdminProfileChangeInventory,functions:personDataAdminProfileChangeAction,functions:coursePortalTeacherAvailability,functions:coursePortalTeacherSlotOptions,functions:coursePortalStudentData,functions:coursePortalStudentContactBookImage,functions:coursePortalStudentSubmitTuitionPayment,functions:coursePortalRentalUseSettings,functions:coursePortalRentalDayBoard,functions:coursePortalRentalWeekBoard,functions:coursePortalRentalAvailability,functions:coursePortalCreateRoomBooking,functions:coursePortalRentalMyBookings,functions:coursePortalCancelRoomBooking,functions:coursePortalTeacherAction,functions:coursePortalTeacherLessonState,functions:coursePortalTeacherAttendance,functions:coursePortalTeacherLateAttendance,functions:coursePortalTeacherAttendanceCancellationRequest,functions:coursePortalTeacherSubmitContactBookPost,functions:coursePortalTeacherUpdateStudent,functions:coursePortalTeacherStopStudent,functions:coursePortalTeacherBonusRequest,functions:coursePortalAdminRentalSettingsData,functions:coursePortalAdminSaveRentalSettings,functions:coursePortalAdminSaveRoomEquipment,functions:coursePortalAdminSaveTeacherSubjects,functions:coursePortalAdminSaveSubjectCatalog,functions:coursePortalAdminSaveFeePlan,functions:coursePortalAdminMapSubjectSuggestion,functions:coursePortalAdminSaveTeacherAdjustment,functions:coursePortalAdminRoomBookings,functions:coursePortalAdminCancelRoomBooking,functions:coursePortalUpdateStudentReminder,functions:coursePortalAdminData,functions:coursePortalAdminBindingAction,functions:coursePortalAdminAttendanceCancellationAction,functions:coursePortalAdminSuspensionAction,functions:coursePortalAdminTuitionPaymentAction,functions:coursePortalAdminEnsureTuitionReceipt,functions:coursePortalAdminTuitionPaymentScreenshot,functions:coursePortalStudentReminderDaily,functions:coursePortalTeacherDailyReminder,functions:employeeSecureLogin,functions:employeeChangePassword,functions:employeeForgotPassword,functions:sendGmailTestEmail,functions:syncEasyStoreCatalog,functions:externalTeacherCreateBindCode,functions:externalTeacherListContractTemplate,functions:externalTeacherSaveContractTemplate,functions:externalTeacherListContracts"

      - name: Deploy Product AI Function when its secret is configured
        if: steps.openai_secret.outputs.configured == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: firebase deploy --project youzi-c1b74 --non-interactive --force --only functions:researchProductListingCase,functions:importProductListingImages,functions:generateProductListingImage

      - name: Detect an explicit Firestore rules change
        id: firestore_rules
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}"; then
            range="$before..${GITHUB_SHA}"
          else
            range="HEAD^..HEAD"
          fi
          if git diff --name-only "$range" | grep -Fxq 'firestore.rules'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules only when that file changed
        if: steps.firestore_rules.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: firebase deploy --project youzi-c1b74 --non-interactive --force --only firestore:rules

      - name: Detect an explicit Storage rules change
        id: storage_rules
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}"; then
            range="$before..${GITHUB_SHA}"
          else
            range="HEAD^..HEAD"
          fi
          if git diff --name-only "$range" | grep -Fxq 'storage.rules'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Storage rules only when that file changed
        if: steps.storage_rules.outputs.changed == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: firebase deploy --project youzi-c1b74 --non-interactive --force --only storage

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/youzi-firebase-service-account.json"
          rm -f "${{ runner.temp }}/line-channel-secret.txt"
          rm -f "${{ runner.temp }}/existing-line-channel-secret.txt"
          rm -f "${{ runner.temp }}/openai-api-key.txt"
          rm -f "${{ runner.temp }}/existing-openai-api-key.txt"
          rm -f functions/.env
