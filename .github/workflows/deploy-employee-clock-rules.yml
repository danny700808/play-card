name: Verify and Deploy Employee Clock Rules
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-course-portal-auth-main
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify access rules using isolated demo data
        run: |
          npm install --prefix "$RUNNER_TEMP/rules-tests" --no-audit --no-fund @firebase/rules-unit-testing@5.0.2 firebase@12.19.0 firebase-tools@15.30.0
          export NODE_PATH="$RUNNER_TEMP/rules-tests/node_modules"
          node "$RUNNER_TEMP/rules-tests/node_modules/firebase-tools/lib/bin/firebase.js" emulators:exec --project demo-youzi-security --only firestore,storage --config firebase.security-test.json "node --test tests/private-data-rules.emulator.cjs"
      - name: Verify protected clock endpoint and published client before closing direct writes
        run: |
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://asia-east1-youzi-c1b74.cloudfunctions.net/employeeSelfService',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{action:'clock'}})});
            if(response.status!==401)throw Error('Protected clock service not available');
            const page=await (await fetch('https://danny700808.github.io/play-card/clock.html?verify='+Date.now())).text();
            if(!page.includes('firebase-client.js?v=20261101-protected-clock-v1'))throw Error('Updated clock page not published');
            const code=await (await fetch('https://danny700808.github.io/play-card/firebase-client.js?v=20261101-protected-clock-v1')).text();
            if(!code.includes("action:'clock',payload:p"))throw Error('Protected clock route not published');
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - name: Deploy only Firestore access rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/clock-rules-account.json
        run: |
          node -e "const fs=require('fs'),data=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);if(data.project_id!=='youzi-c1b74')throw Error('Wrong project');fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,JSON.stringify(data),{mode:0o600});"
          node "$RUNNER_TEMP/rules-tests/node_modules/firebase-tools/lib/bin/firebase.js" deploy --project youzi-c1b74 --non-interactive --only firestore:rules
      - name: Remove deployment credential
        if: always()
        run: node -e "require('fs').rmSync(process.env.RUNNER_TEMP+'/clock-rules-account.json',{force:true});"
