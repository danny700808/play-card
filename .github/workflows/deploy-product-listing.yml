name: Deploy product listing workflow

on:
  push:
    branches: [main]
    paths:
      - "functions/productAiResearch.js"
      - "functions/productListingPublish.js"
      - "functions/productListingSourceCleanup.js"
      - "functions/easystoreCatalogSync.js"
      - "functions/bookCoverEnrichment.js"
      - "operations-phase1.js"
      - "operations-hub.html"
      - "portal.html"
      - "functions/shopeeMusicTaxonomy.js"
      - "functions/index.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "tests/product-ai-research.test.js"
      - "tests/product-listing-publish.test.js"
      - "tests/product-listing-source-cleanup.test.js"
      - "tests/easystore-variant-image-sync.test.js"
      - "tests/book-cover-enrichment.test.js"
      - "scripts/easystore-api-product-tool.mjs"
      - ".github/workflows/deploy-product-listing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-product-listing-main
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select deployment scope
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          scope=hosting
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            scope=full
          elif git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- functions/ | grep -q .; then
            scope=full
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase Function dependencies
        working-directory: functions
        run: npm ci
      - name: Test product listing workflow
        env:
          NODE_PATH: functions/node_modules
        run: node --test tests/product-ai-research.test.js tests/product-listing-publish.test.js tests/product-listing-source-cleanup.test.js tests/easystore-variant-image-sync.test.js tests/book-cover-enrichment.test.js
      - name: Validate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
        run: |
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          node -e "const row=require('./service-account.json'); if(row.type!=='service_account'||row.project_id!=='youzi-c1b74')throw new Error('Invalid service account')"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0
      - name: Deploy product listing functions and hosting
        if: steps.scope.outputs.scope == 'full'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: >-
          firebase deploy
          --only hosting,functions:researchProductListingCase,functions:importProductListingImages,functions:generateProductListingImage,functions:publishProductListingCase,functions:autoPublishProductListingCase,functions:verifyProductListingStage,functions:applyProductListingQueueReceipt,functions:cleanupProductListingSourceImages,functions:runNineSeriesBookCoverBatch,functions:syncEasyStoreCatalog
          --project youzi-c1b74
          --non-interactive
          --force
      - name: Deploy frontend only
        if: steps.scope.outputs.scope == 'hosting'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: firebase deploy --only hosting --project youzi-c1b74 --non-interactive
      - name: Remove service account file
        if: always()
        run: rm -f service-account.json
