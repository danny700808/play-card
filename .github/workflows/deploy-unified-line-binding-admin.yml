name: Deploy Unified LINE Binding Admin

on:
  push:
    branches:
      - main
    paths:
      - "functions/unifiedLineBindingAdmin.js"
      - "functions/courseLoginIndexV3.js"
      - "line-binding-admin.html"
      - "line-binding-admin.css"
      - "line-binding-admin.js"
      - "unified-line-binding-link-v1.js"
      - "portal.html"
      - "operations-hub.html"
      - "tests/unified-line-binding-admin.test.js"
      - ".github/workflows/deploy-unified-line-binding-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-unified-line-binding-admin-main
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify unified LINE binding code
        env:
          NODE_PATH: functions/node_modules
        run: |
          set -euo pipefail
          node --check functions/unifiedLineBindingAdmin.js
          node --check functions/courseLoginIndexV3.js
          node --check line-binding-admin.js
          node --check unified-line-binding-link-v1.js
          node tests/unified-line-binding-admin.test.js
          grep -Fq 'line-binding-admin.html' portal.html
          grep -Fq 'line-binding-admin.html' operations-hub.html
          (cd functions && node - <<'NODE'
          const deployed = require('.');
          for (const name of [
            'coursePortalAdminUnifiedLineData',
            'coursePortalAdminUnifiedLineAction'
          ]) {
            if (!deployed[name]) throw new Error(`Missing Firebase Function export: ${name}`);
          }
          console.log('Unified LINE binding exports verified');
          NODE
          )
          git diff --check

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy unified LINE binding endpoints
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only "functions:coursePortalAdminUnifiedLineData,functions:coursePortalAdminUnifiedLineAction"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "${{ runner.temp }}/youzi-firebase-service-account.json"
