name: Diagnose Course Attendance
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/diagnose-course-attendance.cjs'
      - '.github/workflows/diagnose-course-attendance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts
      - name: Read attendance prerequisites without writing records
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/attendance-audit.json
          GOOGLE_CLOUD_PROJECT: youzi-c1b74
        run: |
          set -euo pipefail
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node .github/scripts/diagnose-course-attendance.cjs
