name: Finalize Rental Default Version

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/finalize-rental-default-version.cjs'
      - '.github/workflows/finalize-rental-default-version.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/finalize-rental-default-version.cjs
      - run: |
          node --check functions/coursePortal.js
          grep -q "roomRulesVersion === 1" functions/coursePortal.js
          grep -q "saved.version === 3" functions/coursePortal.js
          grep -q "version: 3" functions/coursePortal.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/coursePortal.js
          git commit -m "Version rental defaults before custom settings"
          git push origin HEAD:main