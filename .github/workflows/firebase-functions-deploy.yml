name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-functions-deploy.yml"
      - "course-data-auto-bootstrap-v1.js"
      - "course-scheduler-review-data.js"
      - "operations-hub.html"
      - "portal.html"
      - "tests/course-auto-cloud-load.test.js"
      - "tests/course-workspace-persistence.test.js"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test course data startup path
        run: |
          node tests/course-auto-cloud-load.test.js
          node tests/course-workspace-persistence.test.js

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify required function exports
        working-directory: functions
        run: |
          node - <<'NODE'
          const deployed = require('./index.js');
          const required = [
            'platformOrderSyncDaily',
            'syncPlatformOrdersNow',
            'platformOrderAgentBridge',
            'syncEasyStoreCatalog',
            'runInjiaoyunSyncNow',
            'syncInjiaoyunEducationMirrorNow',
            'loadInjiaoyunEducationMirror',
            'loadInjiaoyunEducationMirrorAuto'
          ];
          const missing = required.filter((name) => !deployed[name]);
          if (missing.length) {
            console.error('Missing Firebase Function exports:', missing.join(', '));
            process.exit(1);
          }
          console.log('Verified Firebase Function exports:', required.join(', '));
          NODE

      - name: Create service account file
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}' > service-account.json

      - name: Deploy Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
        run: firebase deploy --only functions --project youzi-c1b74 --non-interactive

      - name: Verify deployed course mirror data
        run: |
          curl --fail-with-body --retry 3 --retry-delay 8 --max-time 300 \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://danny700808.github.io' \
            --data '{"data":{"source":"operations-hub"}}' \
            'https://us-central1-youzi-c1b74.cloudfunctions.net/loadInjiaoyunEducationMirrorAuto' \
            --output /tmp/course-mirror-response.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/course-mirror-response.json', 'utf8'));
          const data = body.result || body.data || {};
          const scheduleKeys = ['fixedCourses', 'temporaryCourses', 'events', 'roomRentals'];
          const directoryKeys = ['rooms', 'students', 'teachers'];
          const scheduleCount = scheduleKeys.reduce((sum, key) => sum + (Array.isArray(data[key]) ? data[key].length : 0), 0);
          const directoryCount = directoryKeys.reduce((sum, key) => sum + (Array.isArray(data[key]) ? data[key].length : 0), 0);
          if (!data.ok || scheduleCount < 1 || directoryCount < 1) {
            console.error('Course mirror health check failed', { ok: data.ok, scheduleCount, directoryCount, error: body.error || null });
            process.exit(1);
          }
          console.log('Course mirror health check passed', { scheduleCount, directoryCount, runId: data.runId || '' });
          NODE

      - name: Report Firebase deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node - <<'NODE'
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          const description = state === 'success'
            ? 'Firebase deployed and course mirror returned schedule data'
            : 'Firebase deployment or course mirror verification failed';
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.COMMIT_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state,
              context: 'firebase/functions-course-mirror',
              description: description.slice(0, 140),
              target_url: `https://github.com/${process.env.REPOSITORY}/actions`
            })
          });
          if (!response.ok) {
            console.error('Unable to report commit status', response.status, await response.text());
            process.exit(1);
          }
          console.log('Reported deployment status:', state);
          NODE
