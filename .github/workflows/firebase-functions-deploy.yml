name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-functions-deploy.yml"
      - "course-data-auto-bootstrap-v1.js"
      - "course-scheduler-review-data.js"
      - "operations-hub.html"
      - "portal.html"
      - "tests/course-auto-cloud-load.test.js"
      - "tests/course-workspace-persistence.test.js"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: firebase-course-mirror-main
  cancel-in-progress: true

jobs:
  deploy-course-mirror-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report deployment started
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.COMMIT_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state: 'pending',
              context: 'firebase/functions-course-mirror',
              description: 'Deploying and verifying the automatic course mirror reader',
              target_url: process.env.RUN_URL
            })
          });
          if (!response.ok) throw new Error(`Unable to report pending status: ${response.status} ${await response.text()}`);
          console.log('Reported pending deployment status:', process.env.RUN_URL);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Test course data startup path
        run: |
          set -euo pipefail
          node tests/course-auto-cloud-load.test.js
          node tests/course-workspace-persistence.test.js

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify automatic reader export
        working-directory: functions
        run: |
          set -euo pipefail
          node - <<'NODE'
          const deployed = require('.');
          const name = 'loadInjiaoyunEducationMirrorAuto';
          if (!deployed[name]) {
            console.error(`Missing Firebase Function export: ${name}`);
            process.exit(1);
          }
          console.log(`Verified Firebase Function export: ${name}`);
          NODE

      - name: Validate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          node -e "const row=require('./service-account.json'); if(row.type!=='service_account'||row.project_id!=='youzi-c1b74'||!row.client_email||!row.private_key){throw new Error('Invalid Firebase service account JSON')}"
          chmod 600 service-account.json

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy automatic course mirror reader
        id: deploy_reader
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          set -o pipefail
          firebase deploy \
            --only functions:loadInjiaoyunEducationMirrorAuto \
            --project youzi-c1b74 \
            --non-interactive \
            --force \
            2>&1 | tee /tmp/firebase-course-mirror-deploy.log

      - name: Upload Firebase deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-course-mirror-diagnostics-${{ github.run_id }}
          path: /tmp/firebase-course-mirror-deploy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop when Firebase deployment failed
        if: steps.deploy_reader.outcome == 'failure'
        run: |
          echo "Firebase deployment failed. Last log lines:"
          tail -n 80 /tmp/firebase-course-mirror-deploy.log || true
          exit 1

      - name: Verify deployed course mirror returns schedule data
        run: |
          set -euo pipefail
          response=/tmp/course-mirror-response.json
          http_code="$(curl --silent --show-error --retry 5 --retry-delay 10 --max-time 300 \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://danny700808.github.io' \
            --data '{"data":{"source":"operations-hub"}}' \
            --output "$response" \
            --write-out '%{http_code}' \
            'https://us-central1-youzi-c1b74.cloudfunctions.net/loadInjiaoyunEducationMirrorAuto')"
          echo "Callable HTTP status: $http_code"
          cat "$response"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/course-mirror-response.json', 'utf8'));
          const data = body.result || body.data || {};
          const scheduleKeys = ['fixedCourses', 'temporaryCourses', 'events', 'roomRentals'];
          const directoryKeys = ['rooms', 'students', 'teachers'];
          const counts = Object.fromEntries(
            [...scheduleKeys, ...directoryKeys].map((key) => [key, Array.isArray(data[key]) ? data[key].length : 0])
          );
          const scheduleCount = scheduleKeys.reduce((sum, key) => sum + counts[key], 0);
          const directoryCount = directoryKeys.reduce((sum, key) => sum + counts[key], 0);
          if (!data.ok || scheduleCount < 1 || directoryCount < 1) {
            console.error('Course mirror health check failed', {
              ok: data.ok,
              scheduleCount,
              directoryCount,
              counts,
              error: body.error || null
            });
            process.exit(1);
          }
          console.log('Course mirror health check passed', {
            scheduleCount,
            directoryCount,
            counts,
            runId: data.runId || ''
          });
          NODE

      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy_reader.outcome }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
          let detail = '';
          try {
            const log = fs.readFileSync('/tmp/firebase-course-mirror-deploy.log', 'utf8')
              .replace(/\u001b\[[0-9;]*m/g, '')
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean);
            detail = log.slice().reverse().find((line) => /error|failed|permission|denied|unsupported|aborted/i.test(line)) || log.at(-1) || '';
          } catch (_) {}
          const description = state === 'success'
            ? 'Course mirror reader deployed and returned schedule data'
            : (detail || `Course mirror reader failed (${process.env.DEPLOY_OUTCOME || 'unknown'})`);
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.COMMIT_SHA}`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              state,
              context: 'firebase/functions-course-mirror',
              description: description.slice(0, 140),
              target_url: process.env.RUN_URL
            })
          });
          if (!response.ok) {
            console.error('Unable to report commit status', response.status, await response.text());
            process.exit(1);
          }
          console.log('Reported deployment status:', state, description, process.env.RUN_URL);
          NODE

      - name: Remove service account file
        if: always()
        run: rm -f service-account.json
