name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/courseIndex.js"
      - "functions/injiaoyunEducationAutoRead.js"
      - "functions/injiaoyunEducationMirror.js"
      - "functions/injiaoyunEducationPreview.js"
      - "functions/coursePortal.js"
      - "functions/coursePortalUtils.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/scripts/course-mirror-public.cjs"
      - ".github/scripts/course-mirror-report.cjs"
      - "tests/course-auto-cloud-load.test.js"
      - "tests/course-workspace-persistence.test.js"
      - "tests/course-portal.test.js"
      - "tests/injiaoyun-unified-sync-model.test.js"
      - ".github/workflows/firebase-functions-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: firebase-course-mirror-main
  cancel-in-progress: true

jobs:
  deploy-course-mirror-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report deployment started
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          (async () => {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/statuses/${process.env.COMMIT_SHA}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                state: 'pending',
                context: 'firebase/functions-course-mirror',
                description: 'Deploying and verifying the automatic course mirror reader',
                target_url: process.env.RUN_URL
              })
            });
            if (!response.ok) throw new Error(`Unable to report pending status: ${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Test course data startup path
        run: |
          set -euo pipefail
          node tests/course-auto-cloud-load.test.js
          node tests/course-workspace-persistence.test.js

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify mirror exports and tests
        working-directory: functions
        run: |
          set -euo pipefail
          node - <<'NODE'
          const deployed = require('.');
          const names = [
            'loadInjiaoyunEducationMirrorAuto',
            'loadInjiaoyunEducationMirror',
            'loadInjiaoyunEducationPreview',
            'syncInjiaoyunEducationMirrorNow',
            'applyInjiaoyunEducationMirrorOnOperationsSuccess',
            'applyInjiaoyunEducationMirrorOnMigration',
            'applyInjiaoyunEducationMirrorOnAudit'
          ];
          for (const name of names) {
            if (!deployed[name]) throw new Error(`Missing Firebase Function export: ${name}`);
          }
          console.log(`Verified Firebase Function exports: ${names.join(', ')}`);
          NODE
          cd ..
          node --check functions/coursePortal.js
          node --check functions/injiaoyunEducationMirror.js
          node --check functions/injiaoyunEducationPreview.js
          NODE_PATH=functions/node_modules node tests/course-portal.test.js
          NODE_PATH=functions/node_modules node tests/injiaoyun-unified-sync-model.test.js

      - name: Validate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          node -e "const row=require('./service-account.json'); if(row.type!=='service_account'||row.project_id!=='youzi-c1b74'||!row.client_email||!row.private_key){throw new Error('Invalid Firebase service account JSON')}"
          chmod 600 service-account.json

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy course mirror reader, synchronizers, and triggers
        id: deploy_reader
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          set -o pipefail
          firebase deploy \
            --only "functions:loadInjiaoyunEducationMirrorAuto,functions:loadInjiaoyunEducationMirror,functions:loadInjiaoyunEducationPreview,functions:syncInjiaoyunEducationMirrorNow,functions:applyInjiaoyunEducationMirrorOnOperationsSuccess,functions:applyInjiaoyunEducationMirrorOnMigration,functions:applyInjiaoyunEducationMirrorOnAudit" \
            --project youzi-c1b74 \
            --non-interactive \
            --force \
            2>&1 | tee /tmp/firebase-course-mirror-deploy.log

      - name: Make deployed course mirror reader publicly callable
        id: public_access
        if: steps.deploy_reader.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          set -o pipefail
          node .github/scripts/course-mirror-public.cjs 2>&1 | tee /tmp/course-mirror-public-access.log

      - name: Verify deployed course mirror returns actual schedule data
        id: health_check
        if: steps.deploy_reader.outcome == 'success' && steps.public_access.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          response=/tmp/course-mirror-response.json
          http_code="$(curl --silent --show-error --retry 10 --retry-delay 8 --retry-all-errors --max-time 300 \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://danny700808.github.io' \
            --data '{"data":{"source":"operations-hub"}}' \
            --output "$response" \
            --write-out '%{http_code}' \
            'https://us-central1-youzi-c1b74.cloudfunctions.net/loadInjiaoyunEducationMirrorAuto')"
          printf '\nHTTP_STATUS=%s\n' "$http_code" >> "$response"
          cat "$response"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/course-mirror-response.json', 'utf8').replace(/\nHTTP_STATUS=\d+\n?$/, '');
          const body = JSON.parse(raw);
          const data = body.result || body.data || {};
          const scheduleKeys = ['fixedCourses', 'temporaryCourses', 'events', 'roomRentals'];
          const directoryKeys = ['rooms', 'students', 'teachers'];
          const counts = Object.fromEntries([...scheduleKeys, ...directoryKeys].map((key) => [key, Array.isArray(data[key]) ? data[key].length : 0]));
          const scheduleCount = scheduleKeys.reduce((sum, key) => sum + counts[key], 0);
          const directoryCount = directoryKeys.reduce((sum, key) => sum + counts[key], 0);
          if (!data.ok || scheduleCount < 1 || directoryCount < 1) {
            console.error('Course mirror health check failed', { ok: data.ok, scheduleCount, directoryCount, counts, error: body.error || null });
            process.exit(1);
          }
          console.log('Course mirror health check passed', { scheduleCount, directoryCount, counts, runId: data.runId || '' });
          NODE

      - name: Repair and verify July 2026 teacher payroll
        id: payroll_repair
        if: steps.deploy_reader.outcome == 'success' && steps.health_check.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          set -o pipefail
          node - <<'NODE' 2>&1 | tee /tmp/course-mirror-payroll-repair.log
          const admin = require('./functions/node_modules/firebase-admin');
          if (!admin.apps.length) admin.initializeApp({ projectId: 'youzi-c1b74' });
          const {
            syncOperationsTeacherPayrollRange,
            teacherPayrollRepairPlan
          } = require('./functions/injiaoyunEducationMirror');

          const db = admin.firestore();
          const dates = Array.from({ length: 31 }, (_, index) =>
            `2026-07-${String(index + 1).padStart(2, '0')}`
          );

          async function activeSourcesForDates(collectionName) {
            const rows = new Map();
            for (let index = 0; index < dates.length; index += 30) {
              const chunk = dates.slice(index, index + 30);
              let snapshot;
              try {
                snapshot = await db.collection(collectionName).where('source.date', 'in', chunk).get();
              } catch (error) {
                console.warn(`[${collectionName} date query fallback]`, error.message);
                snapshot = await db.collection(collectionName).get();
              }
              snapshot.docs.forEach((doc) => {
                const envelope = doc.data() || {};
                const source = envelope.source || {};
                if (envelope.sourceActive === false || !dates.includes(String(source.date || '').slice(0, 10))) return;
                const id = String(source.id || source.sourceId || doc.id);
                rows.set(id, source);
              });
            }
            return [...rows.values()];
          }

          (async () => {
            const [operationsSnapshot, mirrorSnapshot] = await Promise.all([
              db.collection('opsSettings').doc('injiaoyunCloudSync').get(),
              db.collection('opsSettings').doc('injiaoyunEducationMirror').get()
            ]);
            if (!operationsSnapshot.exists) throw new Error('Missing opsSettings/injiaoyunCloudSync.');
            const operations = operationsSnapshot.data() || {};
            const mirror = mirrorSnapshot.exists ? mirrorSnapshot.data() || {} : {};
            const repair = teacherPayrollRepairPlan(operations, mirror);
            if (repair) {
              const result = await syncOperationsTeacherPayrollRange(
                operations,
                'github-deploy-july-2026-teacher-payroll-repair',
                { range: repair, repair }
              );
              console.log('July teacher payroll repair result', result);
              if (!['success', 'current', 'current-repaired'].includes(String(result && result.status))) {
                throw new Error(`July teacher payroll repair did not finish: ${String(result && result.status)}`);
              }
            } else {
              console.log('July teacher payroll repair marker is already complete; verifying current mirror.');
            }

            const [payroll, adjustments] = await Promise.all([
              activeSourcesForDates('opsEducationMirrorTeacherPayroll'),
              activeSourcesForDates('opsEducationMirrorTeacherAdjustments')
            ]);
            const basePay = payroll.reduce((sum, row) => sum + Number(row.teacherAmount || 0), 0);
            const rewards = adjustments
              .filter((row) => String(row.type || '').toLowerCase() === 'reward')
              .reduce((sum, row) => sum + Math.abs(Number(row.amount || 0)), 0);
            const deductions = adjustments
              .filter((row) => String(row.type || '').toLowerCase() === 'deduction')
              .reduce((sum, row) => sum + Math.abs(Number(row.amount || 0)), 0);
            const actualPay = basePay + rewards - deductions;
            const verified = {
              payrollRows: payroll.length,
              basePay,
              rewardRows: adjustments.filter((row) => String(row.type || '').toLowerCase() === 'reward').length,
              rewards,
              deductionRows: adjustments.filter((row) => String(row.type || '').toLowerCase() === 'deduction').length,
              deductions,
              actualPay
            };
            console.log('July 2026 teacher payroll verified', verified);
            const expected = {
              payrollRows: 463,
              basePay: 199705,
              rewardRows: 11,
              rewards: 1496,
              deductionRows: 0,
              deductions: 0,
              actualPay: 201201
            };
            for (const [key, value] of Object.entries(expected)) {
              if (verified[key] !== value) {
                throw new Error(`July payroll verification failed: ${key}=${verified[key]}, expected ${value}.`);
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload course mirror diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-mirror-diagnostics-${{ github.run_id }}
          path: |
            /tmp/firebase-course-mirror-deploy.log
            /tmp/course-mirror-public-access.log
            /tmp/course-mirror-response.json
            /tmp/course-mirror-payroll-repair.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report final deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy_reader.outcome }}
          ACCESS_OUTCOME: ${{ steps.public_access.outcome }}
          HEALTH_OUTCOME: ${{ steps.health_check.outcome == 'success' && steps.payroll_repair.outcome == 'success' && 'success' || 'failure' }}
          PAYROLL_REPAIR_OUTCOME: ${{ steps.payroll_repair.outcome }}
        run: node .github/scripts/course-mirror-report.cjs

      - name: Fail workflow when deployment, access, health check, or payroll repair failed
        if: steps.deploy_reader.outcome != 'success' || steps.public_access.outcome != 'success' || steps.health_check.outcome != 'success' || steps.payroll_repair.outcome != 'success'
        run: |
          echo "Deployment outcome: ${{ steps.deploy_reader.outcome }}"
          echo "Public access outcome: ${{ steps.public_access.outcome }}"
          echo "Health outcome: ${{ steps.health_check.outcome }}"
          echo "Payroll repair outcome: ${{ steps.payroll_repair.outcome }}"
          test -f /tmp/firebase-course-mirror-deploy.log && tail -n 100 /tmp/firebase-course-mirror-deploy.log || true
          test -f /tmp/course-mirror-public-access.log && tail -n 100 /tmp/course-mirror-public-access.log || true
          test -f /tmp/course-mirror-response.json && cat /tmp/course-mirror-response.json || true
          test -f /tmp/course-mirror-payroll-repair.log && tail -n 100 /tmp/course-mirror-payroll-repair.log || true
          exit 1

      - name: Remove service account file
        if: always()
        run: rm -f service-account.json
