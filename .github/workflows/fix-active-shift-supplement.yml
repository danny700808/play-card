name: Fix Active Shift Supplemental Clock

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/fix-active-shift-supplement.cjs"
      - ".github/workflows/fix-active-shift-supplement.yml"
      - "clock-active-shift-guard-v1.js"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-active-shift-supplement
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/run-active-shift-supplement-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply active-shift clock rules
        run: node .github/scripts/fix-active-shift-supplement.cjs

      - name: Verify attendance workflow
        run: |
          set -euo pipefail
          node --check firebase-client.js
          node --check clock-active-shift-guard-v1.js
          grep -Fq 'clock-active-shift-guard-v1.js?v=20260804-active-shift-v1' clock.html
          grep -Fq '補打卡只在班段結束後' clock.html
          grep -Eq 'clockInDue\s*=\s*isPastDay\s*\|\|\s*nowMinute\s*>=\s*endMinute\s*\+\s*5' firebase-client.js
          if grep -Eq 'clockInDue\s*=\s*isPastDay\s*\|\|\s*nowMinute\s*>=\s*startMinute\s*\+\s*5' firebase-client.js; then
            echo 'Legacy active-shift supplement rule still exists.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit verified update
        run: |
          set -euo pipefail
          rm -f .github/scripts/fix-active-shift-supplement.cjs
          rm -f .github/workflows/fix-active-shift-supplement.yml
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restrict supplemental clocking to completed shifts"
          git push origin HEAD:main
