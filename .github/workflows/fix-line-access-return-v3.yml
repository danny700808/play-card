name: Fix LINE Access Return V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-line-access-return-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-line-access-return-v3
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route successful access directly to the role page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/courseLoginAuthV3.js')
          source = path.read_text(encoding='utf-8')
          old = """      redirectUrl = portalEntryUrl({
        method: 'line',
        role: type,
        access: accessToken
      });
"""
          new = """      const rolePage = type === 'teacher'
        ? 'teacher-course-portal.html'
        : (type === 'student' ? 'student-course-portal.html' : 'room-booking.html');
      redirectUrl = `${PORTAL_BASE}/${rolePage}?access=${encodeURIComponent(accessToken)}`;
"""
          count = source.count(old)
          if count == 1:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit(f'Expected one active-binding redirect block, found {count}')
          PY

      - name: Verify syntax and exports
        run: |
          set -euo pipefail
          node --check functions/courseLoginAuthV3.js
          node --check functions/courseLoginIndexV3.js

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify deployed export names
        working-directory: functions
        run: |
          node - <<'NODE'
          const deployed = require('.');
          for (const name of ['coursePortalStartLineLogin', 'coursePortalLineLoginCallback']) {
            if (!deployed[name]) throw new Error(`Missing Firebase Function export: ${name}`);
          }
          NODE

      - name: Commit verified route correction
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add functions/courseLoginAuthV3.js
            git commit -m "Route LINE access directly to role pages"
            git push origin HEAD:main
          fi

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"
          RUNTIME_LINE_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN:-${LINE_MESSAGING_ACCESS_TOKEN:-${LINE_ACCESS_TOKEN:-}}}"
          export RUNTIME_LINE_TOKEN
          node <<'NODE'
          const fs = require('fs');
          const rows = {
            LINE_CHANNEL_ACCESS_TOKEN: process.env.RUNTIME_LINE_TOKEN || '',
            GMAIL_USER: process.env.GMAIL_USER || '',
            GMAIL_APP_PASSWORD: process.env.GMAIL_APP_PASSWORD || '',
            EMAIL_FROM: process.env.EMAIL_FROM || '',
            PUBLIC_WEB_BASE_URL: 'https://danny700808.github.io/play-card/'
          };
          fs.writeFileSync(
            'functions/.env',
            Object.entries(rows).map(([key, value]) => `${key}=${JSON.stringify(String(value))}`).join('\n') + '\n',
            { mode: 0o600 }
          );
          NODE

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy corrected LINE callback
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only "functions:coursePortalLineLoginCallback"

      - name: Record successful correction deployment
        run: |
          set -euo pipefail
          printf 'deployed_at=%s\ncommit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > functions/course-login-access-return-v3-deployed.txt
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/course-login-access-return-v3-deployed.txt
          git commit -m "Record LINE access return v3 deployment"
          git push origin HEAD:main

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/youzi-firebase-service-account.json"
          rm -f functions/.env
