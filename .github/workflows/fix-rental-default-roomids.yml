name: Fix Rental Default Room Assignments

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-rental-default-roomids.cjs'
      - '.github/workflows/fix-rental-default-roomids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/fix-rental-default-roomids.cjs
      - run: node --check functions/coursePortal.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/coursePortal.js
          git commit -m "Fill default rental categories with matching rooms"
          git push origin HEAD:main