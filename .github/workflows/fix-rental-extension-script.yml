name: Fix Rental Extension Script

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-rental-extension-script.cjs'
      - '.github/workflows/fix-rental-extension-script.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/fix-rental-extension-script.cjs
      - run: node --check .github/scripts/extend-rental-attendance-bonus.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/extend-rental-attendance-bonus.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix rental attendance bonus generator syntax"
          git push origin HEAD:main
