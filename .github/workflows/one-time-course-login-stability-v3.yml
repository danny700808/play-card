name: One-time Course Login Stability V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-course-login-stability-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-course-login-stability-v3
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused login-flow patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}\n--- OLD ---\n{old[:500]}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Force all role pages to load the new central-login recovery layer immediately.
          for page in ['teacher-course-portal.html', 'student-course-portal.html', 'room-booking.html']:
              file = Path(page)
              text = file.read_text(encoding='utf-8')
              old = '<script src="config.js"></script>'
              new = '<script src="config.js?v=20260803-login-stability-v3"></script>'
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'{page}: config.js script tag not found')
              file.write_text(text, encoding='utf-8')

          # Once the access query has been consumed, a stale session must return to the central entry.
          replace_once(
              'config.js',
              """        const addingAnotherStudent = authView && authView.dataset.addStudent === 'true';
        if (authView && !hidden(authView) && !addingAnotherStudent && !access) {
""",
              """        const addingAnotherStudent = authView && authView.dataset.addStudent === 'true';
        const liveAccess = clean(new URLSearchParams(global.location.search || '').get('access'));
        if (authView && !hidden(authView) && !addingAnotherStudent && !liveAccess) {
"""
          )

          backend = Path('functions/coursePortal.js')
          source = backend.read_text(encoding='utf-8')

          # LINE's normal prompt keeps the optional friend-add control on the consent page,
          # instead of opening an additional friend-add screen.
          if "bot_prompt: 'aggressive'" in source:
              source = source.replace("bot_prompt: 'aggressive'", "bot_prompt: 'normal'", 1)
          elif "bot_prompt: 'normal'" not in source:
              raise SystemExit('functions/coursePortal.js: LINE bot_prompt not found')

          old = """function portalUrlForRole(type, params = {}) {
  const url = new URL(`${PORTAL_BASE}/${portalPageForRole(type)}`);
  Object.keys(params).forEach((key) => {
    const value = clean(params[key]);
    if (value) url.searchParams.set(key, value);
  });
  return url.toString();
}

function lineAuthorizationUrl(state) {
"""
          new = """function portalUrlForRole(type, params = {}) {
