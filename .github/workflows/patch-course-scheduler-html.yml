name: Patch Full Course Scheduler HTML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-course-scheduler-html.yml"
      - ".github/scripts/patch-full-scheduler.cjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-course-scheduler-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply deterministic scheduler patch
        run: node .github/scripts/patch-full-scheduler.cjs

      - name: Run startup tests
        run: |
          node tests/course-auto-cloud-load.test.js
          node tests/course-workspace-persistence.test.js

      - name: Commit complete scheduler fix
        run: |
          if git diff --quiet -- course-scheduler.js course-scheduler-review-data.js course-scheduler.html operations-mobile-home-v1.js operations-mobile-course-fix-v1.js operations-phase1.js operations-hub.html portal.html tests/course-auto-cloud-load.test.js; then
            echo "Full scheduler and mobile overview are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-scheduler.js course-scheduler-review-data.js course-scheduler.html operations-mobile-home-v1.js operations-mobile-course-fix-v1.js operations-phase1.js operations-hub.html portal.html tests/course-auto-cloud-load.test.js
          git commit -m "Load full scheduler from the same snapshot and keep one overview schedule"
          git push origin HEAD:main
