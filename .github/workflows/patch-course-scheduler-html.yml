name: Patch Full Course Scheduler HTML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-course-scheduler-html.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-course-scheduler-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update full scheduler asset versions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'course-scheduler.html';
          let html = fs.readFileSync(path, 'utf8');
          const replacements = new Map([
            ['course-scheduler.css?v=20260728-embedded-shell-v17', 'course-scheduler.css?v=20260729-full-scheduler-v2'],
            ['course-scheduler-data.js?v=20260728-unified-sync-v1', 'course-scheduler-data.js?v=20260729-full-scheduler-v2'],
            ['course-scheduler-review-data.js?v=20260723-review-window-v1', 'course-scheduler-review-data.js?v=20260729-full-scheduler-v2'],
            ['course-scheduler.js?v=20260728-persistent-shell-v3', 'course-scheduler.js?v=20260729-full-scheduler-v2']
          ]);
          for (const [from, to] of replacements) html = html.split(from).join(to);
          fs.writeFileSync(path, html);
          NODE

      - name: Commit cache-bust update
        run: |
          if git diff --quiet -- course-scheduler.html; then
            echo "Course scheduler HTML already uses the latest versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-scheduler.html
          git commit -m "Load the fixed full course scheduler without stale cache"
          git push origin HEAD:main
