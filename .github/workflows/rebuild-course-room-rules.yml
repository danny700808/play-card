name: Rebuild Course Room Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-course-room-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and capture status
        shell: bash
        run: |
          set +e
          {
            echo BEGIN
            node .github/scripts/build-inline-course-workspace.cjs
            echo BUILD_STATUS=$?
            node --check operations-course-inline-runtime.js
            echo JS_STATUS=$?
            grep -q "roomKindOf" operations-course-inline-runtime.js
            echo ROOM_KIND=$?
            grep -q "businessHoursVersion" operations-course-inline-runtime.js
            echo HOURS_VERSION=$?
            grep -q "endHour:21" operations-course-inline-runtime.js
            echo END_HOUR=$?
            grep -q "不定時教室只供暫時放置" operations-course-inline-runtime.js
            echo HOLDING_WARNING=$?
            echo END
          } > .github/course-room-rebuild-report.txt 2>&1
      - name: Commit generated files and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations-course-inline-runtime.js operations-course-inline-template.html .github/course-room-rebuild-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish course room rule rebuild report"
          git push origin HEAD:main