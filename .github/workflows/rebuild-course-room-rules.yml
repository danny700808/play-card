name: Rebuild Course Room Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-course-room-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node .github/scripts/build-inline-course-workspace.cjs
      - run: |
          node --check operations-course-inline-runtime.js
          grep -q "roomKindOf" operations-course-inline-runtime.js
          grep -q "businessHoursVersion" operations-course-inline-runtime.js
          grep -q "endHour:21" operations-course-inline-runtime.js
          grep -q "不定時教室只供暫時放置" operations-course-inline-runtime.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations-course-inline-runtime.js operations-course-inline-template.html
          git commit -m "Rebuild course workspace with business room rules"
          git push origin HEAD:main