name: Rebuild Mobile POS V4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-mobile-pos-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-mobile-pos-v4
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply clean mobile POS rebuild
        run: python scripts/rebuild_mobile_pos_v4.py

      - name: Verify mobile POS behavior
        run: |
          set -euo pipefail
          node --check operations-phase1.js
          node --check operations-input-stability-v1.js
          grep -Fq 'id="posSearchResults"' operations-phase1.js
          grep -Fq 'schedulePosSearchResultsUpdate' operations-phase1.js
          grep -Fq 'ops-mobile-sales-history' operations-phase1.js
          grep -Fq "action==='income-edit'" operations-phase1.js
          grep -Fq "action==='sale-edit'" operations-phase1.js
          grep -Fq "action==='preorder-fulfill'" operations-phase1.js
          grep -Fq 'operations-mobile-pos-v4.css?v=20260803-mobile-pos-v4' portal.html
          grep -Fq 'operations-phase1.js?v=20260803-mobile-pos-v4' portal.html
          ! grep -Fq "'posSearch'," operations-input-stability-v1.js
          ! grep -Fq 'operations-mobile-pos-v3' portal.html
          ! test -e operations-mobile-pos-v3.css
          ! test -e operations-mobile-pos-v3.js
          ! test -e operations-pos-keypad-stability-v2.js
          git diff --check

      - name: Commit clean mobile POS
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild mobile point of sale as a single vertical flow"
          git push origin HEAD:main
