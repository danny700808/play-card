name: Reconcile September Attendance
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply the evidence-checked repair with private before-image backups
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix functions --ignore-scripts
      - name: Reconcile verified September records
        env:
          APPLY_RECONCILIATION: ${{ inputs.apply }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/reconciliation.json
          GOOGLE_CLOUD_PROJECT: youzi-c1b74
        run: |
          set -euo pipefail
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node .github/scripts/reconcile-september-attendance.cjs
