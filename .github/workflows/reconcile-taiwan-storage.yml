name: Reconcile Taiwan Storage
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reconcile-taiwan-storage.cjs'
      - '.github/workflows/reconcile-taiwan-storage.yml'
      - 'tests/storage-reconcile.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: reconcile-taiwan-storage
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require completed seven-function recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'JS'
          (async()=>{const response=await fetch('https://api.github.com/repos/danny700808/play-card/actions/runs/35443677125',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('Unable to verify recovery run');const run=await response.json();if(run.conclusion!=='success')throw Error('Seven-function recovery has not succeeded');console.log('Seven-function recovery succeeded');})().catch(error=>{console.error(error.message);process.exitCode=1;});
          JS
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: node --test tests/storage-reconcile.test.cjs
      - run: npm ci --prefix functions
      - name: Prepare existing deployment credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SERVICE_ACCOUNT"
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/taiwan-storage-service-account.json"
      - name: Reconcile and verify copies without switching clients
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/taiwan-storage-service-account.json
        run: node .github/scripts/reconcile-taiwan-storage.cjs
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/taiwan-storage-service-account.json"
