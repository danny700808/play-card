name: Redesign External Teacher Center 20260806 V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/redesign-external-teacher-center-20260806-v2.yml"

permissions:
  contents: write

concurrency:
  group: redesign-external-teacher-center-20260806-v2
  cancel-in-progress: false

jobs:
  redesign-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply redesign
        run: python3 scripts/redesign_external_teacher_center_20260806_v2.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify redesign
        env:
          NODE_PATH: functions/node_modules
        run: |
          set -euo pipefail
          node --check external-teacher-admin-route-v1.js
          node --check teacher-more-auth-bridge.js
          node --check functions/coursePortal.js
          node tests/external-teacher-center.test.js
          (cd functions && node - <<'NODE'
          const deployed = require('.');
          if (!deployed.coursePortalTeacherUtilitySession) {
            throw new Error('Missing Firebase Function export: coursePortalTeacherUtilitySession');
          }
          console.log('External teacher utility export verified');
          NODE
          )
          git diff --check

      - name: Commit redesign to main
        run: |
          set -euo pipefail
          rm -f .github/workflows/redesign-external-teacher-center-20260806.yml
          rm -f .github/workflows/redesign-external-teacher-center-20260806-v2.yml
          rm -f scripts/redesign_external_teacher_center_20260806_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No redesign changes staged" >&2; exit 1; }
          git commit -m "Redesign external teacher management as one canonical center"
          git push origin HEAD:main

      - name: Prepare Firebase credentials and runtime settings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"
          RUNTIME_LINE_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN:-${LINE_MESSAGING_ACCESS_TOKEN:-${LINE_ACCESS_TOKEN:-}}}"
          test -n "$RUNTIME_LINE_TOKEN" || { echo "LINE access token is empty" >&2; exit 1; }
          test -n "${GMAIL_USER:-}" || { echo "GMAIL_USER is empty" >&2; exit 1; }
          test -n "${GMAIL_APP_PASSWORD:-}" || { echo "GMAIL_APP_PASSWORD is empty" >&2; exit 1; }
          export RUNTIME_LINE_TOKEN
          node <<'NODE'
          const fs = require('fs');
          const rows = {
            LINE_CHANNEL_ACCESS_TOKEN: process.env.RUNTIME_LINE_TOKEN || '',
            GMAIL_USER: process.env.GMAIL_USER || '',
            GMAIL_APP_PASSWORD: process.env.GMAIL_APP_PASSWORD || '',
            EMAIL_FROM: process.env.EMAIL_FROM || '',
            PUBLIC_WEB_BASE_URL: 'https://danny700808.github.io/play-card/'
          };
          fs.writeFileSync(
            'functions/.env',
            Object.entries(rows).map(([key, value]) => `${key}=${JSON.stringify(String(value))}`).join('\n') + '\n',
            { mode: 0o600 }
          );
          NODE

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy canonical teacher utility
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only "functions:coursePortalTeacherUtilitySession"

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/youzi-firebase-service-account.json"
          git checkout -- functions/.env 2>/dev/null || rm -f functions/.env
