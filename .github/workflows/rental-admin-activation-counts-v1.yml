name: Rental Admin Activation and Counts V1

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-admin-activation-counts-v1
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.comment.body, '/run-rental-admin-activation-counts-v1') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load reliable activation helper and refresh cached scripts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, found {count}')
              return text.replace(old, new, 1)

          admin_path = Path('rental-admin.html')
          admin = admin_path.read_text(encoding='utf-8')
          admin = replace_once(
              admin,
              '<link rel="stylesheet" href="rental-paper-sign-v1.css?v=20260803-paper-sign-v1">',
              '<link rel="stylesheet" href="rental-paper-sign-v1.css?v=20260804-paper-activation-v6">',
              'rental admin paper css cache'
          )
          admin = replace_once(
              admin,
              '  <script src="rental-paper-sign-v1.js?v=20260803-paper-sign-v1"></script>',
              '  <script src="rental-admin-enhancements-v1.js?v=20260804-paper-activation-v6"></script>\n  <script src="rental-paper-sign-v1.js?v=20260804-paper-activation-v6"></script>',
              'rental admin activation scripts'
          )
          admin_path.write_text(admin, encoding='utf-8')

          contract_path = Path('rental-contract.html')
          contract = contract_path.read_text(encoding='utf-8')
          contract = replace_once(
              contract,
              '<link rel="stylesheet" href="rental-paper-sign-v1.css?v=20260803-paper-sign-v1">',
              '<link rel="stylesheet" href="rental-paper-sign-v1.css?v=20260804-paper-view-v2">',
              'customer paper css cache'
          )
          contract = replace_once(
              contract,
              '  <script src="rental-paper-contract-view-v1.js?v=20260803-paper-sign-v1"></script>',
              '  <script src="rental-paper-contract-view-v1.js?v=20260804-paper-view-v2"></script>',
              'customer paper viewer cache'
          )
          contract_path.write_text(contract, encoding='utf-8')
          PY

      - name: Verify JavaScript and integration
        run: |
          set -euo pipefail
          node --check rental-admin-enhancements-v1.js
          node --check rental-paper-sign-v1.js
          node --check rental-paper-contract-view-v1.js
          grep -Fq 'rental-admin-enhancements-v1.js?v=20260804-paper-activation-v6' rental-admin.html
          grep -Fq 'rental-paper-sign-v1.js?v=20260804-paper-activation-v6' rental-admin.html
          grep -Fq 'rental-paper-contract-view-v1.js?v=20260804-paper-view-v2' rental-contract.html
          grep -Fq 'data-paper-activate-rental' rental-admin-enhancements-v1.js
          grep -Fq 'rental-tab-count' rental-admin-enhancements-v1.js
          git diff --check

      - name: Commit update and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/rental-admin-activation-counts-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix paper rental activation feedback and add tab counts"
          git push origin HEAD:main
