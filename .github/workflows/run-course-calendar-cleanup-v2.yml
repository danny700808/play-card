# complete-block-extraction-with-diagnostics
name: Run Course Calendar Cleanup V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-course-calendar-cleanup-v2.yml"
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: run-course-calendar-cleanup-v2
  cancel-in-progress: false

jobs:
  run-cleanup:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/run-course-calendar-cleanup-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record workflow start
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'started_at=%s\nevent=%s\ncommit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}" "$GITHUB_SHA" > course-calendar-cleanup-started.txt
          git add course-calendar-cleanup-started.txt
          git commit -m "Record course calendar cleanup workflow start"
          git push origin HEAD:main

      - name: Extract existing cleanup steps
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/course-calendar-cleanup-v2.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name, target):
              start = next(i for i, line in enumerate(source) if line.strip() == f'- name: {step_name}')
              run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
              end = next(
                  (i for i in range(run_line + 1, len(source)) if source[i].startswith('      - name: ')),
                  len(source)
              )
              rows = []
              for line in source[run_line + 1:end]:
                  rows.append(line[10:] if line.startswith('          ') else line)
              Path(target).write_text('\n'.join(rows) + '\n', encoding='utf-8')

          extract('Apply course calendar and binding cleanup', '/tmp/apply-course-cleanup.sh')
          extract('Verify frontend and backend changes', '/tmp/verify-course-cleanup.sh')
          PY
          chmod +x /tmp/apply-course-cleanup.sh /tmp/verify-course-cleanup.sh

      - name: Apply cleanup with diagnostics
        run: |
          set +e
          /tmp/apply-course-cleanup.sh > /tmp/course-cleanup-apply.log 2>&1
          code=$?
          cat /tmp/course-cleanup-apply.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/course-cleanup-apply.log course-calendar-cleanup-error.txt
            git add course-calendar-cleanup-error.txt
            git commit -m "Record course calendar cleanup apply error"
            git push origin HEAD:main
            exit "$code"
          fi

      - name: Verify frontend and backend changes with diagnostics
        run: |
          set +e
          /tmp/verify-course-cleanup.sh > /tmp/course-cleanup-verify.log 2>&1
          code=$?
          cat /tmp/course-cleanup-verify.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/course-cleanup-verify.log course-calendar-cleanup-error.txt
            git add course-calendar-cleanup-error.txt
            git commit -m "Record course calendar cleanup verification error"
            git push origin HEAD:main
            exit "$code"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Verify admin function exports
        run: |
          set -euo pipefail
          (cd functions && node - <<'NODE'
          const deployed = require('.');
          for (const name of [
            'coursePortalAdminData',
            'coursePortalAdminBindingAction',
            'coursePortalAdminAttendanceCancellationAction',
            'coursePortalAdminSuspensionAction',
            'coursePortalAdminTuitionPaymentScreenshot',
            'coursePortalAdminTuitionPaymentAction'
          ]) {
            if (!deployed[name]) throw new Error(`Missing Firebase Function export: ${name}`);
          }
          console.log('manager-auth admin exports verified');
          NODE
          )

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "FIREBASE_SERVICE_ACCOUNT_YOUZI_C1B74 is empty" >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_PATH"
          chmod 600 "$SERVICE_ACCOUNT_PATH"
          RUNTIME_LINE_TOKEN="${LINE_CHANNEL_ACCESS_TOKEN:-${LINE_MESSAGING_ACCESS_TOKEN:-${LINE_ACCESS_TOKEN:-}}}"
          export RUNTIME_LINE_TOKEN
          node <<'NODE'
          const fs = require('fs');
          const rows = {
            LINE_CHANNEL_ACCESS_TOKEN: process.env.RUNTIME_LINE_TOKEN || '',
            GMAIL_USER: process.env.GMAIL_USER || '',
            GMAIL_APP_PASSWORD: process.env.GMAIL_APP_PASSWORD || '',
            EMAIL_FROM: process.env.EMAIL_FROM || '',
            PUBLIC_WEB_BASE_URL: 'https://danny700808.github.io/play-card/'
          };
          fs.writeFileSync(
            'functions/.env',
            Object.entries(rows).map(([key, value]) => `${key}=${JSON.stringify(String(value))}`).join('\n') + '\n',
            { mode: 0o600 }
          );
          NODE

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Deploy manager-auth admin endpoints
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/youzi-firebase-service-account.json
        run: |
          set -euo pipefail
          firebase deploy --project youzi-c1b74 --non-interactive --force \
            --only "functions:coursePortalAdminData,functions:coursePortalAdminBindingAction,functions:coursePortalAdminAttendanceCancellationAction,functions:coursePortalAdminSuspensionAction,functions:coursePortalAdminTuitionPaymentScreenshot,functions:coursePortalAdminTuitionPaymentAction"

      - name: Commit finalized cleanup
        run: |
          set -euo pipefail
          rm -f course-calendar-cleanup-started.txt course-calendar-cleanup-error.txt
          rm -f .github/workflows/course-calendar-cleanup-v2.yml
          rm -f .github/workflows/run-course-calendar-cleanup-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up course calendar controls and weekday hours"
          git push origin HEAD:main

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "${{ runner.temp }}/youzi-firebase-service-account.json"
          rm -f functions/.env
