name: Schedule Fix LINE Access Return V3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether correction is complete
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/contents/functions/course-login-access-return-v3-deployed.txt >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch correction workflow
        if: steps.marker.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fix-line-access-return-v3.yml --repo "${{ github.repository }}" --ref main
