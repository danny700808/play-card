name: Trigger Course Login Stability V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/trigger-course-login-stability-v3.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether patch is already applied
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          content="$(gh api repos/${{ github.repository }}/contents/functions/coursePortal.js --jq .content | tr -d '\n' | base64 --decode)"
          if printf '%s' "$content" | grep -Fq 'waitForLineLoginRedirect'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verified login patch workflow
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run one-time-course-login-stability-v3.yml --repo "${{ github.repository }}" --ref main
