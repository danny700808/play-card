name: Verify free lesson attendance
on:
  push:
    branches: [main]
    paths:
      - 'functions/coursePortal.js'
      - 'teacher-course-portal-v8.js'
      - 'tests/attendance-free-plan*.test.cjs'
      - 'tests/teacher-free-plan-label.test.cjs'
      - 'tests/attendance-duration-ui.test.cjs'
      - '.github/workflows/verify-free-attendance.yml'
  pull_request:
    paths:
      - 'functions/coursePortal.js'
      - 'teacher-course-portal-v8.js'
      - 'tests/attendance-free-plan*.test.cjs'
      - 'tests/teacher-free-plan-label.test.cjs'
      - 'tests/attendance-duration-ui.test.cjs'
      - '.github/workflows/verify-free-attendance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: node --test tests/attendance-free-plan.test.cjs tests/attendance-free-plan-commit.test.cjs tests/teacher-free-plan-label.test.cjs tests/attendance-duration-ui.test.cjs
