name: Verify Management Tree
on:
  push:
    branches: [main]
    paths:
      - 'management-tree.js'
      - 'personnel-approval-scope.js'
      - '*approval*.html'
      - 'leave.html'
      - 'temporary-attendance-admin.html'
      - 'clock-corrections-admin.html'
      - 'internal-workspace*'
      - 'settings.html'
      - 'hr-payroll-settings-hub.html'
      - 'employee-admin.html'
      - 'salary-admin.html'
      - 'tests/management-tree.test.cjs'
      - '.github/workflows/verify-management-tree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/tree-tests" --ignore-scripts --no-audit --no-fund jsdom@30.1.1
      - run: NODE_PATH="$RUNNER_TEMP/tree-tests/node_modules" node --test tests/management-tree.test.cjs tests/personnel-approval-scope.test.cjs tests/internal-workspace.test.cjs tests/hr-workspace.test.cjs tests/salary-atomic-save.test.cjs tests/parttime-payroll-loading.test.cjs
