name: Verify Operations Live Search

on:
  push:
    branches:
      - main
    paths:
      - "operations-phase1.js"
      - "functions/productAiResearch.js"
      - "functions/productListingPublish.js"
      - "functions/productListingSourceCleanup.js"
      - "functions/easystoreCatalogSync.js"
      - "functions/shopeeMusicTaxonomy.js"
      - "operations-phase1.css"
      - "operations-shopee-autofill-handoff-v1.js"
      - "operations-hub.html"
      - "portal.html"
      - "tests/operations-live-search.test.js"
      - "tests/product-platform-presence-ui.test.js"
      - "tests/shopee-autofill-handoff.test.js"
      - "tests/shopee-extension-v2-package.test.js"
      - "tests/product-ai-research.test.js"
      - "tests/product-listing-publish.test.js"
      - "tests/product-listing-source-cleanup.test.js"
      - "tests/easystore-variant-image-sync.test.js"
      - "tests/product-image-collector-ui.test.js"
      - "easystore-shopee-autofill/**"
      - "youzi-easystore-shopee-autofill-v*.zip"
      - ".github/workflows/verify-operations-live-search.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXTENSION_DIR: easystore-shopee-autofill
      EXTENSION_VERSION: 0.3.32
      EXTENSION_ZIP: youzi-easystore-shopee-autofill-v0.3.32.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions --omit=dev
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check operations-phase1.js
          node --check operations-shopee-autofill-handoff-v1.js
          node --check functions/shopeeMusicTaxonomy.js
          node --check functions/productAiResearch.js
          node --check functions/productListingPublish.js
          node --check functions/productListingSourceCleanup.js
          node --check functions/easystoreCatalogSync.js
          node --check easystore-shopee-autofill/bridge.js
          node --check easystore-shopee-autofill/background.js
          node --check easystore-shopee-autofill/easystore.js
          node --check easystore-shopee-autofill/helpers.js
          node --check easystore-shopee-autofill/image-collector-helpers.js
          node --check easystore-shopee-autofill/recorder.js
          node --check easystore-shopee-autofill/supplier-collector.js
          node -e "JSON.parse(require('fs').readFileSync('easystore-shopee-autofill/manifest.json', 'utf8'))"
      - name: Verify packaged Chrome extension
        run: |
          set -euo pipefail
          test -s "$EXTENSION_ZIP"
          if unzip -Z1 "$EXTENSION_ZIP" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Extension ZIP contains an unsafe path." >&2
            exit 1
          fi
          package_dir="$(mktemp -d)"
          unzip -q "$EXTENSION_ZIP" -d "$package_dir"
          top_entries="$(find "$package_dir" -mindepth 1 -maxdepth 1 -printf '%f\n')"
          test "$top_entries" = "$EXTENSION_DIR"
          test -f "$package_dir/$EXTENSION_DIR/manifest.json"
          test -f "$package_dir/$EXTENSION_DIR/package.json"
          test ! -e "$package_dir/$EXTENSION_DIR/$EXTENSION_DIR/manifest.json"
          test -z "$(find "$package_dir" -type l -print -quit)"
          if find "$package_dir" \( -name '__MACOSX' -o -name '.DS_Store' -o -name 'node_modules' \) -print -quit | grep -q .; then
            echo "Extension ZIP contains packaging-only or dependency files." >&2
            exit 1
          fi
          node -e "const fs=require('fs');const row=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(row.manifest_version!==3||row.version!==process.env.EXTENSION_VERSION)throw new Error('Packaged manifest version mismatch');" "$package_dir/$EXTENSION_DIR/manifest.json"
          node -e "const fs=require('fs');const row=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!row.host_permissions.includes('<all_urls>')||!row.permissions.includes('scripting'))throw new Error('Packaged capture permissions missing');" "$package_dir/$EXTENSION_DIR/manifest.json"
          node -e "const fs=require('fs');const row=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(row.version!==process.env.EXTENSION_VERSION)throw new Error('Packaged package version mismatch');" "$package_dir/$EXTENSION_DIR/package.json"
          diff -qr "$EXTENSION_DIR" "$package_dir/$EXTENSION_DIR"
      - name: Run operations, bridge and extension tests
        run: >-
          node --test
          tests/operations-live-search.test.js
          tests/product-platform-presence-ui.test.js
          tests/shopee-autofill-handoff.test.js
          tests/shopee-extension-v2-package.test.js
          tests/product-ai-research.test.js
          tests/product-listing-publish.test.js
          tests/product-listing-source-cleanup.test.js
          tests/easystore-variant-image-sync.test.js
          tests/product-image-collector-ui.test.js
          easystore-shopee-autofill/tests/*.test.js
      - name: Verify markup and cache versions
        run: |
          set -euo pipefail
          grep -Fq 'operations-shopee-autofill-handoff-v1.js?v=20260823-shopee-v3-schema6' portal.html
          grep -Fq 'operations-shopee-autofill-handoff-v1.js?v=20260823-shopee-v3-schema6' operations-hub.html
          grep -Fq 'operations-phase1.css?v=20260828-product-master-image-upload-recheck-v1' portal.html
          grep -Fq 'operations-phase1.css?v=20260828-product-master-image-upload-recheck-v1' operations-hub.html
          grep -Fq 'operations-phase1.js?v=20260829-verified-covers-easystore-sync-v2' portal.html
          grep -Fq 'operations-phase1.js?v=20260829-verified-covers-easystore-sync-v2' operations-hub.html
          grep -Fq 'operations-manager-auth.js?v=20260828-product-image-auth-preflight-v1' portal.html
          grep -Fq 'operations-manager-auth.js?v=20260828-product-image-auth-preflight-v1' operations-hub.html
          ! grep -Fq 'operations-search-product-ux-v1' portal.html
          ! grep -Fq 'operations-search-product-ux-v1' operations-hub.html
