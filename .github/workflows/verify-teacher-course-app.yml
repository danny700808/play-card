name: Verify Teacher Course App

on:
  push:
    branches:
      - main
    paths:
      - "teacher-course-portal.html"
      - "teacher-course-portal-v8.js"
      - "teacher-daily-reminder.js"
      - "teacher-course-session-v8.js"
      - "teacher-course-portal-v8.css"
      - "teacher-home.html"
      - "profile.html"
      - "firebase-client.js"
      - "contract.html"
      - "announcements.html"
      - "task.html"
      - "teacher-goods.html"
      - "forms-hub.html"
      - "teacher-more-auth-bridge.js"
      - "teacher-more-pages.css"
      - "index.html"
      - "login.html"
      - "tests/login-clean-ui.test.js"
      - "tests/teacher-course-portal-mobile.test.js"
      - "tests/teacher-daily-reminder.test.js"
      - "tests/teacher-more-pages.test.js"
      - "tests/course-login-routing.test.js"
      - ".github/workflows/verify-teacher-course-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-teacher-course-app-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check teacher-course-portal-v8.js
          node --check teacher-daily-reminder.js
          node --check teacher-course-session-v8.js
          node --check teacher-more-auth-bridge.js
          node --check firebase-client.js
          node tests/login-clean-ui.test.js
          node tests/course-login-routing.test.js
          node tests/teacher-course-portal-mobile.test.js
          node --test tests/teacher-daily-reminder.test.js
          node tests/teacher-more-pages.test.js

      - name: Verify one teacher app shell
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('teacher-course-portal.html', 'utf8');
          const runtime = fs.readFileSync('teacher-course-portal-v8.js', 'utf8');
          const session = fs.readFileSync('teacher-course-session-v8.js', 'utf8');
          const css = fs.readFileSync('teacher-course-portal-v8.css', 'utf8');
          const redirect = fs.readFileSync('teacher-home.html', 'utf8');
          const internalWorkflow = fs.readFileSync('.github/workflows/build-live-course-scheduler.yml', 'utf8');

          const requiredTabs = ['課表','學生','薪資','租用','其他'];
          for (const label of requiredTabs) {
            const tabPattern = new RegExp(`<(button|a)\\b[^>]*>\\s*${label}(?:<span\\b[^>]*>.*?<\\/span>)?\\s*<\\/\\1>`);
            if (!tabPattern.test(html)) throw new Error(`Teacher tab is missing: ${label}`);
          }
          if ((html.match(/teacher-bottom-tabs/g) || []).length !== 1) throw new Error('Teacher bottom navigation must exist exactly once');
          if (html.includes('teacherQuickHome') || html.includes('data-teacher-quick')) throw new Error('Duplicate top teacher shortcuts remain');
          if (!html.includes('id="teacherMoreBackdrop"')) throw new Error('Other bottom sheet is missing');
          if (!html.includes('id="teacherQuickBackdrop"')) throw new Error('Teacher quick actions are missing');
          if (html.includes('id="weekPicker"') || runtime.includes("getElementById('weekPicker')")) throw new Error('Obsolete teacher date picker remains');
          for (const path of ['profile.html','contract.html','announcements.html','task.html','teacher-goods.html','forms-hub.html']) {
            if (!html.includes(`href="${path}"`)) throw new Error(`Other action is missing: ${path}`);
          }
          if (!html.includes('teacher-course-session-v8.js') || !html.includes('teacher-course-portal-v8.js')) throw new Error('Canonical teacher scripts are not loaded');
          if (!runtime.includes("SESSION_KEY = 'youzi.coursePortal.teacher.session.v1'")) throw new Error('Existing teacher session key is not reused');
          if (!runtime.includes('tokenFingerprint') || !runtime.includes('youzi.teacherCourseApp.v8.')) throw new Error('Teacher cache is not session-scoped');
          if (!runtime.includes("coursePortalTeacherData") || !runtime.includes('coursePortalTeacherAction') || !runtime.includes('coursePortalTeacherLessonState')) throw new Error('Teacher course actions are incomplete');
          if (!session.includes('sessionLoading') || !session.includes('MutationObserver')) throw new Error('Saved-session loading gate is missing');
          if (!css.includes('grid-template-columns:repeat(5') || !css.includes('.teacher-more-sheet') || !css.includes('scroll-snap-type:x mandatory')) throw new Error('Five tabs, Other sheet, or day snapping styles are missing');
          if (!css.includes('.week-cell.head{position:sticky') || !css.includes('.week-cell.time{position:sticky')) throw new Error('Sticky date or time axes are missing');
          if (!redirect.includes("location.replace('teacher-course-portal.html?'")) throw new Error('External teacher login does not enter the teacher course app');
          if (internalWorkflow.includes('refine-course-portals.cjs') || internalWorkflow.includes('teacher-course-portal.html')) throw new Error('Internal course builder still controls the teacher app');
          if (fs.existsSync('.github/scripts/refine-course-portals.cjs')) throw new Error('Obsolete teacher generator still exists');

          console.log('Canonical teacher course app verified');
          NODE
