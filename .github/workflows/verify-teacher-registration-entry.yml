name: Verify Teacher Registration Entry
on:
  push:
    branches: [main]
    paths:
      - 'external-teacher-onboarding.html'
      - 'unified-login.js'
      - 'functions/teacherRegistrationAccess.js'
      - 'functions/teacherApprovalSync.js'
      - 'functions/unifiedEmailLogin.js'
      - 'functions/employeeAuth.js'
      - 'functions/coursePortal.js'
      - 'functions/portalContractNotices.js'
      - 'tests/teacher-registration*'
      - '.github/workflows/verify-teacher-registration-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/entry-tests" --ignore-scripts --no-audit --no-fund jsdom@30.1.1
      - name: Verify approval and first login without live services
        run: |
          export NODE_PATH="$PWD/functions/node_modules:$RUNNER_TEMP/entry-tests/node_modules"
          node tests/teacher-registration-entry-page.cjs
          node tests/teacher-registration-page.cjs
          node --test tests/teacher-registration-access.test.cjs tests/teacher-approval-sync.test.cjs tests/teacher-registration-only.test.cjs tests/teacher-registration-line-binding.test.cjs tests/teacher-registration-notice.test.cjs tests/unified-email-login.test.cjs tests/unified-login.test.cjs tests/teacher-profile-flow.test.js tests/teacher-profile-change-review.test.js tests/teacher-utility-pending.test.js tests/personal-workspace-backend.test.cjs tests/teacher-manager-preview.test.cjs
