name: Verify Taiwan Teacher Endpoints

on:
  pull_request:
    branches: [main]
    paths:
      - config.js
      - .github/scripts/verify-teacher-taiwan-endpoints.cjs
      - .github/workflows/verify-teacher-taiwan-endpoints.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify deployed callable routes without a user session
        run: node .github/scripts/verify-teacher-taiwan-endpoints.cjs
