<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>我的合約｜老師課務</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="teacher-more-pages.css?v=20260730-teacher-more-v1">
  <style>
    :root{--contract-green:#1f6b4f;--contract-soft:#edf7f2;--contract-line:#d4e1da;--contract-ink:#183b2f}
    *{box-sizing:border-box}body{margin:0;background:#eef4f1;color:var(--contract-ink);padding-bottom:calc(30px + env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}
    .contract-shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:14px 0 30px}.contract-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.contract-nav button{min-height:48px;border:1px solid #c8d7d0;border-radius:14px;background:#fff;color:#294b3e;font-size:16px;font-weight:900}.contract-nav .logout{color:#a33f3f;background:#fff8f8;border-color:#eccaca}
    .contract-card{background:#fff;border:1px solid var(--contract-line);border-radius:19px;padding:17px;margin-bottom:12px;box-shadow:0 5px 16px rgba(27,72,54,.06)}.contract-card h1,.contract-card h2{margin:0}.contract-card h1{font-size:27px}.contract-card h2{font-size:20px}.contract-message{display:none;margin-top:10px;padding:11px 13px;border-radius:12px;background:var(--contract-soft);color:#245541;font-weight:800;line-height:1.55}.contract-message.error{background:#fff0ef;color:#a12d27}
    .loading{display:flex;align-items:center;gap:10px;color:#4f655b;font-weight:800}.loading:before{content:"";width:20px;height:20px;border:3px solid #bfd2c8;border-top-color:var(--contract-green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}
    .profile-required{text-align:center;padding:28px 18px}.profile-required h2{font-size:24px;margin-bottom:7px}.profile-required p{color:#65756e;margin:0 0 16px}.primary,.secondary{min-height:48px;border-radius:13px;padding:10px 16px;font-size:16px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--contract-green);color:#fff}.secondary{border:1px solid #b9cbc2;background:#fff;color:#245541}
    .contract-layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:12px;align-items:start}.side{min-width:0}.list{display:grid;gap:8px;margin-top:10px}.contract-item{width:100%;text-align:left;border:1px solid #d6e1db;background:#fff;border-radius:13px;padding:12px;color:inherit}.contract-item.active{border-color:var(--contract-green);box-shadow:0 0 0 2px rgba(31,107,79,.12)}.contract-item strong{display:block;font-size:16px}.contract-item small{display:block;color:#6a7771;margin-top:4px}.badge{display:inline-flex;margin-top:7px;border-radius:999px;padding:4px 9px;background:#fff3d9;color:#825500;font-size:12px;font-weight:900}.badge.review{background:#eef4ff;color:#315d94}.badge.active{background:#e8f7ed;color:#22613b}.empty{color:#6a7771;font-size:14px;line-height:1.6;margin-top:8px}
    .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.summary-grid div{background:#f7faf8;border:1px solid #e0e9e4;border-radius:12px;padding:10px}.summary-grid span{display:block;color:#697770;font-size:12px}.summary-grid b{display:block;margin-top:3px;word-break:break-word}.summary-grid .wide{grid-column:1/-1}
    .sign-card p{color:#64746d;margin:6px 0 12px}.sign-wrap{padding:9px;border:1px dashed #91ac9f;border-radius:14px;background:#fafcfb}.sign-canvas{display:block;width:100%;height:180px;border:1px solid #cbd8d1;border-radius:11px;background:#fff;touch-action:none}.sign-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.submit{grid-column:1/-1}
    .preview-card{overflow:hidden}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.preview{overflow:auto;background:#edf0ee;border-radius:14px;padding:12px}.preview-page{position:relative;width:210mm;min-height:297mm;margin:0 auto 12px;padding:15mm 14mm;background:#fff;color:#202522;box-shadow:0 3px 15px rgba(0,0,0,.12);font-family:"Noto Serif TC","PMingLiU",serif}.preview-title{text-align:center;font-size:24px;font-weight:900;letter-spacing:2px;margin:0 0 14px}.preview-meta,.preview-body{font-size:14px;line-height:1.85}.preview-body{white-space:normal}.article{margin-bottom:10px}.article-title{font-weight:900}.sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.sign-party{border:1px solid #d9dfdb;border-radius:10px;padding:12px;min-height:150px}.signature-view{height:75px;margin-top:10px;border:1px solid #d8dedb;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#89928e}.signature-view img{max-width:100%;max-height:100%}.page-no{position:absolute;right:14mm;bottom:10mm;color:#8a938f;font-size:11px}
    @media(max-width:900px){.contract-layout{grid-template-columns:1fr}.preview{padding:8px}.preview-page{transform-origin:top left;margin:0 0 -135mm;transform:scale(.52)}}
    @media(max-width:520px){.contract-shell{width:min(100% - 16px,1180px);padding-top:8px}.contract-card{padding:14px;border-radius:16px}.contract-card h1{font-size:24px}.summary-grid,.sign-actions{grid-template-columns:1fr}.submit,.summary-grid .wide{grid-column:auto}.preview-page{margin-bottom:-160mm;transform:scale(.43)}}
    @media print{body{background:#fff}.contract-nav,.side,.preview-head{display:none!important}.contract-shell,.contract-layout,.preview-card,.preview{display:block;width:auto;margin:0;padding:0;border:0;box-shadow:none;background:#fff}.preview-page{width:210mm;min-height:297mm;transform:none!important;margin:0;box-shadow:none;page-break-after:always}.preview-page:last-child{page-break-after:auto}@page{size:A4 portrait;margin:0}}
  </style>
  <script src="config.js?v=20260808-contract-profile-gate-v1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
</head>
<body class="teacher-utility-page utility-contract">
  <main class="contract-shell" data-teacher-utility-root>
    <nav class="contract-nav" aria-label="頁面操作">
      <button type="button" id="contractBackBtn">回老師課務</button>
      <button type="button" class="logout" id="contractLogoutBtn">登出</button>
    </nav>
    <section class="contract-card">
      <h1>我的合約</h1>
      <div class="contract-message" id="contractMessage" role="status" aria-live="polite"></div>
    </section>
    <section class="contract-card" id="contractLoading"><div class="loading">合約讀取中</div></section>
    <section class="contract-card profile-required hidden" id="contractProfileRequired">
      <h2>請先完成基本資料</h2>
      <p>基本資料完成後，系統才會自動帶入合約。</p>
      <button class="primary" type="button" id="contractOpenProfile">前往我的資料</button>
    </section>
    <section class="contract-layout hidden" id="contractContent">
      <div class="side">
        <section class="contract-card"><h2>待簽署</h2><div class="list" id="contractPendingList"></div></section>
        <section class="contract-card"><h2>等待主管確認</h2><div class="list" id="contractReviewList"></div></section>
        <section class="contract-card"><h2>已生效</h2><div class="list" id="contractActiveList"></div></section>
        <section class="contract-card hidden" id="contractProfileSummary">
          <h2>合約帶入資料</h2>
          <div class="summary-grid" id="contractSummaryGrid"></div>
        </section>
        <section class="contract-card sign-card hidden" id="contractSignCard">
          <h2>老師簽名</h2>
          <p>確認合約內容後簽名並送出主管確認。</p>
          <div class="sign-wrap"><canvas id="contractSignCanvas" class="sign-canvas"></canvas></div>
          <div class="sign-actions">
            <button class="secondary" type="button" id="contractClearSign">清除簽名</button>
            <button class="secondary" type="button" id="contractRefreshPreview">更新預覽</button>
            <button class="primary submit" type="button" id="contractSubmit">送出主管確認</button>
          </div>
        </section>
      </div>
      <section class="contract-card preview-card">
        <div class="preview-head"><h2>合約內容</h2><button class="secondary" type="button" id="contractPrint">列印</button></div>
        <div class="preview" id="contractPreview"><div class="empty">請選擇合約。</div></div>
      </section>
    </section>
  </main>
  <script src="teacher-contract.js?v=20260808-contract-profile-gate-v1"></script>
</body>
</html>
