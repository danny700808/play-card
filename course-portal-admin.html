<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>課務入口帳號管理｜柚子樂器</title>
  <link rel="stylesheet" href="course-portal.css?v=20260730-student-management-v1">
</head>
<body>
  <main class="portal-shell">
    <header class="portal-head">
      <div class="head-title"><span class="brand-mark">管</span><div><h1>登入帳號管理</h1><p>老師、學生／家長與一般租用者</p></div></div>
      <a class="btn" href="course-scheduler.html">返回排課系統</a>
    </header>
    <section class="card">
      <div class="section-title"><div><h2>三個獨立入口</h2><p class="muted">老師調課在老師入口內，不是第四個入口。</p></div></div>
      <div class="grid three">
        <a class="btn primary" href="student-course-portal.html">學生／家長入口</a>
        <a class="btn primary" href="teacher-course-portal.html">老師入口（含調課）</a>
        <a class="btn primary" href="room-booking.html">教室租用入口</a>
      </div>
    </section>
    <section class="card">
      <div class="toolbar">
        <div class="field"><label>管理密碼</label><input id="adminPin" type="password" autocomplete="current-password"></div>
        <button class="btn primary" id="loadBtn" type="button">讀取帳號資料</button>
      </div>
      <div class="notice">「停用」可日後恢復；「刪除登入資料」會清除 LINE／一般登入、驗證碼與裝置登入，讓本人重新註冊。老師、學生、課程、租用與帳務歷史不會刪除。</div>
    </section>
    <section class="card">
      <div class="section-title">
        <div><h2>停課學費未繳清</h2><p class="muted">老師辦理停課後，有未結清學費的學生會集中在這裡。</p></div>
        <span class="badge danger" id="suspensionBadge">0 筆</span>
      </div>
      <div class="list" id="suspensionList"><p class="muted">請先輸入管理密碼。</p></div>
    </section>
    <section class="card binding-admin-card">
      <nav class="tabs">
        <button class="btn active" type="button" data-filter="all">全部</button>
        <button class="btn" type="button" data-filter="teacher">老師</button>
        <button class="btn" type="button" data-filter="student">學生／家長</button>
        <button class="btn" type="button" data-filter="renter">一般租用</button>
      </nav>
      <div class="list" id="bindingList"><p class="muted">請先輸入管理密碼。</p></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="course-portal-common.js?v=20260730-student-management-v1"></script>
  <script>
  (function () {
    const P = window.CoursePortal;
    let rows = [];
    let unpaidSuspensions = [];
    let filter = 'all';

    function label(row) {
      if (row.type === 'teacher') return `老師 ${row.targetName || row.teacherId || ''}`;
      if (row.type === 'student') return `學生 ${row.targetName || row.studentId || ''}`;
      return `租用者 ${row.targetName || row.renterId || ''}`;
    }

    function loginMethod(row) {
      const hasLine = Boolean(row.lineDisplayName || /line/.test(row.authProvider || ''));
      const hasEmail = Boolean(row.emailVerified || /email/.test(row.authProvider || ''));
      if (hasLine && hasEmail) return 'LINE＋一般登入';
      if (hasLine) return 'LINE 登入';
      return '一般登入';
    }

    function render() {
      const visible = rows.filter((row) => filter === 'all' || row.type === filter);
      document.getElementById('bindingList').innerHTML = visible.length ? visible.map((row) => `
        <article class="list-row">
          <strong>${P.escapeHtml(label(row))}</strong>
          <span class="binding-meta"><b>${P.escapeHtml(loginMethod(row))}</b><small>${row.lineDisplayName ? P.escapeHtml(row.lineDisplayName) : '未使用 LINE'}${row.lineDisplayName ? `・${row.lineFriendFlag === true ? '可接收提醒' : '尚未開啟 LINE 提醒'}` : ''}</small></span>
          <span class="binding-meta"><b>${P.escapeHtml(row.email || (row.type === 'student' ? '學生／家長免填 Email' : '尚未設定 Email'))}</b><small>${row.emailVerified ? 'Email 已驗證' : (row.type === 'student' && !row.email ? '姓名＋電話登入' : 'Email 尚未驗證')}</small></span>
          <span class="binding-meta"><span class="badge ${row.status === 'active' ? '' : 'danger'}">${row.status === 'active' ? '使用中' : '已停用'}</span><small>${Number(row.activeSessionCount || 0)} 台裝置登入中</small></span>
          <span class="binding-actions">
            <button class="btn ${row.status === 'active' ? 'danger' : 'soft'}" type="button" data-id="${P.escapeHtml(row.id)}" data-type="${P.escapeHtml(row.type)}" data-action="${row.status === 'active' ? 'revoke' : 'restore'}">${row.status === 'active' ? '停用' : '恢復'}</button>
            <button class="btn danger" type="button" data-id="${P.escapeHtml(row.id)}" data-type="${P.escapeHtml(row.type)}" data-action="delete">刪除登入資料</button>
          </span>
        </article>`).join('') : '<p class="muted">目前沒有登入帳號。</p>';
    }

    function renderSuspensions() {
      document.getElementById('suspensionBadge').textContent = `${unpaidSuspensions.length} 筆`;
      document.getElementById('suspensionList').innerHTML = unpaidSuspensions.length ? unpaidSuspensions.map((row) => `
        <article class="list-row">
          <strong>${P.escapeHtml(row.studentName || row.studentId || '學生')}</strong>
          <span>授課老師：${P.escapeHtml(row.teacherName || row.teacherId || '未提供')}</span>
          <span>停課日：${P.escapeHtml(row.effectiveDate || '未提供')}</span>
          <strong class="danger-text">尚未繳清 ${P.money(row.currentUnpaidAmount)}</strong>
          <span><button class="btn primary" type="button" data-suspension-id="${P.escapeHtml(row.id)}">確認已繳清</button></span>
        </article>`).join('') : '<p class="muted">目前沒有停課後尚未繳清的學費。</p>';
    }

    async function load() {
      const button = document.getElementById('loadBtn');
      P.loading(button, true, '讀取中…');
      try {
        const result = await P.call('coursePortalAdminData', { adminPin: document.getElementById('adminPin').value });
        rows = result.bindings || [];
        unpaidSuspensions = result.unpaidSuspensions || [];
        render();
        renderSuspensions();
      } catch (error) { P.toast(error.message, 'error'); }
      finally { P.loading(button, false); }
    }

    document.getElementById('loadBtn').addEventListener('click', load);
    document.querySelectorAll('[data-filter]').forEach((button) => button.addEventListener('click', () => {
      filter = button.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach((node) => node.classList.toggle('active', node === button));
      render();
    }));
    document.getElementById('bindingList').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-id]');
      if (!button) return;
      if (button.dataset.action === 'revoke' && !confirm('確定停用這個入口帳號？所有裝置會立即登出，之後仍可恢復。')) return;
      if (button.dataset.action === 'delete' && !confirm('確定永久刪除這筆登入資料？LINE／一般登入、驗證碼與裝置登入都會清除，之後必須重新註冊；課程、租用與帳務歷史會保留。')) return;
      P.loading(button, true, '處理中…');
      try {
        await P.call('coursePortalAdminBindingAction', {
          adminPin: document.getElementById('adminPin').value,
          id: button.dataset.id,
          type: button.dataset.type,
          action: button.dataset.action
        });
        P.toast(button.dataset.action === 'delete' ? '登入資料已刪除，可重新註冊。' : '帳號狀態已更新。');
        await load();
      } catch (error) { P.toast(error.message, 'error'); }
      finally { P.loading(button, false); }
    });
    document.getElementById('suspensionList').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-suspension-id]');
      if (!button) return;
      if (!confirm('確定這位學生的停課學費已經繳清？確認後會從此區塊移除。')) return;
      P.loading(button, true, '確認中…');
      try {
        await P.call('coursePortalAdminSuspensionAction', {
          adminPin: document.getElementById('adminPin').value,
          id: button.dataset.suspensionId,
          action: 'settle'
        });
        P.toast('已確認繳清。');
        await load();
      } catch (error) { P.toast(error.message, 'error'); }
      finally { P.loading(button, false); }
    });
  })();
  </script>
</body>
</html>
