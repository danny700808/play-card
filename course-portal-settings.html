<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>租用與教室設定｜柚子樂器</title>
  <link rel="stylesheet" href="course-portal.css?v=20260730-rental-settings-v2">
  <link rel="stylesheet" href="course-portal-settings-v2.css?v=20260730-rental-settings-v2">
</head>
<body class="portal-settings-v2 clean-portal-ui">
  <main class="portal-shell">
    <header class="portal-head"><div class="head-title"><span class="brand-mark">設</span><div><h1>租用與教室設定</h1></div></div></header>
    <section class="card"><div class="toolbar"><div class="field" style="flex:1"><label>管理密碼</label><input id="pin" type="password"></div><button class="btn primary" id="loadSettings" type="button">讀取設定</button></div></section>

    <section class="card settings-section">
      <div class="section-title"><h2>營業時間</h2></div>
      <div id="businessRows"></div>
      <div class="notice">結束時間代表所有課程與租用必須在該時間前結束。例如 21:00 表示最晚到晚上 9 點。</div>
    </section>

    <section class="card settings-section">
      <div class="section-title"><h2>教室規則與租金</h2></div>
      <div id="roomRows"><p class="muted">請先讀取設定。</p></div>
    </section>

    <section class="card settings-section">
      <div class="section-title"><h2>租用用途</h2><button class="btn" id="addUse" type="button">新增用途</button></div>
      <div id="useRows"><p class="muted">請先讀取設定。</p></div>
    </section>

    <div class="settings-save-bar"><button class="btn primary" id="saveSettings" type="button">儲存全部設定</button></div>

    <section class="card settings-section" style="margin-top:14px">
      <div class="section-title"><h2>教材／商品獎金申請</h2><button class="btn" id="loadRequests" type="button">讀取申請</button></div>
      <div id="requests"><p class="muted">尚未讀取。</p></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="course-portal-common.js?v=20260730-rental-settings-v2"></script>
  <script src="course-portal-settings-v2.js?v=20260730-rental-settings-v2"></script>
</body>
</html>
