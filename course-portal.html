<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>柚子樂器課務服務入口</title>
  <link rel="stylesheet" href="course-portal.css?v=20260730-line-oauth-v2">
</head>
<body>
  <main class="portal-shell">
    <header class="portal-head">
      <div class="head-title"><span class="brand-mark">柚</span><div><h1>柚子樂器課務服務</h1></div></div>
    </header>
    <section class="grid three">
      <a class="card stack" href="teacher-course-portal.html" style="text-decoration:none">
        <span class="brand-mark">師</span><h2 style="margin:0">老師入口</h2>
        <span class="btn primary">進入</span>
      </a>
      <a class="card stack" href="student-course-portal.html" style="text-decoration:none">
        <span class="brand-mark">生</span><h2 style="margin:0">學生／家長入口</h2>
        <span class="btn primary">進入</span>
      </a>
      <a class="card stack" href="room-booking.html" style="text-decoration:none">
        <span class="brand-mark">租</span><h2 style="margin:0">教室租用</h2>
        <span class="btn primary">進入</span>
      </a>
    </section>
    <p class="notice hidden" id="portalEntryNotice" style="margin-top:16px"></p>
  </main>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const error = (params.get('lineError') || '').trim();
    if (error) {
      const notice = document.getElementById('portalEntryNotice');
      notice.textContent = error;
      notice.classList.remove('hidden');
      params.delete('lineError');
      history.replaceState({}, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
      return;
    }
    if (params.get('choose') === '1') return;
    const roles = [
      ['teacher', 'teacher-course-portal.html'],
      ['student', 'student-course-portal.html'],
      ['renter', 'room-booking.html']
    ];
    for (const role of roles) {
      const key = 'youzi.coursePortal.' + role[0] + '.session.v1';
      let token = '';
      try { token = sessionStorage.getItem(key) || localStorage.getItem(key) || ''; } catch (_) {}
      if (token) {
        location.replace(role[1]);
        return;
      }
    }
  })();
  </script>
</body>
</html>
