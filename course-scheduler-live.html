<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#233b35">
  <title>課程日表｜柚子樂器</title>
  <style>
    html,body{margin:0;min-height:100%;background:#eef5f2;color:#173f34;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .live-loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .live-loading div{width:min(420px,100%);padding:24px;border:1px solid #cbded7;border-radius:18px;background:#fff;box-shadow:0 18px 48px rgba(25,71,57,.12)}
    .live-loading b{display:block;font-size:20px}.live-loading span{display:block;margin-top:10px;color:#657d75;line-height:1.6}
  </style>
</head>
<body>
  <main class="live-loading"><div><b>正在開啟完整課表</b><span>先取得目前課程資料，再載入完整課表。</span></div></main>
  <script>
  (async function () {
    'use strict';
    function failure(error) {
      var node = document.querySelector('.live-loading span');
      if (node) node.textContent = '完整課表入口載入失敗：' + String(error && error.message || error || '未知錯誤');
      try { console.error('[course-scheduler-live]', error); } catch (_) {}
    }
    try {
      var response = await fetch('course-scheduler.html?template=20260729-live-v1-' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      var html = await response.text();
      html = html.replace(/course-scheduler\.css\?v=[^"']+/g, 'course-scheduler.css?v=20260729-live-full-scheduler-v1');
      var scripts = [
        '<script>try{history.replaceState(null,"","course-scheduler.html?live=20260729-v1"+location.hash);}catch(_){}</' + 'script>',
        '<script src="config.js?v=20260722-course-scheduler-v2"></' + 'script>',
        '<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></' + 'script>',
        '<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></' + 'script>',
        '<script src="course-scheduler-data.js?v=20260729-live-full-scheduler-v1"></' + 'script>',
        '<script src="course-data-auto-bootstrap-v1.js?v=20260729-live-full-scheduler-v1"></' + 'script>',
        '<script>window.__YOUZI_COURSE_AUTO_BOOTSTRAP_REQUESTED__=true;</' + 'script>',
        '<script src="course-scheduler-review-data.js?v=20260729-live-full-scheduler-v1"></' + 'script>',
        '<script src="course-scheduler-live-entry-v1.js?v=20260729-live-full-scheduler-v1"></' + 'script>'
      ].join('\n  ');
      var pattern = /\s*<script src="config\.js[^>]*><\/script>[\s\S]*?<\/body>/i;
      if (!pattern.test(html)) throw new Error('找不到舊課表腳本區塊');
      html = html.replace(pattern, '\n  ' + scripts + '\n</body>');
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      failure(error);
    }
  }());
  </script>
</body>
</html>
