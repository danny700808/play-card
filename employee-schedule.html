<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的班表</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="personal-embedded.css"><link rel="stylesheet" href="employee-month-view.css?v=20261101-month-view-v2">
<script src="employee-month-view.js?v=20261101-month-view-v1"></script></head>
<body class="personal-embedded"><main class="container"><section class="card"><h2>我的班表</h2><div id="scheduleMonth"></div><div id="scheduleRows" aria-live="polite"></div></section></main>
  <script src="config.js?v=20260919-taiwan-storage-v3"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-client.js?v=20261101-month-view-v1"></script>
  <script src="app.js?v=20261101-month-view-v1"></script>
<script>
const user=requireLogin();
async function loadSchedule(selection){
  const box=document.getElementById('scheduleRows');box.textContent='讀取中…';
  try{const result=await api('getMonthlySchedule',{userId:user.id,month:selection.month});if(!result.ok)throw Error(result.message||'班表讀取失敗');box.innerHTML=EmployeeMonthView.rowsHtml(result.rows||[]);}
  catch(e){box.textContent=e.message||'班表讀取失敗，請重新查詢。';}
}
if(user){const control=EmployeeMonthView.mount('#scheduleMonth',{onSearch:loadSchedule});loadSchedule(control.get());}
</script></body></html>
