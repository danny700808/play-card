<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>招生／線上報名｜柚子樂器</title><link rel="icon" href="yuzu-logo-green.png"><link rel="stylesheet" href="enrollment-admin.css?v=20261116-confirm"><link rel="stylesheet" href="internal-workspace.css?v=20261031-mobile1"></head>
<body><main class="enroll-admin">
<header><div><h1>招生／線上報名</h1><p>收到報名、聯絡學生，再確認建檔與排課。</p></div><a href="portal.html" class="button secondary">返回營運中心</a></header>
<p id="notice" role="status" class="notice">正在確認管理者登入…</p>
<section class="card" id="registrationPanel"><h2>報名網址</h2><p>拿到網址就能直接填寫，最後同意並驗證 LINE 身分。入口尚未放到官網或公開選單，可先傳給朋友測試。</p>
<label for="registrationUrl">課程報名表</label><input id="registrationUrl" readonly value="https://danny700808.github.io/play-card/enrollment.html"><div class="actions"><button id="copyRegistration" class="secondary">複製報名網址</button><a id="openRegistration" class="button" href="https://danny700808.github.io/play-card/enrollment.html" target="_blank" rel="noopener noreferrer">開啟報名表</a></div></section>
<section class="card"><div class="toolbar"><h2>報名收件匣</h2><button id="reload" class="secondary">重新整理</button></div><div class="filters"><input id="search" type="search" placeholder="搜尋姓名、電話、課程或 LINE 名稱"><select id="statusFilter"><option value="">全部狀態</option><option value="received">待聯絡</option><option value="contacted">已聯絡</option><option value="admitted">已建檔待排課</option><option value="scheduled">已排課</option><option value="closed">已結案</option></select></div><div id="records"></div><button id="more" class="secondary" hidden>載入更多</button></section>
</main>
<dialog id="detailDialog"><div class="toolbar"><h2 id="detailTitle">報名內容</h2><button id="closeDetail" class="secondary">關閉</button></div><p id="detailNotice" role="status"></p><div id="detailContent"></div></dialog>
<script src="config.js?v=20260919-taiwan-storage-v3"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="manager-auth.js?v=20261024-session-stability-v1"></script><script src="enrollment-confirmation-message.js?v=20261116-confirm"></script><script src="enrollment-scheduling-ui.js?v=20261116-confirm"></script><script src="enrollment-admin.js?v=20261116-confirm"></script><script src="global-nav.js?v=20260801-teacher-session-v2"></script><script src="internal-workspace-routes.js?v=20261115-enrollment"></script><script src="internal-workspace.js?v=20261031-mobile1"></script></body></html>
