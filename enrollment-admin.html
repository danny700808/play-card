<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>招生／線上報名｜柚子樂器</title><link rel="icon" href="yuzu-logo-green.png"><link rel="stylesheet" href="enrollment-admin.css"><link rel="stylesheet" href="internal-workspace.css?v=20261031-mobile1"></head>
<body><main class="enroll-admin">
<header><div><h1>招生／線上報名</h1><p>收到報名、聯絡學生，再確認建檔與排課。</p></div><a href="portal.html" class="button secondary">返回營運中心</a></header>
<p id="notice" role="status" class="notice">正在確認管理者登入…</p>
<section class="card" id="invitePanel"><h2>邀請測試</h2><p>報名入口不列在公開選單。測試連結有效 14 天，可隨時停用；每個連結最多接受 100 份報名。</p><div class="actions"><input id="inviteLabel" maxlength="60" placeholder="連結用途，例如朋友測試"><button id="createInvite">建立測試連結</button></div>
<div id="newInvite" hidden><label for="inviteUrl">新連結只在建立時顯示，請先複製保存。</label><input id="inviteUrl" readonly><div class="actions"><button id="copyInvite" class="secondary">複製連結</button><a id="openInvite" class="button" target="_blank" rel="noopener noreferrer">自己試填</a></div></div>
<details><summary>查看測試連結狀態</summary><div id="invites"></div></details></section>
<section class="card"><div class="toolbar"><h2>報名收件匣</h2><button id="reload" class="secondary">重新整理</button></div><div class="filters"><input id="search" type="search" placeholder="搜尋姓名、電話、課程或 LINE 名稱"><select id="statusFilter"><option value="">全部狀態</option><option value="received">待聯絡</option><option value="contacted">已聯絡</option><option value="admitted">已建檔</option><option value="closed">已結案</option></select></div><div id="records"></div><button id="more" class="secondary" hidden>載入更多</button></section>
</main>
<dialog id="detailDialog"><div class="toolbar"><h2 id="detailTitle">報名內容</h2><button id="closeDetail" class="secondary">關閉</button></div><p id="detailNotice" role="status"></p><div id="detailContent"></div></dialog>
<script src="config.js?v=20260919-taiwan-storage-v3"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script><script src="manager-auth.js?v=20261024-session-stability-v1"></script><script src="enrollment-admin.js"></script><script src="global-nav.js?v=20260801-teacher-session-v2"></script><script src="internal-workspace-routes.js?v=20261115-enrollment"></script><script src="internal-workspace.js?v=20261031-mobile1"></script></body></html>
