<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2026 年 7 月歷史平台訂單補登</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#173247;background:#f4f7f5}
    *{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:920px;margin:auto}.card{background:#fff;border:1px solid #dbe6df;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(23,50,71,.08)}
    h1{margin:0 0 8px;font-size:25px}p{line-height:1.65}.notice{background:#fff7d6;border:1px solid #ead581;border-radius:12px;padding:12px 14px}.ok{background:#e9f8ef;border-color:#9ed8b3}.bad{background:#fff0f0;border-color:#e8aaaa}
    input{display:block;width:100%;padding:14px;border:1px solid #b9cbc0;border-radius:12px;background:#fff;margin:18px 0}button{border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;background:#236b4c;color:#fff;margin-right:8px}button:disabled{opacity:.45;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.kpi{background:#f1f7f3;border-radius:12px;padding:14px}.kpi b{display:block;font-size:22px;margin-top:6px}.muted{color:#62776a;font-size:14px}pre{white-space:pre-wrap;background:#13281f;color:#dff5e7;padding:14px;border-radius:12px;max-height:330px;overflow:auto}
    @media(max-width:680px){body{padding:12px}.card{padding:16px}.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>2026 年 7 月歷史平台訂單補登</h1>
  <p>只寫入平台訂單營收、成本與毛利；不修改商品庫存，也不建立庫存異動。</p>
  <div class="notice" id="status">請選擇 profit_report_本月_20260701_20260731_20260731_153335.xlsx。</div>
  <input id="file" type="file" accept=".xlsx,.xls">
  <div id="summary" hidden>
    <div class="grid">
      <div class="kpi">應補訂單<b id="orders">—</b></div>
      <div class="kpi">商品明細<b id="rows">—</b></div>
      <div class="kpi">銷售小計<b id="sales">—</b></div>
      <div class="kpi">入帳估算<b id="net">—</b></div>
      <div class="kpi">成本合計<b id="cost">—</b></div>
      <div class="kpi">毛利<b id="profit">—</b></div>
    </div>
    <p class="muted" id="duplicateText"></p>
  </div>
  <button id="preview" disabled>檢查與預覽</button>
  <button id="commit" disabled>正式補登（不扣庫存）</button>
  <pre id="log">尚未讀取檔案。</pre>
</div></div>

<script src="config.js?v=20260508frontendperf1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
  'use strict';
  const PERIOD_START='2026-07-01', PERIOD_END_EXCLUSIVE='2026-07-11';
  const EXPECTED={orders:23,rows:32,sales:26832,net:23343.84,cost:13048,profit:10295.84};
  const KNOWN_DUPLICATES=new Set(['EasyStore|3829','EasyStore|3830','Coupang|126101522569322']);
  const BATCH_ID='HIST-20260701-20260710-NOSTOCK-V1';
  const FILE_NAME='profit_report_本月_20260701_20260731_20260731_153335.xlsx';
  const $=id=>document.getElementById(id), money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
  let parsedRows=[],previewRows=[],excludedKeys=[],db=null;
  const log=(message)=>{$('log').textContent+='\n'+message;$('log').scrollTop=$('log').scrollHeight;};
  const setStatus=(message,kind)=>{$('status').textContent=message;$('status').className='notice '+(kind||'');};
  const text=v=>String(v==null?'':v).trim(), number=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
  const orderKey=row=>text(row['平台'])+'|'+text(row['訂單編號']);
  const round2=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
  function dateText(v){
    if(v instanceof Date&&!Number.isNaN(v.getTime()))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0')+' '+String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0')+':'+String(v.getSeconds()).padStart(2,'0');
    const raw=text(v).replace(/\//g,'-');return raw.length===10?raw+' 00:00:00':raw;
  }
  function taiwanTimestamp(v){
    const raw=dateText(v);const d=new Date(raw.replace(' ','T')+'+08:00');if(Number.isNaN(d.getTime()))throw new Error('日期格式不正確：'+raw);return firebase.firestore.Timestamp.fromDate(d);
  }
  function summarize(rows){
    return {orders:new Set(rows.map(orderKey)).size,rows:rows.length,sales:round2(rows.reduce((s,r)=>s+number(r['銷售小計']),0)),net:round2(rows.reduce((s,r)=>s+number(r['入帳估算(小計x0.87)']),0)),cost:round2(rows.reduce((s,r)=>s+number(r['成本合計']),0)),profit:round2(rows.reduce((s,r)=>s+number(r['毛利']),0))};
  }
  function showSummary(s){
    $('summary').hidden=false;$('orders').textContent=s.orders+' 筆';$('rows').textContent=s.rows+' 列';$('sales').textContent=money(s.sales);$('net').textContent=money(s.net);$('cost').textContent=money(s.cost);$('profit').textContent=money(s.profit);
  }
  async function initDb(){
    const cfg=window.APP_CONFIG&&window.APP_CONFIG.FIREBASE_CONFIG;if(!cfg||!cfg.projectId)throw new Error('找不到 Firebase 設定');if(!firebase.apps.length)firebase.initializeApp(cfg);db=firebase.firestore();
  }
  async function sha256(value){const bytes=new TextEncoder().encode(value),hash=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,40);}
  async function existingOrderKeys(rows){
    const keys=new Set(),byNo=new Map();rows.forEach(r=>{const no=text(r['訂單編號']);if(!byNo.has(no))byNo.set(no,new Set());byNo.get(no).add(text(r['平台']));});
    const orderNos=Array.from(byNo.keys());
    for(let i=0;i<orderNos.length;i+=10){
      const part=orderNos.slice(i,i+10),snap=await db.collection('opsPlatformOrders').where('externalOrderNo','in',part).get();
      snap.forEach(doc=>{const d=doc.data()||{},key=text(d.platform)+'|'+text(d.externalOrderNo);if(byNo.has(text(d.externalOrderNo)))keys.add(key);});
    }
    return keys;
  }
  $('file').addEventListener('change',async function(){
    $('preview').disabled=true;$('commit').disabled=true;parsedRows=[];previewRows=[];$('log').textContent='讀取檔案…';
    try{
      const file=this.files&&this.files[0];if(!file)throw new Error('尚未選擇檔案');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets['毛利明細'];if(!ws)throw new Error('找不到「毛利明細」工作表');
      const all=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});
      parsedRows=all.filter(row=>{const day=dateText(row['訂單時間']).slice(0,10);return day>=PERIOD_START&&day<PERIOD_END_EXCLUSIVE;});
      if(!parsedRows.length)throw new Error('檔案內沒有 2026/07/01～07/10 資料');
      $('preview').disabled=false;setStatus('已讀到 7 月 1～10 日資料，請按「檢查與預覽」。','ok');log('期間內：'+summarize(parsedRows).orders+' 筆訂單、'+parsedRows.length+' 列商品。');
    }catch(error){setStatus(error.message,'bad');log('錯誤：'+error.message);}
  });
  $('preview').addEventListener('click',async function(){
    this.disabled=true;$('commit').disabled=true;$('log').textContent='開始檢查重複訂單…';
    try{
      await initDb();const existing=await existingOrderKeys(parsedRows);KNOWN_DUPLICATES.forEach(k=>existing.add(k));
      previewRows=parsedRows.filter(row=>!existing.has(orderKey(row)));const s=summarize(previewRows),dupes=Array.from(new Set(parsedRows.map(orderKey).filter(k=>existing.has(k)))).sort();excludedKeys=dupes;
      showSummary(s);$('duplicateText').textContent='排除已存在訂單：'+dupes.join('、');log('排除 '+dupes.length+' 筆既有訂單：'+dupes.join('、'));log('待補：'+s.orders+' 筆訂單、'+s.rows+' 列商品。');log('銷售 '+money(s.sales)+'｜入帳 '+money(s.net)+'｜成本 '+money(s.cost)+'｜毛利 '+money(s.profit));
      const matches=Object.keys(EXPECTED).every(k=>Math.abs(s[k]-EXPECTED[k])<0.011);
      if(!matches)throw new Error('核對結果與預期不一致，已停止匯入。預期 23 筆／32 列／銷售 26,832 元。');
      setStatus('核對通過：23 筆訂單、32 列商品，可正式補登；庫存不會改變。','ok');$('commit').disabled=false;
    }catch(error){setStatus(error.message,'bad');log('停止：'+error.message);}finally{$('preview').disabled=false;}
  });
  $('commit').addEventListener('click',async function(){
    this.disabled=true;$('preview').disabled=true;setStatus('正在寫入 40 筆歷史訂單，請勿關閉頁面…','');log('正式補登開始。');
    try{
      const before=await existingOrderKeys(previewRows);if(before.size)throw new Error('執行前又發現重複訂單，已停止：'+Array.from(before).join('、'));
      const batch=db.batch(),now=firebase.firestore.FieldValue.serverTimestamp();
      const orderCounters=new Map();
      for(const row of previewRows){
        const key=orderKey(row),idx=(orderCounters.get(key)||0)+1;orderCounters.set(key,idx);
        const platform=text(row['平台']),orderNo=text(row['訂單編號']),sku=text(row['商品編號/SKU']),lineIdentity=[BATCH_ID,platform,orderNo,sku,idx].join('|'),docId='hist_'+await sha256(lineIdentity);
        const quantity=Math.max(0,Math.round(number(row['數量']))),gross=number(row['銷售小計']),net=number(row['入帳估算(小計x0.87)']),cost=number(row['成本合計']),profit=number(row['毛利']);
        batch.set(db.collection('opsPlatformOrders').doc(docId),{
          id:docId,platform:platform,externalOrderId:orderNo,externalOrderNo:orderNo,externalLineId:'historical-'+idx,orderedAt:taiwanTimestamp(row['訂單時間']),hasOriginalOrderDate:true,orderDateSource:'historical-profit-report',orderTimeEstimated:false,orderDateRepaired:false,reportedOrderedAt:'',
          sku:sku,productName:text(row['商品名稱']),variantName:text(row['規格名稱']),quantity:quantity,unitPrice:number(row['單價']),grossAmount:gross,currency:'TWD',orderStatus:text(row['訂單狀態']),paymentStatus:text(row['付款狀態']),customerName:text(row['買家/顧客']),note:text(row['備註']),validSale:true,lifecycle:'active',
          priceSource:text(row['價格來源']),estimatedNetRate:0.87,estimatedNetAmount:net,costTotal:cost,estimatedProfit:profit,costMethod:'historical-excel',unknownCostQty:0,matchStatus:'historical-cost-matched',processingStatus:'historical-import-no-stock',
          inventoryApplied:true,inventoryEffect:'none',inventorySkipped:true,inventoryBefore:null,inventoryAfter:null,inventoryAppliedAt:null,historicalImport:true,historicalImportBatch:BATCH_ID,sourceFile:FILE_NAME,
          firstSeenAt:now,lastSeenAt:now,importedAt:now,importedBy:'one-time-historical-import',syncRunId:BATCH_ID,version:'2026.07.31-historical-no-stock-v1'
        });
      }
      const s=summarize(previewRows);
      batch.set(db.collection('opsPlatformSyncRuns').doc(BATCH_ID),{runId:BATCH_ID,trigger:'historical-excel-import',status:'completed',historicalImport:true,inventoryEffect:'none',sourceFile:FILE_NAME,periodStart:PERIOD_START,periodEnd:'2026-07-10',excludedOrders:excludedKeys,summary:{orders:s.orders,lines:s.rows,grossAmount:s.sales,estimatedNetAmount:s.net,costTotal:s.cost,estimatedProfit:s.profit,applyInventory:false},startedAt:now,finishedAt:now,version:'2026.07.31-historical-no-stock-v1'},{merge:true});
      batch.set(db.collection('opsAuditLogs').doc(),{action:'歷史平台訂單補登',entityType:'platformOrderImport',entityId:BATCH_ID,summary:'2026/07/01～07/10｜23 筆訂單｜32 列｜不扣庫存',details:{grossAmount:s.sales,estimatedNetAmount:s.net,costTotal:s.cost,estimatedProfit:s.profit,excludedOrders:excludedKeys},createdAt:now,createdBy:'one-time-historical-import',version:'2026.07.31-historical-no-stock-v1'});
      await batch.commit();
      const verify=await db.collection('opsPlatformOrders').where('historicalImportBatch','==',BATCH_ID).get(),verifyRows=[];verify.forEach(d=>verifyRows.push(d.data()));const verified={orders:new Set(verifyRows.map(d=>text(d.platform)+'|'+text(d.externalOrderNo))).size,rows:verifyRows.length,sales:round2(verifyRows.reduce((s,d)=>s+number(d.grossAmount),0)),net:round2(verifyRows.reduce((s,d)=>s+number(d.estimatedNetAmount),0)),cost:round2(verifyRows.reduce((s,d)=>s+number(d.costTotal),0)),profit:round2(verifyRows.reduce((s,d)=>s+number(d.estimatedProfit),0))};
      if(!Object.keys(EXPECTED).every(k=>Math.abs(verified[k]-EXPECTED[k])<0.011))throw new Error('寫入後核對不一致：'+JSON.stringify(verified));
      showSummary(verified);setStatus('補登完成：23 筆訂單、32 列商品；營收與毛利已寫入，庫存未變動。','ok');log('完成並核對通過。批次：'+BATCH_ID);log('庫存交易新增：0 筆。');
    }catch(error){setStatus('補登失敗：'+error.message,'bad');log('錯誤：'+error.message);$('commit').disabled=false;}finally{$('preview').disabled=false;}
  });
})();
</script>
</body>
</html>
