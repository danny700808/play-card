<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>柚子樂器系統｜登入</title>
  <link rel="stylesheet" href="style.css?v=20260803-login-gateway-v1">
  <link rel="stylesheet" href="login-secondary-compact-v1.css?v=20260803-secondary-compact-v1">
  <style>
    body.yz-login-page{min-height:100svh}
    .login-card{max-width:560px}
    .login-intro{text-align:center;margin:2px 0 14px;color:#61736b;font-size:14px}
    .login-primary-card{display:block;border:1px solid #91c9b0;border-radius:18px;padding:15px;background:#edf9f3;color:#17352c;text-decoration:none;box-shadow:0 0 0 2px rgba(36,115,92,.05)}
    .login-primary-heading{display:flex;align-items:center;gap:12px}
    .login-primary-icon{display:grid;place-items:center;width:52px;height:52px;flex:0 0 auto;border-radius:15px;background:#24735c;color:#fff;font-size:14px;font-weight:950}
    .login-primary-copy{min-width:0;flex:1}
    .login-primary-copy strong{display:block;font-size:20px}
    .login-primary-copy small{display:block;margin-top:3px;color:#60756b;font-size:12px;line-height:1.45}
    .login-primary-tag{align-self:flex-start;border-radius:999px;padding:5px 9px;background:#24735c;color:#fff;font-size:11px;font-weight:900}
    .login-primary-cta{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:13px;border-radius:13px;background:#24735c;color:#fff;font-size:16px;font-weight:900}
    .login-alt-toggle{width:100%;min-height:46px;margin-top:12px;border:1px solid #d7e2dc;border-radius:13px;background:#fff;color:#315246;font-weight:850;cursor:pointer}
    .login-alt-panel{margin-top:10px;padding:12px;border:1px solid #dbe5df;border-radius:16px;background:#fbfdfc}
    .login-alt-panel.hidden,.account-mode.hidden{display:none}
    .service-email-link{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid #d7e4dd;border-radius:13px;background:#fff;color:#17352c;text-decoration:none}
    .service-email-link span{display:grid;place-items:center;width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:#eef3f0;color:#315246;font-weight:950}
    .service-email-link strong,.service-email-link small{display:block}
    .service-email-link small{margin-top:2px;color:#697b73;font-size:11px;line-height:1.45}
    .auth-method-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:#7a8a82;font-size:12px;font-weight:850}
    .auth-method-divider:before,.auth-method-divider:after{content:"";height:1px;flex:1;background:#dbe5df}
    .internal-login-title{margin:0 0 9px;color:#17352c;font-size:15px}
    .auth-panel{margin-top:0}
    .auth-note{margin-top:8px;padding:10px 12px;border-radius:14px;background:#f3f7f4;color:#355f4a;font-size:13px;line-height:1.65}
    .auth-back-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .auth-sub-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
    body.yz-login-page .auth-sub-actions .btn,body.yz-login-page .auth-sub-actions .btn-link{width:100%;min-height:38px!important;margin-top:0;padding:6px 3px!important;display:flex;align-items:center;justify-content:center;text-decoration:none;background:#fff!important;color:#17252f!important;border:1px solid #dbe4e9!important;border-radius:10px!important;font-size:12px!important;white-space:nowrap}
    .password-rule{margin-top:6px;font-size:12px;line-height:1.6;color:#6b7280}
    @media(max-width:520px){
      .login-primary-card{padding:13px}
      .login-primary-icon{width:46px;height:46px;border-radius:13px}
      .login-primary-copy strong{font-size:18px}
      .login-primary-cta{min-height:46px}
    }
  </style>
</head>
<body class="yz-login-page">
  <div class="container">
    <div class="card login-card">
      <div class="yz-login-brand">
        <div class="yz-login-mark">♫</div>
        <div class="header login-header">
          <h1 class="title center">柚子樂器系統</h1>
        </div>
      </div>

      <div id="msg" class="message"></div>
      <p class="login-intro">登入後，系統會依照您的身分顯示可使用的服務。</p>

      <a class="login-primary-card" href="course-portal.html?method=line" id="lineGateway">
        <div class="login-primary-heading">
          <span class="login-primary-icon">LINE</span>
          <span class="login-primary-copy">
            <strong>使用 LINE 登入</strong>
            <small>老師、家長、學生與教室租用</small>
          </span>
          <span class="login-primary-tag">推薦</span>
        </div>
        <span class="login-primary-cta">使用 LINE 繼續</span>
      </a>

      <button class="login-alt-toggle" id="alternateLoginToggle" type="button" aria-expanded="false" aria-controls="alternateLoginHost">沒有 LINE？使用其他方式</button>
      <div id="alternateLoginHost" class="login-alt-panel hidden"></div>
    </div>
  </div>

  <template id="alternateLoginTemplate">
    <a class="service-email-link" href="course-portal.html?method=email">
      <span>@</span>
      <div>
        <strong>使用 Email 驗證登入</strong>
        <small>老師、家長、學生或租用者，使用四碼驗證碼登入</small>
      </div>
    </a>

    <div class="auth-method-divider"><span>管理者／員工</span></div>

    <section id="loginPanel" class="auth-panel account-mode">
      <h2 class="internal-login-title">管理者／員工帳號登入</h2>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="請輸入 Email">
      </div>
      <div class="field">
        <label>密碼</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼">
          <button type="button" class="eye" id="eyeBtn" aria-label="顯示或隱藏密碼">👁</button>
        </div>
      </div>
      <div class="remember-row">
        <label class="remember-label"><input id="rememberLogin" type="checkbox" checked> <span>記住帳號</span></label>
      </div>
      <div class="login-actions-stack">
        <button class="btn login-main-btn" id="loginBtn" type="button">登入</button>
        <div class="auth-sub-actions">
          <button class="btn secondary" id="forgotBtn" type="button">忘記密碼</button>
          <button class="btn secondary" id="resetBtn" type="button">重設密碼</button>
          <a href="register.html" class="btn btn-link">前往註冊</a>
        </div>
      </div>
    </section>

    <section id="forgotPanel" class="auth-panel account-mode hidden">
      <h2 class="internal-login-title">忘記密碼</h2>
      <div class="field">
        <label>Email</label>
        <input id="forgotEmail" type="email" autocomplete="email" placeholder="請輸入已註冊 Email">
      </div>
      <div class="auth-note">系統會產生暫時密碼並寄到您的 Email。</div>
      <div class="login-actions-stack">
        <button class="btn login-main-btn" id="forgotSubmitBtn" type="button">寄送暫時密碼</button>
        <div class="auth-back-row"><button class="btn secondary" id="backToLoginFromForgot" type="button">返回登入</button></div>
      </div>
    </section>

    <section id="resetPanel" class="auth-panel account-mode hidden">
      <h2 class="internal-login-title">重設密碼</h2>
      <div class="field"><label>Email</label><input id="resetEmail" type="email" autocomplete="email" placeholder="請輸入已註冊 Email"></div>
      <div class="field">
        <label>原密碼</label>
        <div class="password-wrap">
          <input id="resetOldPassword" type="password" autocomplete="current-password" placeholder="請輸入目前密碼">
          <button type="button" class="eye" id="resetOldEyeBtn">👁</button>
        </div>
      </div>
      <div class="field">
        <label>新密碼</label>
        <div class="password-wrap">
          <input id="resetNewPassword" type="password" autocomplete="new-password" placeholder="請輸入新密碼">
          <button type="button" class="eye" id="resetNewEyeBtn">👁</button>
        </div>
        <div class="password-rule">至少 8 碼，需包含英文大寫、英文小寫與數字。</div>
      </div>
      <div class="field">
        <label>確認新密碼</label>
        <div class="password-wrap">
          <input id="resetConfirmPassword" type="password" autocomplete="new-password" placeholder="請再次輸入新密碼">
          <button type="button" class="eye" id="resetConfirmEyeBtn">👁</button>
        </div>
      </div>
      <div class="login-actions-stack">
        <button class="btn login-main-btn" id="resetSubmitBtn" type="button">確認重設密碼</button>
        <div class="auth-back-row"><button class="btn secondary" id="backToLoginFromReset" type="button">返回登入</button></div>
      </div>
    </section>
  </template>

  <script src="config.js?v=20260805-auth-route-cleanup-v1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="firebase-client.js?v=20260802-manager-login-hotfix1"></script>
  <script src="app.js?v=20260803-login-gateway-v1"></script>
  <script>
    (function () {
      'use strict';

      const msg = qs('#msg');
      const host = qs('#alternateLoginHost');
      const toggle = qs('#alternateLoginToggle');
      const template = qs('#alternateLoginTemplate');
      const loginReturnPages = new Set([
        'profile.html',
        'contract.html',
        'announcements.html',
        'task.html',
        'teacher-goods.html',
        'forms-hub.html'
      ]);
      let accountUiReady = false;
      let redirecting = false;

      function requestedLoginTarget() {
        const value = String(new URLSearchParams(location.search).get('next') || '').trim().toLowerCase();
        return loginReturnPages.has(value) ? value : '';
      }

      function buttonProgress(button, label) {
        if (typeof startActionButtonProgress === 'function') {
          return startActionButtonProgress(button, { label: label || '處理中' });
        }
        if (button) button.disabled = true;
        return {
          done: function () { if (button) button.disabled = false; },
          fail: function () { if (button) button.disabled = false; }
        };
      }

      function fillSharedEmail(value) {
        const text = String(value || '').trim();
        if (!text) return;
        ['#email', '#forgotEmail', '#resetEmail'].forEach(function (selector) {
          const input = qs(selector);
          if (input) input.value = text;
        });
      }

      function setAccountMode(mode) {
        ['login', 'forgot', 'reset'].forEach(function (name) {
          const panel = qs('#' + name + 'Panel');
          if (panel) panel.classList.toggle('hidden', name !== mode);
        });
        setMsg(msg, '');
        if (mode === 'forgot') {
          fillSharedEmail((qs('#email') && qs('#email').value) || (qs('#resetEmail') && qs('#resetEmail').value));
          qs('#forgotEmail').focus();
        } else if (mode === 'reset') {
          fillSharedEmail((qs('#email') && qs('#email').value) || (qs('#forgotEmail') && qs('#forgotEmail').value));
          qs('#resetEmail').focus();
        } else {
          fillSharedEmail(
            (qs('#forgotEmail') && qs('#forgotEmail').value) ||
            (qs('#resetEmail') && qs('#resetEmail').value) ||
            (qs('#email') && qs('#email').value)
          );
          qs('#email').focus();
        }
      }

      function finishInternalLogin(user) {
        if (redirecting) return;
        redirecting = true;
        saveUser(user);
        const target = requestedLoginTarget() || loginDestination(user);
        setMsg(msg, '登入成功，正在進入系統…');
        window.location.replace(target);
      }

      function bindAccountUi() {
        if (accountUiReady) return;
        accountUiReady = true;
        host.appendChild(template.content.cloneNode(true));
        applySavedLogin();

        ['#email', '#password'].forEach(function (selector) {
          const input = qs(selector);
          if (input) input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') qs('#loginBtn').click();
          });
        });

        qs('#eyeBtn').onclick = function () { togglePassword('#password', qs('#eyeBtn')); };
        qs('#resetOldEyeBtn').onclick = function () { togglePassword('#resetOldPassword', qs('#resetOldEyeBtn')); };
        qs('#resetNewEyeBtn').onclick = function () { togglePassword('#resetNewPassword', qs('#resetNewEyeBtn')); };
        qs('#resetConfirmEyeBtn').onclick = function () { togglePassword('#resetConfirmPassword', qs('#resetConfirmEyeBtn')); };

        qs('#forgotBtn').onclick = function () { setAccountMode('forgot'); };
        qs('#resetBtn').onclick = function () { setAccountMode('reset'); };
        qs('#backToLoginFromForgot').onclick = function () { setAccountMode('login'); };
        qs('#backToLoginFromReset').onclick = function () { setAccountMode('login'); };

        qs('#loginBtn').onclick = async function () {
          const button = qs('#loginBtn');
          const progress = buttonProgress(button, '登入中');
          setMsg(msg, '');
          try {
            const result = await api('login', {
              email: qs('#email').value.trim(),
              password: qs('#password').value.trim()
            });
            if (!result || !result.ok) {
              progress.fail('登入失敗');
              setMsg(msg, result && result.message ? result.message : '登入失敗', true);
              return;
            }
            saveLoginPref(qs('#email').value.trim(), '', qs('#rememberLogin').checked);
            progress.done('登入成功');
            finishInternalLogin(result.user);
          } catch (error) {
            progress.fail('登入失敗');
            setMsg(msg, error && error.message ? error.message : '登入失敗', true);
          }
        };

        qs('#forgotSubmitBtn').onclick = async function () {
          const email = qs('#forgotEmail').value.trim();
          if (!email) {
            setMsg(msg, '請先輸入 Email。', true);
            qs('#forgotEmail').focus();
            return;
          }
          fillSharedEmail(email);
          const button = qs('#forgotSubmitBtn');
          const progress = buttonProgress(button, '寄送中');
          try {
            const result = await api('forgotPassword', { email: email });
            setMsg(msg, result.message, !result.ok);
            if (result.ok) progress.done('已寄出');
            else progress.fail('寄送失敗');
          } catch (error) {
            progress.fail('寄送失敗');
            setMsg(msg, error && error.message ? error.message : '寄送失敗', true);
          }
        };

        qs('#resetSubmitBtn').onclick = async function () {
          const email = qs('#resetEmail').value.trim();
          const oldPassword = qs('#resetOldPassword').value.trim();
          const newPassword = qs('#resetNewPassword').value.trim();
          const confirmPassword = qs('#resetConfirmPassword').value.trim();
          if (!email || !oldPassword || !newPassword || !confirmPassword) {
            setMsg(msg, '請完整填寫 Email、原密碼與兩次新密碼。', true);
            return;
          }
          fillSharedEmail(email);
          const button = qs('#resetSubmitBtn');
          const progress = buttonProgress(button, '更新中');
          try {
            const result = await api('changePassword', {
              email: email,
              oldPassword: oldPassword,
              newPassword: newPassword,
              confirmPassword: confirmPassword
            });
            setMsg(msg, result.message, !result.ok);
            if (result.ok) {
              qs('#password').value = '';
              qs('#resetOldPassword').value = '';
              qs('#resetNewPassword').value = '';
              qs('#resetConfirmPassword').value = '';
              progress.done('更新完成');
            } else {
              progress.fail('更新失敗');
            }
          } catch (error) {
            progress.fail('更新失敗');
            setMsg(msg, error && error.message ? error.message : '更新失敗', true);
          }
        };
      }

      function openAlternate() {
        bindAccountUi();
        host.classList.remove('hidden');
        toggle.setAttribute('aria-expanded', 'true');
        toggle.textContent = '收起其他登入方式';
      }

      function closeAlternate() {
        host.classList.add('hidden');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = '沒有 LINE？使用其他方式';
      }

      toggle.addEventListener('click', function () {
        if (host.classList.contains('hidden')) openAlternate();
        else closeAlternate();
      });

      const params = new URLSearchParams(location.search);
      if (requestedLoginTarget() || params.get('mode') === 'account') {
        openAlternate();
      }
    })();
  </script>
  <script src="ui-action-feedback.js?v=20260701safe3"></script>
</body>
</html>
