<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173a34">
  <title>統一 LINE 綁定管理｜柚子樂器</title>
  <link rel="icon" href="yuzu-logo-green.png">
  <link rel="stylesheet" href="course-portal.css?v=20260731-final-rules-v1">
  <link rel="stylesheet" href="line-binding-admin.css?v=20260805-unified-line-v3">
</head>
<body>
  <main class="line-admin-shell">
    <header class="line-admin-head">
      <div class="line-admin-title">
        <span class="line-admin-mark">LINE</span>
        <div>
          <h1>統一 LINE 綁定管理</h1>
          <p>課務、員工、外聘老師與租賃的 LINE 關係集中在同一處。</p>
        </div>
      </div>
      <a class="btn soft" href="portal.html#customers">返回客戶會員</a>
    </header>

    <section class="line-admin-notice">
      <strong>「完全解除 LINE」代表全系統斷開。</strong>
      <span>會停止登入與通知、取消尚未送出的 LINE 訊息，並保留課程、薪資、打卡、租賃與帳務歷史。之後要使用，必須重新綁定。</span>
    </section>

    <section class="line-admin-summary" id="lineSummary" aria-live="polite">
      <div class="line-summary-card"><span>LINE 帳號</span><b>—</b><small>正在讀取</small></div>
      <div class="line-summary-card"><span>有效身分</span><b>—</b><small>正在讀取</small></div>
      <div class="line-summary-card attention"><span>需處理帳號</span><b>—</b><small>正在讀取</small></div>
      <div class="line-summary-card"><span>同角色衝突</span><b>—</b><small>正在讀取</small></div>
    </section>

    <section class="line-admin-card">
      <div class="line-admin-toolbar">
        <label class="line-search-field">
          <span>搜尋</span>
          <input id="lineBindingSearch" type="search" autocomplete="off" placeholder="LINE 名稱、身分姓名、員工／老師／學生編號">
        </label>
        <div class="line-toolbar-actions">
          <button class="btn soft" id="reloadLineBindings" type="button">重新掃描</button>
          <button class="btn danger" id="cleanupAllLineBindings" type="button">整理全部殘留</button>
        </div>
      </div>

      <nav class="line-filter-tabs" id="lineFilterTabs" aria-label="LINE 綁定篩選">
        <button class="active" type="button" data-filter="all">全部</button>
        <button type="button" data-filter="attention">需處理</button>
        <button type="button" data-filter="multi">同角色衝突</button>
        <button type="button" data-filter="employee">員工／外聘</button>
        <button type="button" data-filter="course">老師／學生／租用</button>
        <button type="button" data-filter="rental">設備租賃</button>
      </nav>

      <div class="line-admin-status" id="lineAdminStatus">正在掃描所有 LINE 綁定來源…</div>
      <div class="line-binding-list" id="lineBindingList"></div>
    </section>
  </main>

  <div class="line-admin-mask hidden" id="lineAdminMask" role="status" aria-live="polite">
    <div class="line-admin-progress">
      <span class="line-spinner"></span>
      <strong id="lineAdminProgressTitle">正在處理</strong>
      <p id="lineAdminProgressText">請稍候，不要重複按下按鈕。</p>
    </div>
  </div>

  <script src="config.js?v=20260805-auth-route-cleanup-v1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="app.js?v=20260803-login-gateway-v1"></script>
  <script src="course-portal-common.js?v=20260805-auth-route-cleanup-v1"></script>
  <script src="line-binding-admin.js?v=20260805-manager-auth-bridge-v3"></script>
</body>
</html>
