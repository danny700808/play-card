<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>柚子樂器系統｜登入</title>
  <link rel="stylesheet" href="style.css?v=20260730-login-compact-v2">
  <style>
    .auth-sub-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px;margin-top:6px}
    .auth-panel{margin-top:6px}
    .auth-panel.hidden{display:none}
    .auth-note{margin-top:8px;padding:10px 12px;border-radius:14px;background:#f3f7f4;color:#355f4a;font-size:14px;line-height:1.7}
    .auth-back-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    body.yz-login-page .auth-sub-actions .btn,body.yz-login-page .auth-sub-actions .btn-link{width:100%;min-height:38px!important;margin-top:0;padding:6px 3px!important;display:flex;align-items:center;justify-content:center;text-decoration:none;background:#fff!important;color:#17252f!important;border:1px solid #dbe4e9!important;border-radius:10px!important;font-size:12px!important;white-space:nowrap}
    .external-entry-zone{margin-top:16px;padding-top:14px;border-top:1px solid #dbe5dd;text-align:center}
    .external-entry-title{font-size:13px;font-weight:900;color:#6b7a6f;letter-spacing:.08em;margin-bottom:8px}
    .external-entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .external-entry-link{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;padding:8px 6px}
    .external-entry-link:last-child:nth-child(odd){grid-column:1/-1}
    .password-rule{margin-top:6px;font-size:13px;line-height:1.7;color:#6b7280}
    .login-choice-intro{text-align:center;margin:0 0 12px}.login-choice-intro strong{display:block;color:#17352c;font-size:18px}
    .login-method-list{display:grid;gap:9px}.login-method-card{display:block;min-width:0;border:1px solid #d7e4dd;border-radius:15px;padding:13px;background:#fff;color:#17352c;text-decoration:none}.login-method-line{border-color:#94cbb3;background:#edf9f3;box-shadow:0 0 0 2px rgba(36,115,92,.06)}.login-method-heading{display:flex;align-items:center;gap:10px}.login-method-icon{display:grid;place-items:center;flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:#24735c;color:#fff;font-size:12px;font-weight:950}.login-method-icon.email{background:#eef3f0;color:#315246}.login-method-copy{min-width:0;flex:1}.login-method-copy strong{display:block;font-size:17px}.login-method-copy small{display:block;margin-top:2px;color:#62756d;font-size:12px;line-height:1.5}.login-method-tag{align-self:flex-start;border-radius:999px;padding:4px 8px;background:#24735c;color:#fff;font-size:11px;font-weight:900}.line-login-cta{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:11px;border-radius:11px;background:#24735c;color:#fff;font-size:15px;font-weight:900}.login-scope-note{display:block;margin-top:8px;color:#49665b;font-size:11px;line-height:1.55}.auth-method-divider{display:flex;align-items:center;gap:10px;color:#7a8a82;font-size:12px;font-weight:850}.auth-method-divider:before,.auth-method-divider:after{content:"";height:1px;flex:1;background:#dbe5df}.login-method-email .field:first-of-type{margin-top:13px}.login-method-email .login-actions-stack{margin-top:2px}
  </style>
</head>
<body class="yz-login-page">
  <div class="container">
    <div class="card login-card">
      <div class="yz-login-brand">
        <div class="yz-login-mark">♫</div>
        <div class="header login-header">
          <h1 class="title center">柚子樂器系統</h1>
        </div>
      </div>

      <div id="msg" class="message"></div>

      <div id="loginPanel" class="auth-panel">
        <div class="login-choice-intro">
          <strong>選擇登入方式</strong>
        </div>
        <div class="login-method-list">
          <a class="login-method-card login-method-line" data-primary-login-method="line" href="course-portal.html">
            <div class="login-method-heading">
              <span class="login-method-icon">LINE</span>
              <span class="login-method-copy"><strong>LINE 登入</strong></span>
              <span class="login-method-tag">推薦</span>
            </div>
            <span class="line-login-cta">使用 LINE 繼續</span>
          </a>

          <div class="auth-method-divider"><span>或</span></div>

          <section class="login-method-card login-method-email" data-primary-login-method="email-password">
            <div class="login-method-heading">
              <span class="login-method-icon email">@</span>
              <span class="login-method-copy"><strong>管理者／員工登入</strong></span>
            </div>
            <div class="field">
              <label>Email</label>
              <input id="email" type="email" autocomplete="username" placeholder="請輸入 Email">
            </div>

            <div class="field">
              <label>密碼</label>
              <div class="password-wrap">
                <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼">
                <button type="button" class="eye" id="eyeBtn" aria-label="顯示或隱藏密碼">👁</button>
              </div>
            </div>

            <div class="remember-row">
              <label class="remember-label"><input id="rememberLogin" type="checkbox" checked> <span>記住帳號</span></label>
            </div>

            <div class="login-actions-stack">
              <button class="btn login-main-btn" id="loginBtn">登入</button>
              <div class="auth-sub-actions">
                <button class="btn secondary" id="forgotBtn" type="button">忘記密碼</button>
                <button class="btn secondary" id="resetBtn" type="button">重設密碼</button>
                <a href="register-type.html" class="btn btn-link">前往註冊</a>
              </div>
            </div>
          </section>
        </div>

        <div class="external-entry-zone">
          <div class="external-entry-title">其他服務入口</div>
          <div class="external-entry-grid">
            <a href="student-course-portal.html" class="btn secondary external-entry-link">學生／家長入口</a>
            <a href="room-booking.html" class="btn secondary external-entry-link">教室租用入口</a>
            <a href="teacher-course-portal.html" class="btn secondary external-entry-link">老師入口</a>
            <a href="teacher-apply.html" class="btn secondary external-entry-link">應聘履歷投遞</a>
            <a href="rental-order.html" class="btn secondary external-entry-link">設備租賃申請</a>
          </div>
        </div>
      </div>

      <div id="forgotPanel" class="auth-panel hidden">
        <div class="field">
          <label>Email</label>
          <input id="forgotEmail" type="email" placeholder="請輸入已註冊 Email">
        </div>
        <div class="auth-note">系統會重新產生一組暫時密碼並寄送到你的 Email，收到後可用該密碼重新登入。</div>
        <div class="login-actions-stack">
          <button class="btn login-main-btn" id="forgotSubmitBtn" type="button">寄送暫時密碼</button>
          <div class="auth-back-row">
            <button class="btn secondary" id="backToLoginFromForgot" type="button">返回登入</button>
          </div>
        </div>
      </div>

      <div id="resetPanel" class="auth-panel hidden">
        <div class="field">
          <label>Email</label>
          <input id="resetEmail" type="email" placeholder="請輸入已註冊 Email">
        </div>
        <div class="field">
          <label>原密碼</label>
          <div class="password-wrap">
            <input id="resetOldPassword" type="password" placeholder="請輸入目前密碼">
            <button type="button" class="eye" id="resetOldEyeBtn">👁</button>
          </div>
        </div>
        <div class="field">
          <label>新密碼</label>
          <div class="password-wrap">
            <input id="resetNewPassword" type="password" placeholder="請輸入新密碼">
            <button type="button" class="eye" id="resetNewEyeBtn">👁</button>
          </div>
          <div class="password-rule">密碼至少 8 碼，需包含英文大寫、英文小寫與數字。</div>
        </div>
        <div class="field">
          <label>確認新密碼</label>
          <div class="password-wrap">
            <input id="resetConfirmPassword" type="password" placeholder="請再次輸入新密碼">
            <button type="button" class="eye" id="resetConfirmEyeBtn">👁</button>
          </div>
        </div>
        <div class="login-actions-stack">
          <button class="btn login-main-btn" id="resetSubmitBtn" type="button">確認重設密碼</button>
          <div class="auth-back-row">
            <button class="btn secondary" id="backToLoginFromReset" type="button">返回登入</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js?v=20260502_btnprogress_final"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="firebase-client.js?v=20260802-security-phase1"></script>

  <script src="app.js?v=20260802-security-phase1"></script>
  <script>
    const msg = qs('#msg');
    const panels = {
      login: qs('#loginPanel'),
      forgot: qs('#forgotPanel'),
      reset: qs('#resetPanel')
    };
    const loginReturnPages = new Set([
      'profile.html',
      'contract.html',
      'announcements.html',
      'task.html',
      'teacher-goods.html',
      'forms-hub.html'
    ]);

    function requestedLoginTarget(){
      const value = String(new URLSearchParams(window.location.search).get('next') || '').trim().toLowerCase();
      return loginReturnPages.has(value) ? value : '';
    }

    function redirectToLoginTarget(target){
      try {
        if (window.top && window.top !== window) {
          window.top.location.replace(target);
          return;
        }
      } catch (e) {}
      window.location.replace(target);
    }

    applySavedLogin();

    if (typeof startActionButtonProgress !== 'function') {
      window.startActionButtonProgress = function(btn){
        if(btn) btn.disabled = true;
        return {
          done:function(){ if(btn) btn.disabled = false; },
          fail:function(){ if(btn) btn.disabled = false; }
        };
      };
    }


    function describeWindowError(event){
      if (!event) return '前端載入失敗';
      const target = event.target;
      if (target && target !== window) {
        const src = target.src || target.href || target.currentSrc || '';
        const tag = (target.tagName || 'RESOURCE').toUpperCase();
        return '前端資源載入失敗：' + tag + (src ? ('\n' + src) : '');
      }
      if (event && event.message) return '前端錯誤：' + event.message;
      return '前端載入失敗';
    }

    window.addEventListener('error', (event) => {
      setMsg(msg, describeWindowError(event), true);
    }, true);

    window.addEventListener('unhandledrejection', (event) => {
      const reason = event && event.reason;
      const text = (reason && (reason.message || String(reason))) || '前端 Promise 執行失敗';
      setMsg(msg, '前端錯誤：' + text, true);
    });

    (async function initLoginPage(){
      try {
        if (!getApiUrl()) {
          setMsg(msg, '尚未設定 API 網址，請先確認 config.js。', true);
          return;
        }
        await api('getPublicSystemLinks', {});
      } catch (e) {
        setMsg(msg, '系統連線失敗：' + (e && e.message ? e.message : '無法連到後端 API'), true);
      }
    })();
    ['#email','#password'].forEach(sel => {
      const el = qs(sel);
      if (el) el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') qs('#loginBtn').click();
      });
    });
    qs('#eyeBtn').onclick = () => togglePassword('#password', qs('#eyeBtn'));
    qs('#resetOldEyeBtn').onclick = () => togglePassword('#resetOldPassword', qs('#resetOldEyeBtn'));
    qs('#resetNewEyeBtn').onclick = () => togglePassword('#resetNewPassword', qs('#resetNewEyeBtn'));
    qs('#resetConfirmEyeBtn').onclick = () => togglePassword('#resetConfirmPassword', qs('#resetConfirmEyeBtn'));

    function fillSharedEmail(value){
      const v = (value || '').trim();
      if (!v) return;
      ['#email','#forgotEmail','#resetEmail'].forEach(sel => {
        const el = qs(sel);
        if (el) el.value = v;
      });
    }

    function setAuthMode(mode){
      Object.keys(panels).forEach(key => panels[key].classList.toggle('hidden', key !== mode));
      setMsg(msg, '');
      if (mode === 'forgot') {
        fillSharedEmail(qs('#email').value || qs('#resetEmail').value);
        qs('#forgotEmail').focus();
      } else if (mode === 'reset') {
        fillSharedEmail(qs('#email').value || qs('#forgotEmail').value);
        qs('#resetEmail').focus();
      } else {
        fillSharedEmail(qs('#forgotEmail').value || qs('#resetEmail').value || qs('#email').value);
        qs('#email').focus();
      }
    }

    qs('#loginBtn').onclick = async () => {
      const btn = qs('#loginBtn');
      if (btn.dataset.resumeTarget) {
        window.location.replace(btn.dataset.resumeTarget);
        return;
      }
      const progress = startActionButtonProgress(btn, { label:'登入中', startPct:20, maxPct:80, steps:[20,40,60,80], interval:180 });
      setMsg(msg, '');
      try {
        const r = await api('login', {
          email: qs('#email').value.trim(),
          password: qs('#password').value.trim()
        });
        setMsg(msg, r.message, !r.ok);
        if (r.ok) {
          saveLoginPref(qs('#email').value.trim(), qs('#password').value.trim(), qs('#rememberLogin').checked);
          setMsg(msg, '登入成功，正在進入系統...');
          progress.done('登入成功', 0, true);
          saveUser(r.user);
          const requestedTarget = requestedLoginTarget();
          const target = requestedTarget || loginDestination(r.user);
          btn.dataset.resumeTarget = target;
          if (requestedTarget) {
            redirectToLoginTarget(target);
          } else {
            redirectAfterLogin(r.user);
          }
          setTimeout(() => {
            if (document.visibilityState === 'hidden') return;
            progress.reset('進入系統');
            setMsg(msg, '登入已完成，請按「進入系統」。');
          }, 1400);
        } else {
          progress.fail('登入失敗');
        }
      } catch (e) {
        progress.fail('登入失敗');
        setMsg(msg, e.message || '登入失敗', true);
      }
    };

    qs('#forgotBtn').onclick = () => setAuthMode('forgot');
    qs('#resetBtn').onclick = () => setAuthMode('reset');
    qs('#backToLoginFromForgot').onclick = () => setAuthMode('login');
    qs('#backToLoginFromReset').onclick = () => setAuthMode('login');

    qs('#forgotSubmitBtn').onclick = async () => {
      const email = qs('#forgotEmail').value.trim();
      if (!email) {
        setMsg(msg, '請先輸入 Email。', true);
        qs('#forgotEmail').focus();
        return;
      }
      fillSharedEmail(email);
      const btn = qs('#forgotSubmitBtn');
      const progress = startActionButtonProgress(btn, { label:'寄送中' });
      try {
        const r = await api('forgotPassword', { email });
        setMsg(msg, r.message, !r.ok);
        if (r.ok) {
          progress.done('已寄出');
        } else {
          progress.fail('寄送失敗');
        }
      } catch (e) {
        progress.fail('寄送失敗');
        setMsg(msg, e.message || '寄送失敗', true);
      }
    };

    qs('#resetSubmitBtn').onclick = async () => {
      const email = qs('#resetEmail').value.trim();
      const oldPassword = qs('#resetOldPassword').value.trim();
      const newPassword = qs('#resetNewPassword').value.trim();
      const confirmPassword = qs('#resetConfirmPassword').value.trim();
      if (!email || !oldPassword || !newPassword || !confirmPassword) {
        setMsg(msg, '請完整填寫 Email、原密碼與兩次新密碼。', true);
        return;
      }
      fillSharedEmail(email);
      const btn = qs('#resetSubmitBtn');
      const progress = startActionButtonProgress(btn, { label:'更新中' });
      try {
        const r = await api('changePassword', { email, oldPassword, newPassword, confirmPassword });
        setMsg(msg, r.message, !r.ok);
        if (r.ok) {
          qs('#password').value = '';
          qs('#resetOldPassword').value = '';
          qs('#resetNewPassword').value = '';
          qs('#resetConfirmPassword').value = '';
          progress.done('更新完成');
        } else {
          progress.fail('更新失敗');
        }
      } catch (e) {
        progress.fail('更新失敗');
        setMsg(msg, e.message || '更新失敗', true);
      }
    };
  </script>
  <script src="ui-action-feedback.js?v=20260701safe3"></script>
</body>
</html>
