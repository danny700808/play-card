<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的證明</title><link rel="stylesheet" href="style.css?v=cert-history-20260602"><style>
body{background:#f5f7fb}.wrap{max-width:1400px;margin:0 auto;padding:18px}.page-card{background:#eff6ff;border:1px solid #bfdbfe;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.list{display:grid;gap:10px;margin-top:14px}.item{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px}.title{font-weight:950;color:#17324d}.meta{font-size:13px;color:#64748b;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions .btn{width:auto;padding:9px 12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filters .btn{width:auto}.muted-tip{font-size:13px;color:#64748b;line-height:1.8}@media(max-width:760px){.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style>  <link rel="stylesheet" href="global-nav.css?v=20260603unified1">

<body onload="initPage()" class="admin-wide-page">
  <div class="yz-global-nav" data-yz-global-nav>
    <button class="yz-nav-btn yz-nav-back" type="button" data-yz-nav-back>回到上一頁</button>
    <button class="yz-nav-btn yz-nav-logout" type="button" data-yz-nav-logout>登出</button>
  </div>
<main class="wrap" data-teacher-utility-root><section class="page-card"><h1>我的證明</h1><div class="filters"><a class="btn secondary" href="employment-certificate.html">申請在職證明</a><a class="btn secondary" href="teaching-certificate.html">申請教學證明</a><button class="btn secondary" onclick="loadRows()">重新讀取</button></div><div id="list" class="list" role="status"></div></section><section id="previewPanel" class="page-card" hidden><div class="actions"><button class="btn secondary" onclick="closeModal()">收合</button><button id="printCertificate" class="btn" onclick="printCurrent()">列印／另存 PDF</button><button id="downloadCertificate" class="btn secondary" onclick="downloadPdf()">下載加密 PDF</button></div><div id="modalPreview"></div></section></main>
<script src="config.js?v=20260919-taiwan-storage-v3"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-client.js?v=20260919-taiwan-v2"></script><script src="app.js?v=20260802-security-phase1"></script><script src="teacher-more-auth-bridge.js?v=20261024-session-stability-v1"></script><script src="certificate-self-service.js?v=20261031-2"></script><script src="certificate-workspace.js?v=20261031-1"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="certificate-common-a4reset.js?v=20260530-a4reset-3"></script><script>
let rows=[],currentApp=null;
async function loadRows(){const box=document.getElementById('list');box.textContent='讀取中…';closeModal();try{const r=await api('getCertificateApplications',{});if(!r||r.ok===false)throw new Error(r?.message||'讀取失敗');rows=(r.rows||[]).map(YZ_CERT.normalizeApplication);box.replaceChildren();if(!rows.length){box.textContent='尚無證明申請';return;}for(const row of rows){const item=document.createElement('div');item.className='item';const text=document.createElement('div');text.textContent=row.certificateTypeLabel+' · '+row.status+' · '+(row.submittedAtText||'')+(row.rejectReason?' · '+row.rejectReason:'');const button=document.createElement('button');button.className='btn secondary';button.textContent='查看';button.onclick=()=>viewRow(row.requestId);item.append(text,button);box.append(item);}}catch(error){box.textContent='讀取失敗：'+error.message;}}
function documentHtml(app){return YZ_CERT.certificateHtml({type:app.certificateType,template:app.templateSnapshot||YZ_CERT.defaultTemplate(app.certificateType),data:YZ_CERT.applicationToDocumentData(app),status:app.status,reviewedAt:app.reviewedAt,reviewerName:app.reviewerName});}
function viewRow(id){currentApp=rows.find(row=>row.requestId===id);if(!currentApp)return;document.getElementById('modalPreview').innerHTML=documentHtml(currentApp);document.getElementById('printCertificate').hidden=currentApp.status!=='已核准';document.getElementById('downloadCertificate').hidden=currentApp.status!=='已核准';document.getElementById('previewPanel').hidden=false;}
function closeModal(){currentApp=null;document.getElementById('previewPanel').hidden=true;}
function printCurrent(){if(currentApp?.status==='已核准')YZ_CERT.printHtml(documentHtml(currentApp));}
async function downloadPdf(){if(currentApp?.status!=='已核准')return;try{await YZ_CERT.downloadEncryptedPdfFromElement(document.querySelector('#modalPreview .cert-doc'),currentApp.certificateTypeLabel+'.pdf',currentApp.idNumber);}catch(error){alert(error.message);}}
async function initPage(){if(window.YZTeacherMoreAuth?.blockIfPortalOnly({title:'我的證明'}))return;if(!requireLogin())return;YZ_CERT.injectCertificateStyles();await loadRows();}
</script>  <script src="global-nav.js?v=20260603unified1"></script>
