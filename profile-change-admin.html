<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>簽核｜個資修改</title>
  <link rel="stylesheet" href="style.css?v=admin-final-20260530b">
  <link rel="stylesheet" href="approval-common.css?v=20260626approval1">
  <link rel="stylesheet" href="global-nav.css?v=20260603unified1">
  <style>.container{width:min(96vw,1200px);margin:0 auto;padding:16px}.msg{margin-top:12px}.success{padding:12px 14px;border-radius:14px;background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;font-weight:900}.error{padding:12px 14px;border-radius:14px;background:#fff1f2;border:1px solid #fecaca;color:#991b1b;font-weight:900}.notice{padding:12px 14px;border-radius:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-weight:900}.change-list{display:grid;gap:8px;margin-top:12px}.change-row{border:1px solid #d8e4dd;border-radius:13px;padding:10px 12px;background:#f8fbf9}.change-label{display:flex;align-items:center;gap:7px;font-weight:900;color:#254f40}.change-values{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:5px}.change-before{color:#7a8580;text-decoration:line-through;overflow-wrap:anywhere}.change-after{font-weight:800;color:#143e30;overflow-wrap:anywhere}.change-arrow{color:#789086}.immediate-chip{display:inline-flex;border-radius:999px;padding:2px 7px;background:#e0f4e9;color:#17634a;font-size:11px}.subject-note{margin-top:10px;padding:9px 11px;border-radius:11px;background:#eef8f3;color:#17634a;font-weight:800;font-size:13px}.approval-meta{overflow-wrap:anywhere}@media(max-width:600px){.container{width:100%;padding:8px}.change-values{grid-template-columns:1fr}.change-arrow{display:none}.change-before::before{content:"原：";text-decoration:none}.change-after::before{content:"改："}}</style>
</head>
<body onload="init()" class="admin-wide-page">
  <div class="yz-global-nav" data-yz-global-nav>
    <button class="yz-nav-btn yz-nav-back" type="button" data-yz-nav-back>回到上一頁</button>
    <button class="yz-nav-btn yz-nav-logout" type="button" data-yz-nav-logout>登出</button>
  </div>

  <div class="container">
    <div class="card">
      <h1 class="title" style="margin:0">簽核｜個資修改</h1>
      <div class="approval-toolbar">
        <label for="keyword">搜尋<input id="keyword" placeholder="姓名 / Email / 電話 / 地址"></label>
        <button class="btn secondary" type="button" id="refreshBtn" style="width:auto;padding:11px 16px">重新整理</button>
      </div>
      <div class="approval-tabs">
        <button class="approval-tab active" type="button" id="pendingTab">未處理（0）</button>
        <button class="approval-tab" type="button" id="historyTab">歷史紀錄</button>
      </div>
      <div id="msg" class="msg"></div>
      <div id="requestList" class="approval-list"></div>
    </div>
  </div>

  <script src="config.js?v=20260529notifybadge1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="firebase-client.js?v=20260802-security-phase1"></script>
  <script src="app.js?v=20260802-security-phase1"></script>
  <script>
    let rows=[];let activeTab='pending';let currentUser=null;let managerAuthReady=null;
    function $(id){return document.getElementById(id)}
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function clean(v){return String(v==null?'':v).trim()}
    function lower(v){return clean(v).toLowerCase()}
    function setMsg(t,type){$('msg').innerHTML=t?`<div class="${type||'success'}">${esc(t)}</div>`:''}
    function ensureFirebaseApp(){if(firebase.apps&&firebase.apps.length)return firebase.apps[0];return firebase.initializeApp(window.APP_CONFIG.FIREBASE_CONFIG)}
    async function waitForManagerAuth(){ensureFirebaseApp();if(managerAuthReady)return managerAuthReady;managerAuthReady=new Promise((resolve,reject)=>{const auth=firebase.auth();let settled=false,unsubscribe=null,timer=null;const finish=(user,error)=>{if(settled)return;settled=true;if(timer)clearTimeout(timer);try{if(unsubscribe)unsubscribe()}catch(e){}if(error||!user){reject(error||new Error('管理者安全登入已失效，需要重新登入。'));return}resolve(user)};unsubscribe=auth.onAuthStateChanged(user=>finish(user,null),error=>finish(null,error));timer=setTimeout(()=>finish(auth.currentUser,null),8000)}).then(async user=>{const token=await user.getIdTokenResult(true);const claims=token&&token.claims||{};const role=lower(claims.role||claims.userRole||claims.permissionRole);const email=lower(claims.email||user.email);const allowed=claims.admin===true||claims.manager===true||claims.owner===true||['admin','manager','owner','主管','管理者'].includes(role)||email==='danny700808@gmail.com';const localEmail=lower(currentUser&&currentUser.email);if(!allowed||(localEmail&&email&&localEmail!==email))throw new Error('目前的安全登入與管理者身分不一致，請重新登入。');return user});return managerAuthReady}
    async function managerCall(name,data){const user=await waitForManagerAuth();await user.getIdToken(true);const result=await firebase.app().functions('us-central1').httpsCallable(name)(data||{});return result&&result.data||{}}
    function errorText(error){return clean(error&&(error.details||error.message)||error||'目前無法處理。').replace(/^FirebaseError:\s*/i,'')}
    function isPending(row){if(row&&row.pending===true)return true;return ['待審核','pending','pending_review','未處理'].includes(lower(row&&row.status||'待審核'))}
    function pill(status){const s=clean(status||'待審核');const cls=s==='已核准'?'approved':(s==='已駁回'?'rejected':(s==='待審核'?'pending':'history'));return `<span class="approval-pill ${cls}">${esc(s)}</span>`}
    function field(label,value){return clean(value)?`<div class="approval-field"><div class="approval-label">${esc(label)}</div><div class="approval-value">${esc(value)}</div></div>`:''}
    function renderTabs(){const p=rows.filter(isPending).length,h=rows.filter(r=>!isPending(r)).length;$('pendingTab').textContent=`未處理（${p}）`;$('historyTab').textContent=h?`歷史紀錄（${h}）`:'歷史紀錄'}
    function setTab(tab){activeTab=tab==='history'?'history':'pending';$('pendingTab').classList.toggle('active',activeTab==='pending');$('historyTab').classList.toggle('active',activeTab==='history');render()}
    async function init(){fillHeader();currentUser=requireLogin();if(!currentUser)return;if(!hasSettingsZoneAccess(currentUser)){location.href='dashboard.html';return}setPortalMode('settings');$('keyword').addEventListener('input',render);$('refreshBtn').onclick=loadRequests;$('pendingTab').onclick=()=>setTab('pending');$('historyTab').onclick=()=>setTab('history');try{await waitForManagerAuth();await loadRequests()}catch(error){setMsg(errorText(error),'error')}}
    async function loadRequests(){try{setMsg('讀取中...','notice');const r=await managerCall('personDataAdminProfileChangeInventory',{});rows=Array.isArray(r&&r.rows)?r.rows:[];render();setMsg('')}catch(e){setMsg('讀取失敗：'+errorText(e),'error')}}
    function changesHtml(row){const changes=Array.isArray(row&&row.changes)?row.changes:[];if(!changes.length)return '<div class="approval-empty">沒有可顯示的異動欄位</div>';return `<div class="change-list">${changes.map(change=>`<div class="change-row"><div class="change-label">${esc(change.label||'資料欄位')}${change.immediate?'<span class="immediate-chip">已立即同步</span>':''}</div><div class="change-values"><span class="change-before">${esc(change.before||'未填寫')}</span><span class="change-arrow">→</span><span class="change-after">${esc(change.after||'已刪除')}</span></div></div>`).join('')}</div>${row.subjectChangesAlreadyEffective?'<div class="subject-note">授課科目與程度由老師自行認定，已立即同步；主管在此查閱紀錄，不需逐科核准。</div>':''}`}
    function render(){
      renderTabs();
      const kw=lower($('keyword').value);
      const list=rows.filter(r=>activeTab==='pending'?isPending(r):!isPending(r)).filter(r=>{const text=[r.name,r.employeeId,r.teacherId,r.status,JSON.stringify(r.changes||[])].join(' ').toLowerCase();return !kw||text.includes(kw)});
      $('requestList').innerHTML=list.length?list.map(r=>{
        const can=isPending(r);
        return `<article class="approval-card"><div class="approval-head"><div><div class="approval-name">${esc(r.name||'未命名人員')}</div><div class="approval-meta">人員 ${esc(r.employeeId||'—')}${r.teacherId?`｜老師 ${esc(r.teacherId)}`:''}${r.createdAt?`｜${esc(r.createdAt)}`:''}</div></div>${pill(r.status)}</div>${changesHtml(r)}${r.rejectReason?`<div class="approval-note">退回原因：${esc(r.rejectReason)}</div>`:''}${r.reviewedBy?`<div class="approval-note">處理人：${esc(r.reviewedBy)}${r.reviewedAt?`｜${esc(r.reviewedAt)}`:''}</div>`:''}${can?`<div class="approval-actions"><button class="btn" type="button" onclick="approveReq('${esc(r.requestId)}')">核准正式資料</button><button class="btn secondary" type="button" onclick="rejectReq('${esc(r.requestId)}')">退回修改</button></div>`:''}</article>`;
      }).join(''):'<div class="approval-empty">目前沒有資料</div>';
    }
    async function approveReq(id){if(!confirm('確定核准並更新老師／員工的正式基本資料嗎？授課科目已由老師自行勾選並即時同步。'))return;try{const r=await managerCall('personDataAdminProfileChangeAction',{requestId:id,action:'approve'});setMsg(r.message||'已核准。');await loadRequests()}catch(e){setMsg(errorText(e),'error')}}
    async function rejectReq(id){const reason=prompt('請輸入需要老師修改的內容：','請確認並修正基本資料');if(reason===null)return;if(!clean(reason)){setMsg('請填寫退回原因。','error');return}try{const r=await managerCall('personDataAdminProfileChangeAction',{requestId:id,action:'reject',reason});setMsg(r.message||'已退回。');await loadRequests()}catch(e){setMsg(errorText(e),'error')}}
  </script>
  <script src="global-nav.js?v=20260603unified1"></script>
  <script src="ui-action-feedback.js?v=20260701safe3"></script>
</body>
</html>
