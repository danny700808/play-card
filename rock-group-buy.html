<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>熱音社團購</title><link rel="stylesheet" href="group-buy.css?v=20261002-aligned"><link rel="stylesheet" href="rock-group-buy.css?v=20261010-bass"></head><body><main><div class="hero"><h1 id="title">熱音社團購</h1></div><section class="panel" aria-labelledby="club-notes"><h2 id="club-notes">參加熱音社須知</h2><ol style="padding-left:1.4em;margin-bottom:0"><li>熱音社以培養興趣與音樂能力為主，透過一起練習，學習合作與交流。</li><li>上課需自備吉他。家中已有樂器可以繼續使用，不必另外購買；若不確定是否適合上課，可先確認樂器狀況。</li><li>學吉他需要持續練習，購買前先想想自己的學習意願與預算。</li><li>沒有吉他的同學，可以依需要參加下方團購；已有吉他者不必重複購買。</li><li>購買前請先與家長討論並取得同意，即使使用自己的零用錢，也請先告知家長。</li><li>填寫時請確認學校、班級、姓名、吉他及音箱款式，再送出登記。</li></ol></section><div id="app"><div class="loading">正在載入團購資料…</div></div></main><div id="message" role="status" aria-live="polite"></div><script src="rock-group-buy-consent.js?v=20261010-bass"></script><script src="rock-group-buy.js?v=20261010-bass"></script></body></html>
