<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>教室租用｜柚子樂器</title>
  <link rel="stylesheet" href="course-portal.css?v=20260727-v4">
</head>
<body>
  <main class="portal-shell">
    <header class="portal-head">
      <div class="head-title"><span class="brand-mark">租</span><div><h1>教室租用</h1><p>查看空堂・直接預約</p></div></div>
      <button class="btn danger hidden" id="logoutBtn" type="button">登出</button>
    </header>

    <section class="card bind-box role-question" id="entryView">
      <h2>您是柚子樂器的學生嗎？</h2>
      <div class="role-buttons">
        <button class="btn primary" type="button" id="studentEntry">是，我是柚子學生</button>
        <button class="btn soft" type="button" id="publicEntry">不是，我是一般租用者</button>
      </div>
    </section>

    <section class="card bind-box hidden" id="publicBindView">
      <div class="section-title"><h2>一般租用者</h2><button class="btn" type="button" data-back>返回</button></div>
      <form class="stack" id="publicBindForm">
        <div class="field"><label>姓名</label><input name="name" required></div>
        <div class="field"><label>電話</label><input name="phone" inputmode="tel" required></div>
        <button class="btn primary" type="submit">LINE 綁定</button>
      </form>
      <div class="bind-result hidden" data-bind-result></div>
    </section>

    <section class="hidden" id="bookingView">
      <div class="toolbar">
        <span class="badge" id="rateLabel">一般價格</span>
        <span class="badge">現場付款</span>
        <button class="btn soft" id="changeRoleBtn" type="button">切換身分</button>
      </div>

      <section class="card">
        <div class="section-title"><div><h2>想使用空間做什麼？</h2><p class="muted">用途只用來排序，不會把其他仍可使用的教室藏起來。</p></div></div>
        <div class="rental-use-grid" id="rentalUseGrid">
          <button class="rental-use active" type="button" data-use="guitar">彈吉他／自備樂器</button>
          <button class="rental-use" type="button" data-use="piano">彈鋼琴</button>
          <button class="rental-use" type="button" data-use="drums">打鼓</button>
          <button class="rental-use" type="button" data-use="band">樂團／多人排練</button>
          <button class="rental-use" type="button" data-use="teaching">教學／會議</button>
          <button class="rental-use" type="button" data-use="other">其他用途</button>
        </div>
        <div class="grid two rental-quick-fields">
          <div class="field"><label>人數</label><select id="partySize"><option value="1">1人</option><option value="2">2人</option><option value="4">3～5人</option><option value="6">6人以上</option></select></div>
          <div class="field"><label>需要設備</label><select id="equipmentSelect"><option value="own">自備樂器／不指定</option><option value="piano">需要鋼琴</option><option value="acoustic_drums">需要傳統鼓</option><option value="electronic_drums">需要電子鼓</option></select></div>
        </div>
        <div class="section-title rental-week-title"><div><h2>一週可租時間</h2><p class="muted">先看整週哪一天有空，再點日期看詳細時間。</p></div><div><button class="btn" id="prevRentalWeek" type="button">上一週</button> <button class="btn soft" id="nextRentalWeek" type="button">下一週</button></div></div>
        <div class="date-strip" id="dateStrip"></div>
        <div class="rental-board" id="rentalBoard"><p class="muted">正在讀取空堂…</p></div>

        <div class="rental-choice-panel hidden" id="choicePanel">
          <div class="section-title"><div><h3 id="selectedTime">選擇教室</h3><p class="muted">費用依租用時間計算。</p></div></div>
          <div class="grid two">
            <div class="field"><label>租用時間</label><select id="durationSelect"><option value="30">30分鐘</option><option value="60" selected>1小時</option><option value="90">1.5小時</option><option value="120">2小時</option></select></div>
            <div class="field"><label>用途</label><input id="purposeInput" placeholder="例如：鋼琴練習"></div>
          </div>
          <div class="list" id="roomList" style="margin-top:14px"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="course-portal-common.js?v=20260726-v2"></script>
  <script>
  (function () {
    const P = window.CoursePortal;
    let role = '';
    let token = '';
    let selectedDate = todayKey();
    let weekStart = todayKey();
    let selectedUseType = 'guitar';
    let selectedStart = '';
    let boardData = null;
    let roomData = null;
    const entryView = document.getElementById('entryView');
    const bindView = document.getElementById('publicBindView');
    const bookingView = document.getElementById('bookingView');

    function todayKey() {
      const date = new Date();
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function show(view) {
      [entryView, bindView, bookingView].forEach((node) => node.classList.toggle('hidden', node !== view));
      document.getElementById('logoutBtn').classList.toggle('hidden', view !== bookingView);
    }

    function studentToken() { return P.getSession('student'); }
    function teacherToken() { return P.getSession('teacher'); }

    function dayLabel(key) {
      const date = new Date(`${key}T12:00:00`);
      return {
        weekday: `週${'日一二三四五六'[date.getDay()]}`,
        date: `${date.getMonth() + 1}/${date.getDate()}`
      };
    }

    function renderDateStrip() {
      const days = boardData && boardData.days || [];
      document.getElementById('dateStrip').innerHTML = days.map((day) => {
        const label = dayLabel(day.date);
        return `<button class="btn date-chip ${day.date === selectedDate ? 'active' : ''}" type="button" data-date="${day.date}"><strong>${label.weekday}</strong><small>${label.date}</small><em>${day.closed ? '公休' : `${day.availableSlotCount}個空段`}</em></button>`;
      }).join('');
    }

    function renderBoard() {
      const node = document.getElementById('rentalBoard');
      const day = (boardData.days || []).find((row) => row.date === selectedDate) || boardData.days[0];
      if (!day) return;
      if (day.closed) {
        node.innerHTML = '<div class="notice">星期二公休，請選擇其他日期。</div>';
        return;
      }
      node.innerHTML = day.slots.map((slot) => {
        const available = slot.availableCount > 0;
        const rooms = slot.rooms.map((room) => room.name).join('、');
        return `
          <button class="rental-slot ${available ? '' : 'unavailable'} ${slot.startTime === selectedStart ? 'selected' : ''}" type="button" ${available ? `data-slot="${slot.startTime}"` : 'disabled'}>
            <span class="rental-slot-time">${slot.startTime}</span>
            <span class="rental-slot-count">${available ? `${slot.availableCount}間可租` : '已滿'}</span>
            <span class="rental-slot-rooms">${P.escapeHtml(rooms || '沒有空教室')}</span>
          </button>`;
      }).join('');
    }

    async function loadBoard() {
      document.getElementById('choicePanel').classList.add('hidden');
      selectedStart = '';
      document.getElementById('rentalBoard').innerHTML = '<p class="muted">正在讀取空堂…</p>';
      try {
        boardData = await P.call('coursePortalRentalWeekBoard', {
          sessionToken: token,
          startDate: weekStart,
          useType: selectedUseType,
          equipment: document.getElementById('equipmentSelect').value,
          partySize: document.getElementById('partySize').value
        });
        if (!(boardData.days || []).some((day) => day.date === selectedDate)) selectedDate = boardData.days[0].date;
        renderDateStrip();
        renderBoard();
      } catch (error) {
        document.getElementById('rentalBoard').innerHTML = '<p class="muted">讀取失敗。</p>';
        P.toast(error.message, 'error');
      }
    }

    async function loadRooms() {
      if (!selectedStart) return;
      const list = document.getElementById('roomList');
      list.innerHTML = '<p class="muted">正在確認完整租用時間…</p>';
      try {
        roomData = await P.call('coursePortalRentalAvailability', {
          sessionToken: token,
          date: selectedDate,
          startTime: selectedStart,
          durationMinutes: document.getElementById('durationSelect').value,
          useType: selectedUseType,
          equipment: document.getElementById('equipmentSelect').value,
          partySize: document.getElementById('partySize').value
        });
        const available = roomData.rooms.filter((room) => room.available);
        const renderRooms = (rows, label) => rows.length ? `<h4 class="rental-match-heading">${label}</h4>` + rows.map((room) => `
          <article class="list-row">
            <strong>${P.escapeHtml(room.name)}</strong>
            <span>${P.escapeHtml(room.priceType)}・最多${room.capacity}人</span>
            <strong>${P.money(room.price)}</strong>
            <span class="badge">可預約</span>
            <button class="btn primary" type="button" data-book-room="${P.escapeHtml(room.id)}">預約</button>
          </article>`).join('') : '';
        list.innerHTML = renderRooms(available.filter((room) => room.matchLevel === 'best'), '最適合') + renderRooms(available.filter((room) => room.matchLevel !== 'best'), '也可以使用') || '<div class="notice">這段完整時間沒有可用教室，請縮短時間或選擇其他時段。</div>';
      } catch (error) {
        list.innerHTML = '<p class="muted">讀取失敗。</p>';
        P.toast(error.message, 'error');
      }
    }

    async function openBooking(nextRole, nextToken) {
      role = nextRole;
      token = nextToken;
      document.getElementById('rateLabel').textContent = role === 'student' ? '柚子學生價' : (role === 'teacher' ? '老師租用' : '一般價格');
      show(bookingView);
      renderDateStrip();
      await loadBoard();
    }

    document.getElementById('studentEntry').addEventListener('click', () => {
      const saved = studentToken();
      if (saved) openBooking('student', saved);
      else location.href = 'student-course-portal.html?return=room-booking.html';
    });
    document.getElementById('publicEntry').addEventListener('click', () => show(bindView));
    document.querySelector('[data-back]').addEventListener('click', () => show(entryView));
    document.getElementById('publicBindForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = event.submitter;
      P.loading(button, true, '處理中…');
      try { await P.startBinding('renter', event.currentTarget); } catch (error) { P.toast(error.message, 'error'); }
      finally { P.loading(button, false); }
    });
    document.getElementById('dateStrip').addEventListener('click', (event) => {
      const button = event.target.closest('[data-date]');
      if (!button) return;
      selectedDate = button.dataset.date;
      selectedStart = '';
      document.getElementById('choicePanel').classList.add('hidden');
      renderDateStrip();
      renderBoard();
    });
    document.getElementById('rentalUseGrid').addEventListener('click', (event) => {
      const button = event.target.closest('[data-use]');
      if (!button) return;
      selectedUseType = button.dataset.use;
      document.querySelectorAll('[data-use]').forEach((node) => node.classList.toggle('active', node === button));
      loadBoard();
    });
    document.getElementById('partySize').addEventListener('change', loadBoard);
    document.getElementById('equipmentSelect').addEventListener('change', loadBoard);
    document.getElementById('prevRentalWeek').addEventListener('click', () => { weekStart = P.addDays(weekStart, -7); selectedDate = weekStart; loadBoard(); });
    document.getElementById('nextRentalWeek').addEventListener('click', () => { weekStart = P.addDays(weekStart, 7); selectedDate = weekStart; loadBoard(); });
    document.getElementById('rentalBoard').addEventListener('click', (event) => {
      const button = event.target.closest('[data-slot]');
      if (!button) return;
      selectedStart = button.dataset.slot;
      renderBoard();
      document.getElementById('selectedTime').textContent = `${selectedDate}　${selectedStart}`;
      document.getElementById('choicePanel').classList.remove('hidden');
      loadRooms();
      document.getElementById('choicePanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('durationSelect').addEventListener('change', loadRooms);
    document.getElementById('roomList').addEventListener('click', async (event) => {
      const button = event.target.closest('[data-book-room]');
      if (!button || !roomData) return;
      P.loading(button, true, '預約中…');
      try {
        const result = await P.call('coursePortalCreateRoomBooking', {
          sessionToken: token,
          roomId: button.dataset.bookRoom,
          date: selectedDate,
          startTime: selectedStart,
          durationMinutes: document.getElementById('durationSelect').value,
          useType: selectedUseType,
          equipment: document.getElementById('equipmentSelect').value,
          partySize: document.getElementById('partySize').value,
          purpose: document.getElementById('purposeInput').value
        });
        P.toast(`預約完成，現場付款 ${P.money(result.booking.amount)}。`);
        document.getElementById('roomList').innerHTML = `<div class="notice"><strong>預約完成</strong><br>${P.escapeHtml(result.booking.date)}　${P.escapeHtml(result.booking.startTime)}～${P.escapeHtml(result.booking.endTime)}<br>現場付款 ${P.money(result.booking.amount)}</div>`;
        await loadBoard();
      } catch (error) { P.toast(error.message, 'error'); }
      finally { P.loading(button, false); }
    });
    document.getElementById('changeRoleBtn').addEventListener('click', () => show(entryView));
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (role === 'renter') P.setSession('renter', '');
      show(entryView);
    });

    (async () => {
      try {
        const params = new URLSearchParams(location.search);
        if (params.get('access')) {
          token = await P.exchangeAccess('renter');
          await openBooking('renter', token);
        } else if (params.get('from') === 'student' && studentToken()) {
          await openBooking('student', studentToken());
        } else if (params.get('from') === 'teacher' && teacherToken()) {
          await openBooking('teacher', teacherToken());
        } else if (P.getSession('renter')) {
          await openBooking('renter', P.getSession('renter'));
        } else {
          show(entryView);
        }
      } catch (error) { P.toast(error.message, 'error'); show(entryView); }
    })();
  })();
  </script>
</body>
</html>
