<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>教室租用｜柚子樂器</title>
  <link rel="stylesheet" href="course-portal.css?v=20260731-final-rules-v1">
  <link rel="stylesheet" href="room-booking-v2.css?v=20260802-rental-identity-v1">
</head>
<body class="rental-booking-v2 clean-portal-ui">
  <main class="portal-shell">
    <header class="portal-head">
      <div class="head-title"><span class="brand-mark">租</span><div><h1 id="rentalHeaderTitle">教室租用</h1></div></div>
      <button class="btn danger hidden" id="logoutBtn" type="button">登出</button>
    </header>

    <section class="card bind-box rental-login-card hidden" id="publicBindView" data-auth-view>
      <div class="section-title auth-title">
        <div><h2>教室租用登入</h2></div>
      </div>
      <div class="auth-choice-list" data-auth-choice-list>
        <article class="auth-choice auth-choice-line">
          <div class="auth-choice-heading">
            <span class="auth-choice-icon">LINE</span>
            <div><h3>LINE 註冊／登入</h3></div>
            <span class="auth-recommended">推薦</span>
          </div>
          <button class="btn primary auth-line-button" type="button" data-line-login>使用 LINE 註冊／登入</button>
        </article>
        <div class="auth-divider"><span>或</span></div>
        <article class="auth-choice auth-choice-regular">
          <div class="auth-choice-heading">
            <span class="auth-choice-icon auth-choice-icon-plain">一般</span>
            <div><h3>一般註冊／登入</h3></div>
          </div>
          <form class="stack auth-regular-form" data-regular-auth-form>
            <div class="field"><label>姓名</label><input name="name" autocomplete="name" placeholder="請輸入姓名" required></div>
            <div class="field"><label>手機號碼</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="例如 0912345678" required></div>
            <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" placeholder="請輸入 Email" required></div>
            <button class="btn auth-regular-submit" type="submit">寄送四碼驗證碼</button>
          </form>
        </article>
      </div>
      <section class="auth-line-setup hidden" data-line-setup-panel>
        <div class="section-title"><div><h3>完成 LINE 第一次登入</h3></div></div>
        <form class="stack" data-line-setup-form>
          <div class="field"><label>姓名</label><input name="name" autocomplete="name" required></div>
          <div class="field"><label>手機號碼</label><input name="phone" inputmode="tel" autocomplete="tel" required></div>
          <div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" placeholder="請輸入 Email" required></div>
          <button class="btn primary" type="submit">寄送四碼驗證碼</button>
        </form>
      </section>
      <div class="auth-otp-panel hidden" data-otp-panel></div>
    </section>

    <section class="card portal-session-card" id="sessionLoading" aria-live="polite">
      <span class="portal-session-spinner" aria-hidden="true"></span>
      <div><strong>正在確認登入</strong><p>確認這台裝置的登入狀態。</p></div>
    </section>

    <section class="hidden" id="bookingView" data-app-view>
      <section class="card rental-step">
        <h2 class="rental-step-title"><b>1</b>用途</h2>
        <div class="rental-use-grid" id="rentalUseGrid"><div class="rental-empty">正在載入用途…</div></div>
        <div class="rental-preference hidden" id="rentalPreference"></div>
      </section>

      <section class="card rental-step">
        <h2 class="rental-step-title"><b>2</b>租用時間</h2>
        <div class="duration-grid" id="durationGrid"></div>
      </section>

      <section class="card rental-step">
        <div class="section-title"><h2 class="rental-step-title"><b>3</b>日期</h2><div><button class="btn" id="prevRentalWeek" type="button">上一週</button> <button class="btn soft" id="nextRentalWeek" type="button">下一週</button></div></div>
        <div class="date-strip" id="dateStrip"></div>
      </section>

      <section class="card rental-step">
        <h2 class="rental-step-title"><b>4</b>開始時間</h2>
        <div class="rental-board" id="rentalBoard"><div class="rental-empty">正在檢查可用時段…</div></div>
      </section>

      <section class="card rental-step hidden" id="roomStep">
        <h2 class="rental-step-title"><b>5</b>教室</h2>
        <div class="rental-room-grid" id="roomGrid"></div>
      </section>

      <section class="card">
        <div class="section-title"><h2>我的預約</h2><button class="btn soft" id="reloadBookings" type="button">重新整理</button></div>
        <div class="list" id="myBookingList"><div class="rental-empty">讀取中…</div></div>
      </section>
    </section>
  </main>

  <div class="rental-confirm-backdrop hidden" id="rentalConfirmBackdrop">
    <section class="rental-confirm-sheet" role="dialog" aria-modal="true">
      <div class="section-title"><h2>確認預約</h2><button class="btn" id="closeRentalConfirm" type="button">關閉</button></div>
      <div class="rental-confirm-summary">
        <div><span>租用人</span><strong id="confirmRenter"></strong></div>
        <div><span>用途</span><strong id="confirmUse"></strong></div>
        <div><span>日期</span><strong id="confirmDate"></strong></div>
        <div><span>時間</span><strong id="confirmTime"></strong></div>
        <div><span>教室</span><strong id="confirmRoom"></strong></div>
      </div>
      <div class="field hidden" id="bookingStudentField" style="margin-top:10px">
        <label for="bookingStudent">本次使用教室的學生</label>
        <select id="bookingStudent"></select>
      </div>
      <div class="rental-recording-choice hidden" id="recordingUsageChoice">
        <strong>錄音室使用方式（必選）</strong>
        <div class="rental-recording-options">
          <label><input type="radio" name="recordingUsage" value="general_room">一般教室使用 <b>NT$100/小時</b></label>
          <label><input type="radio" name="recordingUsage" value="studio_recording">錄音室錄音使用 <b>NT$300/小時</b></label>
        </div>
      </div>
      <div class="rental-rate-section" id="rentalRateSection">
        <strong id="rentalRateHeading">租用價格</strong>
        <div class="rental-rate-choice">
          <label id="generalRateLabel"><input type="radio" name="rentalRate" value="general" checked><span id="generalRateText">一般租用</span></label>
          <label id="studentRateLabel"><input type="radio" name="rentalRate" value="student">柚子學生半價</label>
        </div>
      </div>
      <div class="field" style="margin-top:10px"><label>備註（選填）</label><input id="bookingNote"></div>
      <div class="rental-final-price" id="confirmPrice"></div>
      <button class="btn primary" id="confirmBookingBtn" type="button" style="width:100%">確認預約・現場付款</button>
    </section>
  </div>

  <script src="config.js?v=20260803-rental-session-bridge-v1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="course-portal-common.js?v=20260802-timeout-phase1"></script>
  <script src="room-booking-v2.js?v=20260802-rental-identity-v1"></script>
</body>
</html>
