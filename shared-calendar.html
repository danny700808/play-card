<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>共用工作行事曆｜柚子樂器</title><link rel="stylesheet" href="shared-calendar.css?v=20260925-3"></head><body>
<section id="gate" class="gate"><h1>共用工作行事曆</h1><p id="gateMessage" role="status"></p>
<form id="loginForm"><label id="memberLabel">成員入口編號<input id="memberId" autocomplete="username" required></label><label id="passwordLabel">我的密碼<input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"></label><button id="loginButton" class="primary">密碼登入</button></form><button id="faceButton">使用 Face ID／通行密鑰</button><p id="inviteNote" hidden>設定至少 6 個字元的密碼即可加入。</p><a id="ownerLogin" href="private-calendar.html?shared=1">我是管理者，從私人入口登入</a><p id="gateHelp" class="small">忘記密碼或尚未收到邀請？請管理者到「成員管理」重新發送邀請。</p></section>
<main id="workspace" hidden><header class="calendarIntro"><div><h1>共用工作行事曆</h1><h2 id="monthTitle"></h2></div><button id="newTask" class="primary">＋ 新增交辦</button></header>
<div id="status" class="notice" role="status" hidden></div><div id="lineWarning" class="notice warning" hidden></div>
<nav class="viewbar"><button id="monthView" aria-pressed="true">小月曆</button><button id="listView" aria-pressed="false">本月接下來</button><button id="refresh">同步更新</button><button id="settingsButton">設定</button></nav>
<nav class="datebar"><button id="previous">‹ 上個月</button><button id="today">今天</button><button id="next">下個月 ›</button></nav>
<section id="monthPanel" class="monthPanel"><div class="calendarCard"><h3 id="miniMonthTitle"></h3><div id="calendar" aria-label="共用工作小月曆"></div></div><section class="dayCard"><div class="dayHeading"><h2 id="dayTitle"></h2><button id="newDay">＋ 新增這天的事情</button></div><div id="dayTasks"></div></section></section><section id="taskList" hidden></section>
</main>
<dialog id="settings"><div class="dialogHead"><h2>我的設定</h2><button data-close="settings" aria-label="關閉">×</button></div><p id="settingsMessage" role="status"></p><section id="myLine" hidden><h3>LINE 提醒</h3><p id="myLineStatus"></p><button id="bindMyLine">綁定我的 LINE</button><button id="unlinkMyLine" hidden>解除綁定</button><p id="lineBindStep" hidden>到 LINE 按「傳送」，再回到這裡。<br><a id="openLineBinding" class="button" target="_blank" rel="noopener noreferrer">前往 LINE 傳送</a></p><details><summary>Email 提醒（選用）</summary><p id="myEmailStatus"></p><label>Email<input id="notifyEmail" type="email" autocomplete="email" maxlength="254"></label><button id="sendEmailCode">寄送驗證碼</button><div id="emailCodeStep" hidden><label>驗證碼<input id="emailCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button id="verifyEmailCode">確認綁定</button></div><button id="unlinkEmail" hidden>解除 Email</button></details></section><button id="enrollFace">啟用自己的 Face ID</button><button id="logout">登出並鎖定</button><p><a id="personalLink" href="private-calendar.html" hidden>回到我的私人行事曆</a></p><p id="memberLink" class="small"></p>
<section id="memberManagement" hidden><h3>成員管理</h3><label>姓名<input id="inviteName" maxlength="50" placeholder="輸入對方姓名"></label><button id="inviteButton" class="primary">邀請加入</button><div id="inviteResult" hidden><label>邀請連結<input id="inviteUrl" readonly></label><button id="copyInvite">複製連結</button></div><div id="members"></div></section></dialog>
<dialog id="attachmentViewer"><div class="dialogHead"><h2 id="attachmentTitle">附件</h2><button type="button" data-close="attachmentViewer" aria-label="關閉附件">×</button></div><p id="attachmentStatus" role="status"></p><div id="attachmentBody"></div></dialog>
<dialog id="editor"><form id="taskForm"><div class="dialogHead"><h2 id="editorTitle">新增交辦</h2><button type="button" data-close="editor" aria-label="關閉">×</button></div>
<fieldset id="editFields"><label>事情名稱<input id="title" required maxlength="200" placeholder="例如：客人明天下午來換吉他弦"></label><section class="hourPicker"><label>日期<input id="hourDate" type="date" required></label><div id="hourGrid" class="hourGrid" role="group" aria-label="每格一小時，可多選"></div><p id="hourSummary" aria-live="polite"></p></section><details id="preciseTime"><summary>特定時間</summary><label class="check"><input id="preciseUse" type="checkbox">使用下方的特定時間</label><div class="two"><label>開始日期與時間<input id="start" type="datetime-local" required></label><label>結束日期與時間<input id="end" type="datetime-local" required></label></div></details><label>交給誰處理<select id="assignee"></select></label><label>交代內容<textarea id="note" rows="4" maxlength="12000" placeholder="客人需求、討論結果、要注意的事…"></textarea></label><section class="attachments"><strong>截圖與錄音</strong><p class="small">可以貼上截圖；每件最多 12 個附件，每檔 5 MB。附件只供有權限的人查看。</p><label class="button">上傳附件<input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,audio/*" multiple hidden></label><button id="record" type="button">● 錄音說明</button><p id="recordStatus" role="status"></p></section>
<label class="check"><input id="remind" type="checkbox" checked>提醒負責人</label><div id="reminderChoices" class="reminderChoices" role="group" aria-label="提醒時間，可複選"></div>
</fieldset>
<div id="assets"></div><div id="progressBar" hidden><label>處理進度<select id="progress"><option value="pending">待處理</option><option value="in_progress">處理中</option><option value="done">已完成</option><option value="cancelled">已取消</option></select></label><button id="updateProgress" type="button">更新進度並通知建立者</button></div><p id="deliveryStatus" class="small"></p><p id="formMessage" role="status"></p><div class="dialogFoot"><button id="save" class="primary" type="submit">儲存並交辦</button></div></form></dialog>
<script src="vendor/simplewebauthn-browser-13.3.0.umd.min.js"></script><script src="private-calendar-hours.js?v=20260925-14"></script><script src="shared-calendar-jobs.js?v=20260925-line-bind"></script><script src="shared-calendar.js?v=20260925-work-inbox"></script></body></html>
