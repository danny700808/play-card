<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24735c">
  <title>正在開啟老師課務｜柚子樂器</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (!params.has('from')) params.set('from', 'employee');
      location.replace('teacher-course-portal.html?' + params.toString());
    })();
  </script>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f3;color:#19352e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.loading{width:min(100%,360px);display:flex;align-items:center;gap:14px;padding:18px 20px;border:1px solid #dbe5df;border-radius:18px;background:#fff;box-shadow:0 12px 35px rgba(27,62,51,.11)}.spinner{width:28px;height:28px;flex:0 0 auto;border:3px solid #cce6db;border-right-color:#24735c;border-radius:50%;animation:spin .7s linear infinite}.loading strong{display:block;font-size:17px}.loading small{display:block;margin-top:3px;color:#667871}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loading"><span class="spinner"></span><div><strong>正在開啟老師課務</strong><small>登入後會直接顯示課表。</small></div></div>
