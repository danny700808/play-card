<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>我的資料｜老師課務</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="teacher-more-pages.css?v=20260808-announcement-layout-v1">
  <link rel="stylesheet" href="global-nav.css?v=20260808-teacher-nav-v1">
  <style>
    :root{--profile-green:#1f6b4f;--profile-soft:#edf7f2}
    body{background:#eef4f1;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
    .teacher-profile-shell{width:min(720px,calc(100% - 24px));margin:0 auto;padding:14px 0 24px}
    .profile-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .profile-nav button{min-height:48px;border-radius:14px;border:1px solid #cbd8d1;background:#fff;color:#294b3e;font-weight:900;font-size:16px}
    .profile-nav .logout{color:#a33f3f;background:#fff8f8;border-color:#eccaca}
    .profile-card{background:#fff;border:1px solid #d5e1db;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 5px 16px rgba(27,72,54,.06)}
    .profile-card h1,.profile-card h2{margin:0;color:#173c2f}
    .profile-card h1{font-size:27px}.profile-card h2{font-size:20px}
    .profile-subtitle{color:#65756e;margin:6px 0 0;line-height:1.6}
    .profile-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .channel-row{display:flex;gap:8px;flex-wrap:wrap}
    .channel-chip{display:inline-flex;align-items:center;min-height:34px;padding:5px 11px;border-radius:999px;background:#edf7f2;color:#1f6b4f;font-size:13px;font-weight:900}
    .channel-chip.off{background:#f2f3f3;color:#6e7773}
    .profile-form{display:grid;gap:14px}
    .profile-form .field{margin:0}.profile-form label{display:block;font-weight:900;color:#253f35;margin-bottom:6px}
    .profile-form input,.profile-form textarea,.profile-form select{box-sizing:border-box;width:100%;font-size:16px;border-radius:13px}
    .birth-select-row{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:8px}
    .birth-select-row select{min-width:0;background:#fff}
    .section-heading{padding-top:5px;border-top:1px solid #e5ece8}.section-heading:first-child{border-top:0;padding-top:0}
    .section-heading h2{font-size:20px}.section-heading p{margin:4px 0 0;color:#6c7973;font-size:14px}
    .identity-grid{display:grid;grid-template-columns:1fr;gap:12px;padding:13px;border-radius:16px;background:#f8faf9;border:1px solid #e1e9e5}
    .teaching-list{display:grid;gap:9px}
    .teaching-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 42px;gap:8px;align-items:end}
    .teaching-row button{min-height:48px;border:0;border-radius:12px;background:#fff0ef;color:#a12d27;font-weight:900;font-size:20px}
    .add-teaching{min-height:46px;border:1px dashed #83ac99;border-radius:13px;background:#f4fbf7;color:#1f6b4f;font-weight:900}
    .required{color:#bb3c34;margin-left:3px}
    .field-help{font-size:13px;color:#6c7973;margin-top:5px;line-height:1.55}
    .file-state{margin-top:8px;padding:10px 12px;background:#f3f7f5;border-radius:12px;color:#496158;font-size:14px;font-weight:800}
    .file-actions{display:grid;grid-template-columns:1fr;gap:10px}
    .file-action{display:flex!important;align-items:center;justify-content:center;min-height:48px;margin:0!important;border:1px solid #aac6b8;border-radius:13px;background:#f4fbf7;color:#1f6b4f;font-weight:900;cursor:pointer}
    .file-input-hidden{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
    .form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
    .form-actions button{min-height:52px;border-radius:14px;font-size:17px;font-weight:900}
    .primary-action{border:0;background:var(--profile-green);color:#fff}
    .secondary-action{border:1px solid #b9cbc2;background:#fff;color:#245541}
    .profile-message{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;background:#edf7f2;color:#245541;font-weight:800;line-height:1.55}
    .profile-message.error{background:#fff0ef;color:#a12d27}
    .profile-loading{display:flex;align-items:center;gap:10px;color:#4f655b;font-weight:800}
    .profile-loading::before{content:"";width:20px;height:20px;border:3px solid #bfd2c8;border-top-color:var(--profile-green);border-radius:50%;animation:profile-spin .8s linear infinite}
    @keyframes profile-spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}
    @media(max-width:520px){
      .teacher-profile-shell{width:min(100% - 16px,720px);padding-top:8px}
      .profile-card{padding:15px;border-radius:17px}.profile-card h1{font-size:24px}
      .form-actions,.file-actions{grid-template-columns:1fr}
      .birth-select-row{grid-template-columns:1.35fr .9fr .9fr;gap:6px}
      .birth-select-row select{padding-left:8px;padding-right:6px}
    }
  </style>
  <script src="config.js?v=20260808-person-master-v1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="teacher-more-auth-bridge.js?v=20260808-person-master-v1"></script>
</head>
<body>
  <main class="teacher-profile-shell">
    <nav class="yz-global-nav yz-teacher-nav" data-yz-teacher-nav aria-label="頁面操作">
      <button class="yz-nav-btn yz-nav-back" type="button" id="profileBackBtn">回老師課務</button>
      <button class="yz-nav-btn yz-nav-logout" type="button" id="profileLogoutBtn">登出</button>
    </nav>

    <section class="profile-card">
      <div class="profile-title-row">
        <h1>我的資料</h1>
        <div class="channel-row" aria-label="登入綁定狀態">
          <span class="channel-chip off" id="profileLineStatus">LINE 未綁定</span>
          <span class="channel-chip off" id="profileEmailStatus">Email 未綁定</span>
        </div>
      </div>
      <div class="profile-message" id="profileMessage" role="status" aria-live="polite"></div>
    </section>

    <section class="profile-card" id="profileLoadingCard">
      <div class="profile-loading">資料讀取中</div>
    </section>

    <form class="profile-card profile-form hidden" id="teacherProfileForm" novalidate>
      <div class="section-heading"><h2>基本資料</h2></div>
      <div class="field">
        <label for="profileName">姓名<span class="required">*</span></label>
        <input id="profileName" name="name" autocomplete="name" maxlength="80">
      </div>
      <div class="field">
        <label for="profileMobile">行動電話<span class="required">*</span></label>
        <input id="profileMobile" name="mobilePhone" inputmode="tel" autocomplete="tel" maxlength="30">
      </div>
      <div class="field">
        <label for="profileEmail">Email</label>
        <input id="profileEmail" name="email" type="email" autocomplete="email" maxlength="160">
      </div>
      <div class="field">
        <label for="profileBirthYear">出生年月日<span class="required">*</span></label>
        <input id="profileBirthDate" name="birthDate" type="hidden">
        <div class="birth-select-row" aria-label="出生年月日">
          <select id="profileBirthYear" aria-label="出生年份"><option value="">年份</option></select>
          <select id="profileBirthMonth" aria-label="出生月份"><option value="">月份</option></select>
          <select id="profileBirthDay" aria-label="出生日期"><option value="">日期</option></select>
        </div>
        <div class="field-help">依序選擇年、月、日；手機可直接滑動選單。</div>
      </div>
      <div class="field">
        <label for="profileHouseholdAddress">戶籍地址<span class="required">*</span></label>
        <input id="profileHouseholdAddress" name="householdAddress" autocomplete="street-address" maxlength="240">
      </div>
      <div class="field">
        <label for="profileMailingAddress">通訊地址<span class="required">*</span></label>
        <input id="profileMailingAddress" name="mailingAddress" autocomplete="street-address" maxlength="240">
        <button class="add-teaching" id="profileCopyAddress" type="button">同戶籍地址</button>
      </div>
      <div class="field">
        <label for="profileEmergencyContact">緊急聯絡人<span class="required">*</span></label>
        <input id="profileEmergencyContact" name="emergencyContact" maxlength="80">
      </div>
      <div class="field">
        <label for="profileEmergencyPhone">緊急聯絡人電話<span class="required">*</span></label>
        <input id="profileEmergencyPhone" name="emergencyPhone" inputmode="tel" maxlength="30">
      </div>

      <div class="section-heading"><h2>身分資料</h2></div>
      <div class="identity-grid">
        <div class="field">
          <label for="profileIdNumber">身分證字號<span class="required">*</span></label>
          <input id="profileIdNumber" name="idNumber" autocapitalize="characters" maxlength="30">
          <div class="field-help" id="profileIdHint"></div>
        </div>
        <div class="field">
          <label>身分證明照片<span class="required">*</span></label>
          <div class="file-actions">
            <label class="file-action" for="profileIdentityFiles">拍照或選擇照片</label>
          </div>
          <input class="file-input-hidden" id="profileIdentityFiles" name="identityFiles" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple>
          <div class="field-help">Android／Apple 手機會讓你選擇直接拍照或從相簿挑選；支援一般手機圖片，送出前會自動轉成 JPG。正反面最多 2 張。</div>
          <div class="file-state" id="profileFileState">尚未上傳</div>
        </div>
      </div>

      <div class="section-heading"><h2>授課能力</h2></div>
      <div class="teaching-list" id="profileTeachingList"></div>
      <button class="add-teaching" id="profileAddTeaching" type="button">＋ 新增授課項目</button>
      <div class="form-actions">
        <button class="secondary-action" id="profileSaveBtn" type="submit">儲存，下次繼續</button>
        <button class="primary-action" id="profileSubmitBtn" type="button">送出管理者確認</button>
      </div>
    </form>

    <section class="profile-card hidden" id="profileErrorCard">
      <h2>目前無法讀取資料</h2>
      <p class="profile-subtitle" id="profileErrorText"></p>
      <div class="form-actions">
        <button class="secondary-action" id="profileRetryBtn" type="button">重新讀取</button>
        <button class="primary-action" id="profileErrorBackBtn" type="button">回老師課務</button>
      </div>
    </section>
  </main>
  <script src="teacher-profile.js?v=20260808-mobile-profile-v2"></script>
</body>
</html>
